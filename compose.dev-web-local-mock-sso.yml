---
# LOCAL-DEV-ONLY overlay: layer ON TOP of compose.dev-web-local.yml to boot
# lets-chat-server without the full bunyip dev-sso stack.
#
#   docker compose -f compose.dev-web-local.yml -f compose.dev-web-local-mock-sso.yml up
#   (or: `just dev-web-local-mock`)
#
# Since the LC-22 cutover the server refuses to start unless a Bunyip SSO OP
# answers discovery + JWKS at boot. This overlay adds a tiny mock OP
# (dev/mock-oidc.py) and points the four LETS_CHAT_BUNYIP_SSO_* vars at it, so
# the server boots without the full bunyip dev-sso stack.
#
# LC-577: the mock now implements a real authorization-code flow, so a login
# COMPLETES and every authenticated page (room view, /settings, the home
# dashboard, the thread and details panels) renders and is screenshot-verifiable
# here. It previously could not authenticate at all, which left only
# GET /dev/theme-gallery and other unauthenticated debug routes reachable.
#
# It authenticates one fixed identity with no password and no consent screen.
# NEVER use this overlay outside local dev.
services:

  app:
    environment:
      LETS_CHAT_BUNYIP_SSO_ISSUER: http://mock-oidc:9000
      LETS_CHAT_BUNYIP_SSO_CLIENT_ID: mock-client
      LETS_CHAT_BUNYIP_SSO_CLIENT_SECRET: mock-secret
      LETS_CHAT_BUNYIP_SSO_REDIRECT_URI: http://localhost:18080/auth/bunyip/callback
    depends_on:
      - mock-oidc

  mock-oidc:
    # LC-577: signing a real EdDSA id_token needs `cryptography`, which has no
    # prebuilt musl wheel - on alpine it would compile from source on every
    # boot. `slim` is glibc, so both deps land as wheels in a second or two.
    image: python:3-slim
    container_name: dev-lets-chat-mock-oidc-${USER}
    restart: "no"
    # LC-577: the issuer is the compose-internal host `mock-oidc:9000`, which the
    # app resolves via compose DNS. A browser on the HOST cannot resolve that, and
    # the browser is what follows the /authorize redirect. Publish the same port on
    # the host and point the browser's resolver at it:
    #   chrome --host-resolver-rules="MAP mock-oidc 127.0.0.1"
    # One issuer string then stays valid for both sides (it must match both the
    # discovery doc and the id_token `iss`), with no /etc/hosts edit needed.
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ./dev/mock-oidc.py:/mock-oidc.py:ro
    command:
      - sh
      - -c
      - pip install --quiet --root-user-action=ignore "pyjwt[crypto]" && exec python3 /mock-oidc.py
