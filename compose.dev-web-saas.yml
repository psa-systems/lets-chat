---
# `just dev-web-saas` - build the production multi-stage image with
# BUILD_MODE=saas and attach it to the shared Traefik network so it
# serves at https://${USER}-chat.a8n.run. Same shape as compose.dev-web.yml
# with the BUILD_MODE arg flipped; the two are kept as separate files so
# the just recipe name maps 1:1 to the compose file name and the running
# project stays distinct from the standalone variant.
name: dev-web-saas-${USER}

services:

  app:
    build:
      context: .
      dockerfile: ci-build/Dockerfile.web
      args:
        BUILD_MODE: saas
        # See compose.dev-web.yml: lift the Dockerfile's CI-oriented job cap of
        # 2 for local single-image builds. Override with `CARGO_BUILD_JOBS=N`.
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-16}
        GIT_HASH: ${GIT_HASH:-unknown}
        GIT_VERSION: ${GIT_VERSION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: dev-lets-chat-web-saas-${USER}
    restart: unless-stopped
    environment:
      RUST_LOG: lets_chat=debug
      LETS_CHAT_DATA_DIR: /data
      LETS_CHAT_SECRET_KEY: sghsgG8vVnvr9gddWwrL03
      BIND_ADDR: 0.0.0.0:8080
      # See compose.dev-web.yml for the optional LETS_CHAT_SMTP_* /
      # LETS_CHAT_BASE_URL block; the same env vars apply here.
    volumes:
      - lets-chat-data:/data
    networks:
      - default
      - network-traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=network-traefik-public"
      - "traefik.http.routers.chat-${USER}.rule=Host(`${USER}-chat.a8n.run`)"
      - "traefik.http.routers.chat-${USER}.service=chat-${USER}@docker"
      - "traefik.http.routers.chat-${USER}.entrypoints=web-secure"
      - "traefik.http.routers.chat-${USER}.tls.certresolver=cert-cloudflare"
      - "traefik.http.services.chat-${USER}.loadbalancer.server.port=8080"

volumes:
  lets-chat-data:

networks:
  network-traefik-public:
    external: true
