{% extends "base.html" %}

{% block body %}
<div hx-ext="ws" ws-connect="/ws" class="flex h-screen">
  {% include "partials/connection_status.html" %}
  <div id="lc-nav-panel" class="hidden md:flex fixed inset-y-0 left-0 z-30 md:static md:z-auto">
    {% let oob = false %}
    {% include "partials/enclave_switcher.html" %}
    {% include "partials/sidebar.html" %}
  </div>
  <div id="lc-nav-backdrop" class="hidden fixed inset-0 z-20 bg-black/40 md:hidden" onclick="lcCloseNav()"></div>
  <main id="main" class="flex-1 flex flex-col overflow-hidden min-h-0">
    <button type="button" aria-label="Open navigation"
      class="md:hidden inline-flex items-center gap-2 border-b border-slate-200 px-3 py-2 text-slate-600 hover:text-slate-900"
      onclick="lcOpenNav()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5">
        <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
      </svg>
      <span>Menu</span>
    </button>
    {% block main %}{% endblock %}
  </main>
  <div id="status-events-slot" class="hidden"></div>
  <div id="lc-notify-bus" class="sr-only" aria-live="polite" aria-relevant="additions" aria-atomic="false"></div>
  <div id="lc-call-bus" class="hidden"></div>
  <div id="lc-voice-bus" class="hidden"></div>
  <div id="lc-call-root" data-lc-call-root data-self-id="{{ user.id }}">
    <div data-lc-call-incoming class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50">
      <div class="w-80 rounded-lg bg-white p-6 text-center shadow-xl">
        <div class="text-sm text-slate-500">Incoming call</div>
        <div data-lc-call-incoming-name class="mt-1 text-lg font-semibold"></div>
        <div class="mt-5 flex justify-center gap-3">
          <button type="button" data-lc-call-accept class="rounded bg-green-600 px-4 py-2 text-sm font-medium text-white hover:bg-green-700">Accept</button>
          <button type="button" data-lc-call-decline class="rounded bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700">Decline</button>
        </div>
      </div>
    </div>
    <div data-lc-call-active class="hidden fixed inset-0 z-50 flex flex-col bg-slate-900">
      <div class="relative flex-1 overflow-hidden">
        <video data-lc-remote-video autoplay playsinline class="absolute inset-0 h-full w-full bg-black object-contain"></video>
        <img data-lc-remote-avatar alt="" src=""
             class="absolute inset-0 m-auto h-32 w-32 rounded-full object-cover">
        <div class="absolute bottom-4 right-4 h-32 w-44 overflow-hidden rounded-lg border border-slate-700 bg-black shadow-lg">
          <video data-lc-local-video autoplay playsinline muted class="h-full w-full object-cover"></video>
          <img data-lc-local-avatar src="/avatars/{{ user.id }}" alt="{{ user.display_label() }}"
               class="absolute inset-0 m-auto h-14 w-14 rounded-full object-cover">
        </div>
        <div data-lc-call-status aria-live="polite" class="absolute left-1/2 top-6 -translate-x-1/2 max-w-[80vw] truncate rounded-full bg-black/60 px-4 py-1 text-sm text-white"></div>
      </div>
      <div class="flex items-center justify-center gap-3 bg-slate-800 py-4">
        <button type="button" data-lc-call-mute class="rounded-full bg-slate-700 px-4 py-2 text-sm text-white hover:bg-slate-600">Mute</button>
        <button type="button" data-lc-call-camera class="rounded-full bg-slate-700 px-4 py-2 text-sm text-white hover:bg-slate-600">Start video</button>
        <button type="button" data-lc-call-hangup class="rounded-full bg-red-600 px-6 py-2 text-sm font-medium text-white hover:bg-red-700">Hang up</button>
      </div>
    </div>
  </div>
  <div id="lc-mention-counts" class="hidden"
       data-base-title="lets-chat"
       data-browser-enabled="{% if user.notify_browser_enabled %}1{% else %}0{% endif %}"
       data-sound-enabled="{% if user.notify_sound_enabled %}1{% else %}0{% endif %}"
       data-push-enabled="{% if user.notify_push_enabled %}1{% else %}0{% endif %}"></div>
</div>
<script>
// Persistent-shell script: lives in layout.html, runs once per full browser
// page load, never re-rendered by in-place swaps (the reconnect soft-refresh
// targets #main, which is below this script). No htmx:beforeCleanupElement
// teardown needed; the observer + state are intentionally lifetime-of-page.
(function(){
  // Hidden DOM "bus": every Mentioned/MentionCleared WS frame is rendered as
  // a <div data-event=...> appended here. We watch it, translate each child
  // into title flash + favicon dot + (background-only) sound + browser
  // notification, then drain.
  var bus = document.getElementById('lc-notify-bus');
  var cfg = document.getElementById('lc-mention-counts');
  if (!bus || !cfg) return;
  var baseTitle = cfg.getAttribute('data-base-title') || document.title;
  var browserEnabled = cfg.getAttribute('data-browser-enabled') === '1';
  var soundEnabled = cfg.getAttribute('data-sound-enabled') === '1';
  var pushEnabled = cfg.getAttribute('data-push-enabled') === '1';
  var counts = {};               // room_id -> unread mention count
  var permPrompted = false;      // gate the one-shot Notification permission prompt
  var pushTried = false;         // gate the one-shot service-worker registration
  function urlBase64ToUint8Array(s){
    var pad = '='.repeat((4 - s.length % 4) % 4);
    var b64 = (s + pad).replace(/-/g, '+').replace(/_/g, '/');
    var raw = atob(b64);
    var arr = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }
  async function tryRegisterPush(){
    if (pushTried || !pushEnabled) return;
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    pushTried = true;
    try {
      var resp = await fetch('/push/vapid-public-key');
      if (!resp.ok) return;
      var data = await resp.json();
      var reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
      var existing = await reg.pushManager.getSubscription();
      var sub = existing || await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(data.key),
      });
      var json = sub.toJSON();
      await fetch('/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          endpoint: json.endpoint,
          keys: { p256dh: json.keys.p256dh, auth: json.keys.auth },
        }),
      });
    } catch (e) { console.warn('push registration failed', e); }
  }
  // Title + favicon reflect the running total; called after every event.
  function refresh(){
    var n = 0; for (var k in counts) n += counts[k];
    document.title = n > 0 ? '(' + n + ') ' + baseTitle : baseTitle;
    var link = document.getElementById('lc-favicon');
    if (link) link.href = n > 0 ? '/assets/favicon-dot.svg' : '/assets/favicon.svg';
  }
  // OOB-style replace of the sidebar mention chip. n=0 collapses to an empty span.
  function paintBadge(roomId, n){
    var el = document.getElementById('mention-room-' + roomId);
    if (!el) return;
    el.outerHTML = n > 0
      ? '<span id="mention-room-' + roomId + '" class="ml-1 text-[10px] font-bold uppercase bg-red-600 text-white rounded px-1.5">@' + n + '</span>'
      : '<span id="mention-room-' + roomId + '"></span>';
  }
  // Browser Notification API: lazy-prompt for permission on the first qualifying event.
  function fireNotification(d){
    if (!browserEnabled || !('Notification' in window)) return;
    if (Notification.permission === 'denied') return;
    if (Notification.permission !== 'granted') {
      if (!permPrompted) {
        permPrompted = true;
        Notification.requestPermission().then(function(p){
          if (p === 'granted') tryRegisterPush();
        });
      }
      return;
    }
    tryRegisterPush();
    var title = d.kind === 'dm' ? 'Direct message from ' + d.author : d.author + ' mentioned you in ' + d.roomLabel;
    try {
      var n = new Notification(title, { body: d.snippet, tag: 'lc-' + d.target });
      n.onclick = function(){ window.focus(); location.assign(d.target); n.close(); };
    } catch (e) {}
  }
  function playSound(){
    if (!soundEnabled) return;
    try { var p = new Audio('/assets/notify.ogg').play(); if (p && p.catch) p.catch(function(){}); } catch (e) {}
  }
  // Translate one bus child into all of its side effects.
  function process(node){
    var ev = node.getAttribute('data-event');
    var roomId = node.getAttribute('data-room-id');
    if (ev === 'mentioned') {
      counts[roomId] = (counts[roomId] || 0) + 1;
      var target = node.getAttribute('data-target');
      var bg = document.hidden || location.pathname !== target;
      if (bg) {
        fireNotification({
          kind: node.getAttribute('data-kind'),
          roomLabel: node.getAttribute('data-room-label'),
          author: node.getAttribute('data-author'),
          snippet: node.getAttribute('data-snippet'),
          target: target
        });
        playSound();
      }
      // DMs don't show a sidebar @ chip - the existing DM unread badge covers them.
      if (node.getAttribute('data-kind') !== 'dm') paintBadge(roomId, counts[roomId]);
    } else if (ev === 'mention_cleared') {
      if (counts[roomId]) counts[roomId] = Math.max(0, counts[roomId] - 1);
      paintBadge(roomId, counts[roomId] || 0);
    }
    refresh();
  }
  // Drain debouncer. The bus is now an aria-live region (sr-only in the
  // accessibility tree, visually hidden) so newly-added children get read
  // by the SR. We must NOT immediately replaceChildren() the way the old
  // code did - that removes the node before the SR reads its text. The
  // refactor:
  //   1. Visual + audio + push side effects still fire synchronously in
  //      process(node), unchanged. Those are independent of the SR drain.
  //   2. For `mentioned` events only, write a SR-readable summary into the
  //      same node's textContent so the live-region announcement carries
  //      text. mention_cleared has no announcement; it stays empty.
  //   3. Drain children 2000ms after the LAST mutation. Burst of mentions
  //      cleared in one shot; SR has already announced each one because
  //      aria-live + aria-relevant="additions" fires per child added.
  // 2000ms is conservative against the typical 100-300ms SR pickup window;
  // tune down only after confirming announcements still land on the SR
  // you test against.
  function announceForScreenReader(node){
    if (node.getAttribute('data-event') !== 'mentioned') return;
    var kind = node.getAttribute('data-kind');
    var author = node.getAttribute('data-author') || 'Someone';
    var roomLabel = node.getAttribute('data-room-label') || '';
    node.textContent = kind === 'dm'
      ? 'Direct message from ' + author
      : 'Mention from ' + author + (roomLabel ? ' in ' + roomLabel : '');
  }
  var drainTimer = null;
  new MutationObserver(function(muts){
    muts.forEach(function(m){
      Array.prototype.forEach.call(m.addedNodes, function(n){
        if (n.nodeType !== 1) return;
        process(n);                  // visual / audio / push - immediate, unchanged
        announceForScreenReader(n);  // sr-only summary into node.textContent
      });
    });
    if (drainTimer) clearTimeout(drainTimer);
    drainTimer = setTimeout(function(){
      drainTimer = null;
      bus.replaceChildren();
    }, 2000);
  }).observe(bus, { childList: true });
})();
</script>
<script>
// Persistent-shell script: same lifetime rationale as the notification-bus
// IIFE above. The document.body click listener is intentionally permanent.
function lcOpenNav(){
  var p = document.getElementById('lc-nav-panel');
  p.classList.remove('hidden');
  p.classList.add('flex');
  document.getElementById('lc-nav-backdrop').classList.remove('hidden');
}
function lcCloseNav(){
  if (window.matchMedia('(min-width: 768px)').matches) return;
  var p = document.getElementById('lc-nav-panel');
  p.classList.add('hidden');
  p.classList.remove('flex');
  document.getElementById('lc-nav-backdrop').classList.add('hidden');
}
document.body.addEventListener('click', function(e){
  if (window.matchMedia('(min-width: 768px)').matches) return;
  var link = e.target.closest('#lc-nav-panel a');
  if (link) lcCloseNav();
});
</script>
<script>
// Persistent-shell script: same lifetime rationale as the two scripts above.
// The body listeners for htmx:wsOpen / htmx:wsAfterMessage / htmx:wsClose /
// htmx:wsError, the watchdog timers, and the manual-reconnect helper are
// all lifetime-of-page by design.
(function(){
  // ----- 1. htmx-dependent setup ---------------------------------
  // This inline script executes during body parsing, BEFORE the deferred
  // htmx.min.js in <head> has loaded, so `window.htmx` is undefined here.
  // Defer anything that needs htmx until DOMContentLoaded, which fires
  // after every deferred script in the document has executed.
  function onReady(fn) {
    if (document.readyState !== 'loading') fn();
    else document.addEventListener('DOMContentLoaded', fn);
  }
  onReady(function() {
    if (!window.htmx) return;
    // Capped jittered exponential backoff: 1s, 2s, 4s, 8s, 16s, 30s,
    // 30s... +/-20% jitter. Replaces the extension's default
    // `full-jitter` which is uncapped (exceeds 30s after ~6 retries).
    htmx.config.wsReconnectDelay = function(retryCount) {
      var base = Math.min(1000 * Math.pow(2, retryCount), 30000);
      var jitter = 0.8 + Math.random() * 0.4; // [0.8, 1.2)
      return Math.round(base * jitter);
    };
    // Force a reconnect for close codes the htmx-ext-ws extension would
    // otherwise ignore (anything outside 1006/1012/1013, e.g. a clean
    // server-initiated 1000/1001 close on container shutdown, or the
    // watchdog's 4000). The extension stashes its wrapper under the
    // `htmx-internal-data` property on the [ws-connect] element; reading
    // it directly avoids defining a companion extension, which would
    // have to be registered *before* htmx processes the body and so
    // could not be set up from this same inline script.
    window.__lcReconnectWS = function() {
      var elt = document.querySelector('[ws-connect]');
      if (!elt) return;
      var data = elt['htmx-internal-data'];
      if (data && data.webSocket && data.webSocket.init) {
        data.webSocket.init();
      }
    };
  });

  // ----- 2. Banner state machine ---------------------------------
  var bannerEl = document.getElementById('lc-conn-status');
  var textEl   = document.getElementById('lc-conn-status-text');
  if (!bannerEl || !textEl) return;

  var state = 'connected';   // 'connected' | 'reconnecting' | 'failed-long'
  var rawSocket = null;       // captured from htmx:wsOpen
  var watchdog = null;        // 60s half-open detector
  var escalateTimer = null;   // 5min "still trying" escalation
  var WATCHDOG_MS = 60 * 1000;
  var ESCALATE_MS = 5 * 60 * 1000;

  function setBanner(next, msg) {
    bannerEl.setAttribute('data-state', next);
    textEl.textContent = msg || '';
    // Escalate to role=alert when the failure has been ongoing long
    // enough to merit interruption (matches the visual escalation to
    // red). Brief reconnects and the green "connected" flash stay
    // polite (role=status) so they do not step on whatever the user
    // is reading. aria-live="polite" is set in the template; role
    // swap is what changes the assertive vs. polite behavior.
    textEl.setAttribute('role', next === 'failed-long' ? 'alert' : 'status');
  }

  function startWatchdog() {
    clearTimeout(watchdog);
    watchdog = setTimeout(function(){
      // Half-open: no inbound traffic in WATCHDOG_MS. Force the
      // socket closed; our htmx:wsClose handler will trigger the
      // reconnect (the extension only auto-reconnects for codes
      // 1006/1012/1013, which we cannot set from user code).
      try { if (rawSocket) rawSocket.close(4000, 'lc-half-open'); } catch (e) {}
    }, WATCHDOG_MS);
  }

  function enterReconnecting() {
    if (state === 'reconnecting' || state === 'failed-long') return;
    state = 'reconnecting';
    setBanner('reconnecting', 'Connection lost. Reconnecting...');
    clearTimeout(escalateTimer);
    escalateTimer = setTimeout(function(){
      if (state === 'reconnecting') {
        state = 'failed-long';
        setBanner('failed-long', 'Still trying to reconnect. Check your internet connection.');
      }
    }, ESCALATE_MS);
  }

  function enterConnected(wasReconnecting) {
    var prev = state;
    state = 'connected';
    clearTimeout(escalateTimer);
    if (wasReconnecting || prev !== 'connected') {
      setBanner('connected-flash', 'Connected');
      setTimeout(function(){
        if (state === 'connected') setBanner('hidden', '');
      }, 500);
      // Soft-refresh the current page so the user sees missed
      // content. select:'#main' extracts just the <main> from the
      // full-page response; without it we would nest the layout
      // into #main.
      if (window.htmx && document.getElementById('main')) {
        try {
          htmx.ajax('GET', location.pathname + location.search, {
            target: '#main',
            swap: 'outerHTML',
            select: '#main'
          });
        } catch (e) { /* navigation away is fine */ }
      }
    } else {
      setBanner('hidden', '');
    }
  }

  document.body.addEventListener('htmx:wsOpen', function(evt){
    rawSocket = (evt.detail && evt.detail.event) ? evt.detail.event.target : null;
    // Expose the wrapper to call.js (and any other page-agnostic feature
    // that needs to send a frame). Previously set only from the DM page,
    // which left non-DM pages unable to send call control signals.
    if (evt.detail) window.__lcWS = evt.detail.socketWrapper;
    var wasReconnecting = (state !== 'connected');
    enterConnected(wasReconnecting);
    startWatchdog();
  });

  document.body.addEventListener('htmx:wsAfterMessage', function(){
    // Any inbound text frame (real OOB swap or `<!-- ping -->`)
    // counts as proof of life.
    if (state !== 'connected') enterConnected(true);
    startWatchdog();
  });

  document.body.addEventListener('htmx:wsClose', function(evt){
    enterReconnecting();
    clearTimeout(watchdog);
    // The extension auto-reconnects only for codes [1006, 1012, 1013].
    // For any other close code (clean 1000/1001 from server shutdown,
    // 1011 server error, our own 4000 from the watchdog), force a
    // manual reconnect via __lcReconnectWS.
    var code = evt && evt.detail && evt.detail.event && evt.detail.event.code;
    var autoReconnects = (code === 1006 || code === 1012 || code === 1013);
    if (!autoReconnects && window.__lcReconnectWS) {
      // Schedule on the next tick so the extension's own onclose
      // bookkeeping has finished first.
      setTimeout(window.__lcReconnectWS, 0);
    }
  });

  // wsError carries `evt.detail.error` (no `event` with a close code) and
  // always precedes wsClose, so it only updates the UI; the reconnect
  // decision is made when wsClose arrives. Triggering a manual reconnect
  // here too would race with the close handler and create overlapping
  // socket attempts.
  document.body.addEventListener('htmx:wsError', function(){
    enterReconnecting();
    clearTimeout(watchdog);
  });
})();
</script>
<script>
// Persistent-shell script: voice-message players. Each [data-lc-voice] node
// rendered by partials/attachment.html is wired here - on initial page load
// and again after every htmx swap (new messages arrive as WS OOB swaps, so
// the node is not present when this script first runs). Idempotent: a wired
// node is marked [data-lc-voice-ready] and skipped on re-scan.
(function(){
  var WAVE_BG = '#cbd5e1';     // slate-300, unplayed bars
  var WAVE_FG = '#2563eb';     // blue-600, played bars
  var current = null;          // the voice player currently playing, or null

  // One shared AudioContext for every player on the page. Browsers cap the
  // number of live AudioContexts (~6 in Chrome), so a per-player context
  // would break once a few clips have been opened.
  var AC = window.AudioContext || window.webkitAudioContext;
  var sharedCtx = null;
  function audioContext(){
    if (!sharedCtx && AC) sharedCtx = new AC();
    return sharedCtx;
  }

  function fmtTime(s){
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function parsePeaks(raw){
    if (!raw) return [];
    var out = [];
    raw.split(',').forEach(function(t){
      var v = parseFloat(t);
      if (isFinite(v)) out.push(Math.max(0, Math.min(1, v)));
    });
    return out;
  }

  function initVoice(el){
    if (el.hasAttribute('data-lc-voice-ready')) return;
    el.setAttribute('data-lc-voice-ready', '');

    var src = el.getAttribute('data-src');
    var canvas = el.querySelector('.lc-voice-wave');
    var playBtn = el.querySelector('.lc-voice-play');
    var timeEl = el.querySelector('.lc-voice-time');
    if (!src || !canvas || !playBtn || !timeEl) return;

    // No client-supplied waveform (degraded row): draw a flat low bar set so
    // the control still reads as an audio player.
    var peaks = parsePeaks(el.getAttribute('data-waveform'));
    if (peaks.length === 0) { for (var i = 0; i < 40; i++) peaks.push(0.15); }

    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;
    var n = peaks.length;
    var slot = W / n;
    var barW = Math.max(1, slot * 0.6);

    function draw(progress){
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < n; i++) {
        var h = Math.max(2, peaks[i] * H);
        var x = i * slot + (slot - barW) / 2;
        var y = (H - h) / 2;
        ctx.fillStyle = (i / n) < progress ? WAVE_FG : WAVE_BG;
        ctx.fillRect(x, y, barW, h);
      }
    }
    draw(0);

    // Recording duration captured client-side at record time. Drives the idle
    // time display before the clip has been decoded; once decoded, the exact
    // buffer.duration takes over.
    var storedDuration = parseFloat(el.getAttribute('data-duration'));
    if (!isFinite(storedDuration) || storedDuration <= 0) storedDuration = 0;
    if (storedDuration > 0) timeEl.textContent = fmtTime(storedDuration);

    // Playback uses the Web Audio API rather than an <audio> element: the
    // element's streaming decoder emits an audible click at the head of a
    // MediaRecorder WebM/Opus clip. decodeAudioData decodes the whole buffer
    // up front (the same clean decode ffmpeg performs) and an
    // AudioBufferSourceNode plays the resulting PCM with no start glitch.
    // Voice clips are small, so the one-shot full fetch + decode is cheap.
    var buffer = null;       // decoded AudioBuffer, once loaded
    var loadPromise = null;  // de-dupes concurrent loads
    var node = null;         // live AudioBufferSourceNode while playing
    var offset = 0;          // paused playback position, seconds
    var startCtxTime = 0;    // audioContext().currentTime when `node` started
    var playing = false;
    var raf = 0;

    function duration(){
      return buffer ? buffer.duration : storedDuration;
    }
    function currentPos(){
      var actx = audioContext();
      var pos = (playing && actx) ? offset + (actx.currentTime - startCtxTime) : offset;
      var d = duration();
      return d > 0 ? Math.min(pos, d) : Math.max(0, pos);
    }
    function paint(){
      var d = duration();
      var pos = currentPos();
      draw(d > 0 ? pos / d : 0);
      timeEl.textContent = fmtTime(pos);
    }
    function frameLoop(){
      paint();
      if (playing) raf = requestAnimationFrame(frameLoop);
    }
    function clearNode(){
      if (node) {
        node.onended = null;  // so a manual stop does not run the end handler
        try { node.stop(); } catch (e) {}
        node = null;
      }
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
    }

    function ensureBuffer(){
      if (buffer) return Promise.resolve(buffer);
      if (loadPromise) return loadPromise;
      var ctx = audioContext();
      if (!ctx) return Promise.reject(new Error('Web Audio unavailable'));
      el.setAttribute('data-loading', '');
      loadPromise = fetch(src, { credentials: 'same-origin' })
        .then(function(r){ return r.arrayBuffer(); })
        .then(function(ab){ return ctx.decodeAudioData(ab); })
        .then(function(buf){
          buffer = buf;
          el.removeAttribute('data-loading');
          return buf;
        })
        .catch(function(e){
          el.removeAttribute('data-loading');
          loadPromise = null;  // allow a retry on the next click
          throw e;
        });
      return loadPromise;
    }

    // Exposed to the shared `current` slot so a newly started clip can pause
    // whichever one was already playing.
    var api = {
      el: el,
      pause: function(){
        if (!playing) return;
        offset = currentPos();
        playing = false;
        clearNode();
        el.removeAttribute('data-playing');
        paint();
      },
    };

    // Synchronously (re)start playback from `pos` seconds. The buffer must
    // already be decoded. Both play() and seek route through this so there is
    // no async gap between updating the position and the node restarting - a
    // gap let a stale animation frame repaint the old playhead.
    function startFrom(pos){
      var actx = audioContext();
      if (!actx || !buffer) return;
      if (current && current !== api) current.pause();
      current = api;
      if (actx.state === 'suspended') actx.resume();
      clearNode();
      // Clamp just inside the end so a click at the far edge of the waveform
      // does not land exactly on buffer.duration (which would play nothing
      // and immediately fire `ended`, snapping back to 0).
      offset = Math.max(0, Math.min(pos, buffer.duration - 0.05));
      node = actx.createBufferSource();
      node.buffer = buffer;
      node.connect(actx.destination);
      node.onended = function(){
        // Natural end only; manual stops null this handler in clearNode().
        clearNode();
        playing = false;
        offset = 0;
        el.removeAttribute('data-playing');
        draw(0);
        timeEl.textContent = '0:00';
        if (current === api) current = null;
      };
      startCtxTime = actx.currentTime;
      node.start(0, offset);
      playing = true;
      el.setAttribute('data-playing', '');
      frameLoop();
    }

    function play(){
      if (buffer) {
        startFrom(offset);
        return;
      }
      ensureBuffer()
        .then(function(){ startFrom(offset); })
        .catch(function(){ el.removeAttribute('data-loading'); });
    }

    playBtn.addEventListener('click', function(){
      if (playing) api.pause();
      else play();
    });

    // Click the waveform to seek.
    canvas.addEventListener('click', function(e){
      var rect = canvas.getBoundingClientRect();
      var frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      function applySeek(){
        var d = duration();
        if (d <= 0) return;
        var pos = frac * d;
        if (playing) {
          startFrom(pos);  // synchronous restart from the new position
        } else {
          offset = pos;
          paint();
        }
      }
      if (buffer) applySeek();
      else ensureBuffer().then(applySeek).catch(function(){});
    });
  }

  function scan(root){
    var nodes = (root || document).querySelectorAll('[data-lc-voice]');
    Array.prototype.forEach.call(nodes, initVoice);
  }

  function onReady(fn){
    if (document.readyState !== 'loading') fn();
    else document.addEventListener('DOMContentLoaded', fn);
  }
  onReady(function(){ scan(document); });

  // New messages and edits land via htmx swaps (HTTP and WS OOB both fire
  // these on document.body). Re-scan the swapped subtree.
  document.body.addEventListener('htmx:afterSettle', function(e){ scan(e.target); });
  document.body.addEventListener('htmx:oobAfterSwap', function(e){ scan(e.target); });
})();
</script>
