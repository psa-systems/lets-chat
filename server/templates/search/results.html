{% if results.is_empty() %}
<div class="bg-surface-elevated border border-border-strong rounded shadow-lg p-3">
  <p class="text-sm text-content-muted">{{ "search-no-results"|t }}</p>
</div>
{% else %}
<div role="listbox" class="bg-surface-elevated border border-border-strong rounded shadow-lg max-h-80 overflow-y-auto">
  {% for r in results %}
  <a href="/{{ r.context_kind }}/{{ r.context_id }}#msg-{{ r.message_id }}" role="option" id="lc-opt-msg-{{ r.message_id }}" aria-selected="false" class="block px-3 py-2 hover:bg-surface-sunken border-b border-border last:border-b-0">
    <div class="text-xs text-content-muted">{{ r.context_label }} - {{ r.created_at }}</div>
    <div class="text-sm truncate">{{ r.snippet }}</div>
  </a>
  {% endfor %}
</div>
{% endif %}
