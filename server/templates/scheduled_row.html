<li id="scheduled-row-{{ row.id }}" class="px-4 py-3">
  <div class="flex items-center justify-between gap-2 text-xs text-content-muted">
    <span>
      {{ "scheduled-for-prefix"|t }} <a href="{{ row.room_path }}" class="text-accent hover:underline">{{ row.room_label }}</a>
      &middot; {{ "scheduled-row-delivers"|t }} {{ row.scheduled_for }} UTC
    </span>
    <button hx-delete="/scheduled/{{ row.id }}"
            hx-target="#scheduled-row-{{ row.id }}"
            hx-swap="delete"
            hx-confirm="{{ "scheduled-cancel-confirm"|t }}"
            class="text-danger hover:underline">{{ "action-cancel"|t }}</button>
  </div>
  <div class="mt-1 lc-md whitespace-pre-wrap text-sm text-content">{{ row.body_html|safe }}</div>
</li>
