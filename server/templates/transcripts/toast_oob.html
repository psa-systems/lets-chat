{# LC-441: out-of-band toast appended to a delete response. Reuses the global
   #lc-toast-region + toast.js (auto-dismiss / manual close). #}
<div hx-swap-oob="beforeend:#lc-toast-region"><div class="lc-toast lc-toast--{% if ok %}ok{% else %}err{% endif %}" role="status" data-lc-toast><span class="lc-toast-ico" aria-hidden="true">{% if ok %}&#10003;{% else %}!{% endif %}</span><span class="lc-toast-msg">{{ message }}</span><button type="button" class="lc-toast-close" data-lc-toast-close aria-label="{{ "action-dismiss"|t }}">&times;</button></div></div>
