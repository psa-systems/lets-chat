<div class="border border-slate-300 rounded p-2 bg-white text-sm space-y-2 shadow">
  {% if saved %}
  <div class="text-xs text-green-700">Saved.</div>
  {% endif %}
  <form hx-post="/status" hx-target="#status-picker" hx-swap="innerHTML" class="space-y-2">
    <div class="flex flex-col gap-1">
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="radio" name="status" value="active"{% if current_status == "active" %} checked{% endif %}>
        <span class="inline-block h-2.5 w-2.5 rounded-full bg-green-500"></span>
        <span>Active</span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="radio" name="status" value="idle"{% if current_status == "idle" %} checked{% endif %}>
        <span class="inline-block h-2.5 w-2.5 rounded-full bg-yellow-400"></span>
        <span>Idle</span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="radio" name="status" value="dnd"{% if current_status == "dnd" %} checked{% endif %}>
        <span class="inline-block h-2.5 w-2.5 rounded-full bg-red-500"></span>
        <span>Do not disturb</span>
      </label>
    </div>
    <label class="block">
      <span class="text-xs text-slate-500">Custom status (optional, max 50)</span>
      <input type="text" name="custom_status" maxlength="50" value="{% if let Some(t) = current_custom %}{{ t }}{% endif %}" class="mt-1 block w-full border rounded px-2 py-1">
    </label>
    <div class="flex gap-2">
      <button type="submit" class="bg-blue-600 text-white px-3 py-1 rounded text-xs hover:bg-blue-700">Save</button>
      <button type="button" hx-get="/status/cancel" hx-target="#status-picker" hx-swap="innerHTML" class="text-xs text-slate-500 hover:text-slate-700">Close</button>
    </div>
  </form>
</div>
