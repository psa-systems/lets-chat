{# LC-334: inline confirmation after a successful report. Replaces the modal in
   #lc-report-modal, then auto-dismisses. Mirrors forward/confirm.html. #}
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50"
     onmousedown="if(event.target===this)this.parentElement.innerHTML='';">
  <div class="w-80 rounded-lg bg-surface-elevated p-5 shadow-xl text-center">
    <div class="text-2xl mb-2" aria-hidden="true">&#128075;</div>
    <p class="text-sm text-content-muted">{{ "report-thanks"|t }}</p>
    <button type="button"
            class="btn btn-primary mt-4"
            onclick="document.getElementById('lc-report-modal').innerHTML='';">{{ "report-done"|t }}</button>
  </div>
</div>
<script data-lc-guard="none">
  setTimeout(function(){
    var slot = document.getElementById('lc-report-modal');
    if (slot) slot.innerHTML = '';
  }, 4000);
</script>
