{% extends "admin_layout.html" %}

{% block title %}Settings - Admin - lets-chat{% endblock %}

{% block admin_main %}
<h1 class="text-lg font-semibold mb-4">SMTP settings</h1>
{% if saved %}
<div class="mb-4 p-3 rounded bg-green-50 text-green-700 text-sm">Settings saved.</div>
{% endif %}
<form method="post" action="/admin/settings" class="max-w-lg space-y-4">
  <div>
    <label class="block text-sm font-medium mb-1" for="smtp_host">SMTP host</label>
    <input id="smtp_host" name="smtp_host" type="text" value="{{ smtp_host }}"
           class="w-full border border-slate-300 rounded px-2 py-1 text-sm">
  </div>
  <div>
    <label class="block text-sm font-medium mb-1" for="smtp_port">SMTP port</label>
    <input id="smtp_port" name="smtp_port" type="text" value="{{ smtp_port }}"
           class="w-full border border-slate-300 rounded px-2 py-1 text-sm">
  </div>
  <div>
    <label class="block text-sm font-medium mb-1" for="smtp_user">SMTP username</label>
    <input id="smtp_user" name="smtp_user" type="text" value="{{ smtp_user }}"
           class="w-full border border-slate-300 rounded px-2 py-1 text-sm">
  </div>
  <div>
    <label class="block text-sm font-medium mb-1" for="smtp_from">From address</label>
    <input id="smtp_from" name="smtp_from" type="text" value="{{ smtp_from }}"
           class="w-full border border-slate-300 rounded px-2 py-1 text-sm">
  </div>
  <div>
    <label class="block text-sm font-medium mb-1" for="smtp_pass">SMTP password (write-only)</label>
    <input id="smtp_pass" name="smtp_pass" type="password" value="" placeholder="leave blank to keep existing"
           class="w-full border border-slate-300 rounded px-2 py-1 text-sm">
  </div>
  <button type="submit" class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm">Save</button>
</form>

<h2 class="text-base font-semibold mt-8 mb-3">Defaults for new users</h2>
<form method="post" action="/admin/settings/email-digest-default" class="max-w-lg space-y-2">
  <label class="flex items-start gap-2 cursor-pointer">
    <input type="checkbox" name="default_notify_email_digest" value="1" class="mt-0.5"
      {% if default_notify_email_digest %}checked{% endif %}>
    <span>
      New users start with email digest enabled
      <span class="block text-xs text-slate-500 mt-1">
        Off by default for privacy. Only affects future registrations; existing users are not changed. Email digest also requires SMTP configured via environment variables.
      </span>
    </span>
  </label>
  <button type="submit" class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm">Save default</button>
</form>
{% endblock %}
