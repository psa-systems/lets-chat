{% extends "admin_layout.html" %}

{% block title %}Rooms - Admin - lets-chat{% endblock %}

{% block admin_main %}
<h1 class="text-lg font-semibold mb-4">Rooms</h1>
<table class="w-full text-sm">
  <thead>
    <tr class="text-left text-slate-500 border-b border-slate-200">
      <th class="py-2">Name</th>
      <th class="py-2">Members</th>
      <th class="py-2">Created at</th>
      <th class="py-2 text-right">Action</th>
    </tr>
  </thead>
  <tbody>
    {% for r in rooms_admin %}
    <tr id="room-{{ r.id }}" class="border-t border-slate-200">
      <td class="py-1">{{ r.name }}</td>
      <td class="py-1">{{ r.members }}</td>
      <td class="py-1">{{ r.created_at }}</td>
      <td class="py-1 text-right">
        <button hx-post="/admin/rooms/{{ r.id }}/archive" hx-target="#room-{{ r.id }}" hx-swap="outerHTML" class="text-red-600 hover:underline">Archive</button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
