{% extends "base.html" %}

{% block title %}{{ "reset-page-title"|t }} - lets-chat{% endblock %}

{% block body %}
<main class="min-h-screen flex items-center justify-center p-6">
  <form
    method="post"
    action="/reset/{{ token }}"
    hx-post="/reset/{{ token }}"
    hx-target="#form-errors"
    hx-target-4*="#form-errors"
    hx-swap="innerHTML"
    class="card w-full max-w-sm space-y-4 p-6"
  >
    <h1 class="text-xl font-semibold">{{ "reset-title"|t }}</h1>
    <div id="form-errors">
      {% include "auth/form_errors.html" %}
    </div>
    <label class="block">
      <span class="text-sm">{{ "reset-new-password"|t }}</span>
      <input type="password" name="password" required minlength="8" class="input mt-1">
    </label>
    <label class="block">
      <span class="text-sm">{{ "reset-confirm-password"|t }}</span>
      <input type="password" name="password_confirm" required minlength="8" class="input mt-1">
    </label>
    <button class="btn btn-primary w-full"><span class="htmx-indicator lc-spinner" aria-hidden="true"></span>{{ "reset-submit"|t }}</button>
    <p class="text-xs text-center text-content-subtle" title="Built {{ build_date }}">v{{ app_version }} ({{ git_hash }})</p>
  </form>
</main>
{% endblock %}
