<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}lets-chat{% endblock %}</title>
  <!-- LC-142: dynamic favicon. Serves the operator's custom favicon when
       set, else falls back to the bundled SVG, so this link is
       unconditional. No `type` hint: the served format varies (PNG/ICO/SVG). -->
  <link id="lc-favicon" rel="icon" href="/branding/favicon?v={{ asset_version }}">
  <link rel="manifest" href="/assets/manifest.webmanifest?v={{ asset_version }}">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <link rel="stylesheet" href="/assets/tailwind-built.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/assets/main.css?v={{ asset_version }}">
  <script src="/assets/vendor/htmx.min.js?v={{ asset_version }}" defer></script>
  <script src="/assets/vendor/htmx-ext-ws.js?v={{ asset_version }}" defer></script>
  <script src="/assets/vendor/htmx-ext-response-targets.js?v={{ asset_version }}" defer></script>
  <script src="/assets/vendor/idiomorph.min.js?v={{ asset_version }}" defer></script>
  <script src="/assets/devices.js?v={{ asset_version }}" defer></script>
  <script src="/assets/call.js?v={{ asset_version }}" defer></script>
  <script src="/assets/voice.js?v={{ asset_version }}" defer></script>
  <script src="/assets/sidebar_dnd.js?v={{ asset_version }}" defer></script>
  <script src="/assets/sidebar_jump.js?v={{ asset_version }}" defer></script>
  <script src="/assets/outbox.js?v={{ asset_version }}" defer></script>
</head>
<body hx-ext="response-targets" class="h-screen overflow-hidden bg-slate-50 text-slate-900">
  {% block body %}{% endblock %}
</body>
</html>
