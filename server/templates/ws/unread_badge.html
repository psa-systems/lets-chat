{% if unread > 0 && mute_mode == "none" %}
<span id="unread-{{ kind }}-{{ id }}" data-lc-unread hx-swap-oob="outerHTML" class="ml-auto text-xs bg-accent text-accent-content rounded px-2">{{ unread }}</span>
{% else %}
<span id="unread-{{ kind }}-{{ id }}" data-lc-unread hx-swap-oob="outerHTML"></span>
{% endif %}
