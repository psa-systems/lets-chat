{# LC-179: OOB reveal of the /activity refresh bar when a new mention arrives.
   Swaps the shown variant over #lc-activity-refresh; connections not on
   /activity have no such id and drop it. Identical markup to
   activity/page.html's button minus `hidden`, plus hx-swap-oob. #}
<button id="lc-activity-refresh" type="button" onclick="location.reload()" hx-swap-oob="outerHTML"
        class="btn btn-sm btn-primary sticky top-0 z-10 w-full rounded-none">
  &uarr; New activity - click to refresh
</button>
