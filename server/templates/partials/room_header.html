<header id="lc-room-header" class="border-b border-border px-4 py-2 flex items-start justify-between gap-2">
  <div class="min-w-0">
    <a href="/room/{{ room.id }}/info" class="block hover:underline" title="{{ "partials-room-info-title"|t }}">
      <h1 class="font-semibold truncate">#{{ room.name }}</h1>
      {% if let Some(topic) = room.topic.as_ref() %}
      <p class="text-sm text-content-muted truncate">{{ topic }}</p>
      {% endif %}
    </a>
  </div>
  <div class="flex items-center gap-2 shrink-0">
    <a href="/room/{{ room.id }}/info"
       class="inline-flex items-center rounded border border-border px-2 py-1 text-xs hover:bg-surface-sunken"
       title="{{ "partials-room-info-docs-title"|t }}">{{ "partials-room-info"|t }}</a>
    {% if can_manage_overrides %}
    <a href="/room/{{ room.id }}/moderators"
       class="inline-flex items-center rounded border border-border px-2 py-1 text-xs hover:bg-surface-sunken"
       title="{{ "partials-room-moderators-title"|t }}">{{ "partials-room-moderators"|t }}</a>
    {% endif %}
    {% include "room/notify_dropdown.html" %}
  </div>
</header>
