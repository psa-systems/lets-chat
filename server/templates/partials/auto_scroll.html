<script>
(function() {
  // LC-246: clipboard fallback for the per-message "Copy link" buttons when
  // navigator.clipboard is unavailable (older browsers / non-secure contexts).
  // Defined once here since auto_scroll.html is included once per chat page.
  if (!window.__lcCopyFallback) {
    window.__lcCopyFallback = function (text) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e) { /* best-effort */ }
    };
  }

  var messages = document.getElementById('messages');
  if (!messages) return;
  var slack = 50;
  var wasAtBottom = true;

  // LC-256: long-message fold. Measure each unprocessed body's natural height;
  // only when it overflows COLLAPSE_MAX do we clamp it (.lc-collapsible) and
  // reveal its "Show more" toggle. Progressive enhancement: the body always
  // renders in full, so a no-JS client sees everything. Idempotent via the
  // -done marker, so re-running over #messages after a live append only touches
  // the new rows; an edited message re-renders without the marker and is
  // re-measured. `scope` is the swapped element (a #msg-<id> on edit) or
  // #messages on init / append.
  var COLLAPSE_MAX = 420;
  function processCollapse(scope) {
    var nodes = (scope || messages).querySelectorAll('[data-lc-collapse]:not([data-lc-collapse-done])');
    for (var i = 0; i < nodes.length; i++) {
      (function (body) {
        body.setAttribute('data-lc-collapse-done', '1');
        if (body.scrollHeight <= COLLAPSE_MAX) return;
        body.classList.add('lc-collapsible');
        var btn = body.nextElementSibling;
        if (!btn || !btn.hasAttribute('data-lc-collapse-toggle')) return;
        btn.hidden = false;
        btn.textContent = btn.getAttribute('data-lc-more');
        btn.addEventListener('click', function () {
          var collapsed = body.classList.toggle('lc-collapsible');
          btn.textContent = collapsed ? btn.getAttribute('data-lc-more') : btn.getAttribute('data-lc-less');
        });
      })(nodes[i]);
    }
  }
  // Initial pass before anchoring so the scroll target accounts for the
  // clamped (shorter) heights.
  processCollapse(messages);

  // LC-242: jump-to-latest pill. Shown only when the viewer is scrolled up;
  // counts messages that arrive live while they read history. Localized
  // one/many forms ride as data attributes (the count is client-side dynamic,
  // so it cannot be server-rendered via |tn); the %n% token is substituted in.
  var pill = document.getElementById('lc-jump-latest');
  var countEl = document.getElementById('lc-jump-count');
  var oneTpl = pill ? (pill.getAttribute('data-lc-jump-one') || '') : '';
  var manyTpl = pill ? (pill.getAttribute('data-lc-jump-many') || '') : '';
  var newCount = 0;

  // LC-294: jump-to-first-unread pill. Mirror of the latest pill but upward.
  // Queried independently of the permalink anchor below so it still works when
  // a #msg-<id> took the initial scroll. Shown whenever the unread divider
  // exists but is currently scrolled out of the #messages viewport.
  var unreadPill = document.getElementById('lc-jump-unread');
  var unreadDivider = messages.querySelector('[data-unread-divider]');
  function isDividerVisible() {
    if (!unreadDivider) return false;
    var mr = messages.getBoundingClientRect();
    var dr = unreadDivider.getBoundingClientRect();
    return dr.bottom > mr.top && dr.top < mr.bottom;
  }
  function renderUnreadPill() {
    if (!unreadPill) return;
    if (unreadDivider && !isDividerVisible()) unreadPill.classList.remove('hidden');
    else unreadPill.classList.add('hidden');
  }
  function jumpToUnread() {
    if (!unreadDivider) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || typeof unreadDivider.scrollIntoView !== 'function') {
      unreadDivider.scrollIntoView({ block: 'start' });
    } else {
      unreadDivider.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }
    renderUnreadPill();
  }
  if (unreadPill) unreadPill.addEventListener('click', jumpToUnread);

  function isAtBottom() {
    return messages.scrollTop + messages.clientHeight >= messages.scrollHeight - slack;
  }
  function scrollToBottom() {
    messages.scrollTop = messages.scrollHeight;
  }
  // Reflect the current (wasAtBottom, newCount) state onto the pill: hidden at
  // the bottom, visible when scrolled up, with the count text only once at
  // least one message has arrived (a bare chevron otherwise).
  function renderPill() {
    if (!pill) return;
    if (wasAtBottom) {
      pill.classList.add('hidden');
      if (countEl) countEl.textContent = '';
      return;
    }
    pill.classList.remove('hidden');
    if (countEl) {
      countEl.textContent = newCount <= 0
        ? ''
        : (newCount === 1 ? oneTpl : manyTpl.replace('%n%', newCount));
    }
  }

  // Track scroll position so we know whether the user is parked at the bottom.
  // Reaching the bottom clears the pending-count and hides the pill (LC-242).
  function onScroll() {
    wasAtBottom = isAtBottom();
    if (wasAtBottom) newCount = 0;
    renderPill();
    renderUnreadPill();
  }
  messages.addEventListener('scroll', onScroll);

  // LC-246: when arriving via a /m/{id} permalink (#msg-<id>), scroll to and
  // briefly highlight that message instead of the usual bottom/unread anchor.
  // The full room history is in the DOM, so the target row is present unless
  // it is a thread reply (which lives in the panel) - then this no-ops and the
  // normal anchor runs.
  var focused = false;
  if (/^#msg-\d+$/.test(location.hash)) {
    var target = document.getElementById(location.hash.slice(1));
    if (target && messages.contains(target)) {
      target.scrollIntoView({ block: 'center' });
      target.classList.add('lc-msg-flash');
      setTimeout(function () { target.classList.remove('lc-msg-flash'); }, 2000);
      wasAtBottom = isAtBottom();
      focused = true;
    }
  }
  // Initial paint: anchor at the unread divider if there is one, otherwise
  // jump to the newest message. Skipped entirely when a permalink target was
  // anchored above.
  var divider = focused ? null : messages.querySelector('[data-unread-divider]');
  if (focused) {
    // Permalink target already centered; leave it in view.
  } else if (divider) {
    divider.scrollIntoView({ block: 'start' });
    wasAtBottom = isAtBottom();
  } else {
    scrollToBottom();
    wasAtBottom = true;
  }
  // LC-242: set the pill's initial state to match where we anchored (hidden at
  // the bottom; a bare chevron when anchored at an unread divider up-list).
  renderPill();
  // LC-294: hidden at load when we anchored the divider into view; appears once
  // the reader scrolls it off-screen (or immediately if a permalink anchor left
  // the divider out of view).
  renderUnreadPill();

  // Follow new content if the user has not scrolled away from the bottom.
  // `wasAtBottom` is driven by real scroll events only. The previous
  // implementation also overwrote it inside `htmx:beforeSwap`, but that
  // mis-fires when the composer textarea has just grown: `#messages`
  // clientHeight shrinks from the bottom, scrollTop stays put, and the
  // post-resize `isAtBottom()` snapshot reads false even though the user
  // never scrolled. That snapshot then suppresses the corresponding
  // `htmx:afterSwap` re-anchor, leaving newly-arrived messages off-
  // screen. Reading `wasAtBottom` directly (without re-snapshotting)
  // preserves the user's actual intent: if they were following the
  // bottom before the composer grew, they still are.
  function followIfPinned() { if (wasAtBottom) scrollToBottom(); }
  document.body.addEventListener('htmx:afterSwap', followIfPinned);
  // LC-256: re-measure the swapped subtree (an edited message re-renders as a
  // #msg-<id> outerHTML swap, dropping the -done marker) so a freshly long /
  // short edit gets the right fold state.
  function onAfterSwapCollapse(evt) {
    var tgt = (evt && evt.target) || null;
    if (tgt && tgt.querySelectorAll) processCollapse(tgt);
  }
  document.body.addEventListener('htmx:afterSwap', onAfterSwapCollapse);
  // OOB swaps (new messages over WS) take a separate event path. A new message
  // appends to #messages (ws/new_message.html, hx-swap-oob="beforeend"), so the
  // oobAfterSwap event targets #messages itself; edits/reactions/polls target a
  // message- or bar-scoped id and are ignored here. LC-242: when such an append
  // lands while the viewer is scrolled up, bump the pill count. Own sends are
  // excluded for free: the optimistic echo (LC-230) jumps to the bottom, so
  // `wasAtBottom` is true by the time the canonical render arrives.
  // LC-244: insert a day divider above the just-appended message when its UTC
  // day differs from the previous message row's. Live sends are always "today"
  // in UTC, so the realistic trigger is crossing midnight UTC with the tab open;
  // the label uses the localized "Today" string carried on #messages. Inserted
  // BEFORE followIfPinned so a pinned viewer ends up below the new divider too.
  function maybeInsertDayDivider() {
    var rows = messages.querySelectorAll('[data-lc-day]');
    if (rows.length === 0) return;
    var last = rows[rows.length - 1];
    var prevRow = rows.length > 1 ? rows[rows.length - 2] : null;
    var lastDay = last.getAttribute('data-lc-day');
    var prevDay = prevRow ? prevRow.getAttribute('data-lc-day') : null;
    if (prevDay === lastDay) return;
    // A server-rendered (or prior live) divider already sits above this row.
    var before = last.previousElementSibling;
    if (before && before.hasAttribute('data-lc-day-divider')) return;
    var label = messages.getAttribute('data-lc-day-today') || lastDay;
    var div = document.createElement('div');
    div.setAttribute('data-lc-day-divider', '');
    div.setAttribute('role', 'separator');
    div.className = 'flex items-center gap-2 px-4 py-2 text-xs font-medium uppercase tracking-wide text-content-muted';
    div.innerHTML = '<span class="h-px flex-1 bg-border"></span><span></span><span class="h-px flex-1 bg-border"></span>';
    div.children[1].textContent = label;
    last.parentNode.insertBefore(div, last);
  }

  function onOob(evt) {
    var tgt = (evt && evt.detail && evt.detail.target) || (evt && evt.target);
    var isMsgAppend = tgt && tgt.id === 'messages';
    if (isMsgAppend) maybeInsertDayDivider();
    // LC-256: fold a long live arrival before re-anchoring so a pinned viewer
    // lands at the clamped bottom, not below an un-clamped wall of text.
    if (isMsgAppend) processCollapse(messages);
    followIfPinned();
    if (pill && isMsgAppend && !wasAtBottom) {
      newCount++;
      renderPill();
    }
    // LC-294: a live append can shift the divider out of (or further from) view.
    renderUnreadPill();
  }
  document.body.addEventListener('htmx:oobAfterSwap', onOob);

  // Click the pill: scroll to the newest message (smooth, or instant under
  // prefers-reduced-motion), then clear the count and hide.
  function jumpToLatest() {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || typeof messages.scrollTo !== 'function') {
      messages.scrollTop = messages.scrollHeight;
    } else {
      messages.scrollTo({ top: messages.scrollHeight, behavior: 'smooth' });
    }
    wasAtBottom = true;
    newCount = 0;
    renderPill();
  }
  if (pill) pill.addEventListener('click', jumpToLatest);

  // Re-anchor on container resize. Composer growth (mention insert,
  // multi-line typing) and typing-indicator updates both shrink
  // `#messages` from the bottom without firing a scroll event, so the
  // afterSwap hook alone is not enough.
  var ro = null;
  if (typeof ResizeObserver !== 'undefined') {
    ro = new ResizeObserver(function () { followIfPinned(); renderUnreadPill(); });
    ro.observe(messages);
  }

  // Teardown when the #messages element itself is detached (page swap,
  // navigation). `htmx:beforeCleanupElement` BUBBLES, so listening on any
  // ancestor catches arbitrary descendant cleanups too: a mention popover
  // refresh inside the composer cleans up the previous <ul>, that event
  // bubbles up through the composer form and #main, and a `{ once: true }`
  // teardown attached to #main would fire on the FIRST popover swap,
  // permanently disabling autoscroll. Listen on #messages and filter on
  // `evt.target === messages` so we only react when #messages itself is
  // the element being cleaned up; descendants (message edits via OOB
  // outerHTML, etc.) bubble through but do not trigger teardown.
  var torndown = false;
  function maybeTeardown(evt) {
    if (torndown || (evt && evt.target !== messages)) return;
    torndown = true;
    messages.removeEventListener('scroll', onScroll);
    document.body.removeEventListener('htmx:afterSwap', followIfPinned);
    document.body.removeEventListener('htmx:afterSwap', onAfterSwapCollapse);
    document.body.removeEventListener('htmx:oobAfterSwap', onOob);
    if (pill) pill.removeEventListener('click', jumpToLatest);
    if (unreadPill) unreadPill.removeEventListener('click', jumpToUnread);
    if (ro) ro.disconnect();
    messages.removeEventListener('htmx:beforeCleanupElement', maybeTeardown);
  }
  messages.addEventListener('htmx:beforeCleanupElement', maybeTeardown);
})();
</script>
