<aside id="thread-panel" class="w-96 border-l border-border flex flex-col bg-surface-elevated">
  <header class="flex items-center justify-between border-b border-border px-3 py-2">
    <div class="font-semibold">{{ "room-thread-heading"|t }}</div>
    <button
      hx-delete="/thread-panel"
      hx-target="#thread-panel"
      hx-swap="outerHTML"
      class="text-content-subtle hover:text-content-muted"
      aria-label="{{ "room-thread-close"|t }}"
    >&#10005;</button>
  </header>
  <div class="border-b border-border px-3 py-2 bg-surface">
    {% let parent_message = parent %}
    {% let message = parent_message %}
    {% include "room/thread_reply_inner.html" %}
  </div>
  <div id="thread-replies-{{ parent.id }}" class="flex-1 overflow-y-auto py-1">
    {% for r in replies %}
    {% let message = r %}
    {% include "room/thread_reply_inner.html" %}
    {% endfor %}
  </div>
  <div id="thread-typing-{{ parent.id }}" class="px-3 text-xs text-content-muted"></div>
  <form
    id="thread-composer-{{ parent.id }}"
    hx-post="/room/{{ room.id }}/thread/{{ parent.id }}/messages"
    hx-swap="none"
    hx-on::after-request="
      var ta = this.querySelector('textarea[name=body]');
      var send = this.querySelector('.thread-send');
      var err = this.querySelector('.thread-error');
      /* LC-216: debounce. Distinct timer key from the main composer so the
         two banners do not fight when both are active (the thread panel can
         resolve a successful post while the main composer's failure timer
         is still pending). */
      if (window.__lcThreadErrTimer) { clearTimeout(window.__lcThreadErrTimer); window.__lcThreadErrTimer = null; }
      if (event.detail.successful) {
        ta.value = '';
        ta.style.height = 'auto';
        send.disabled = true;
        err.classList.add('hidden');
        window.__lcLastThreadTyping = 0;
      } else {
        window.__lcThreadErrTimer = setTimeout(function(){
          err.classList.remove('hidden');
          window.__lcThreadErrTimer = null;
        }, 2000);
      }
      ta.focus();
    "
    class="border-t border-border p-2"
  >
    <div class="thread-error hidden mb-1 flex items-center gap-2 text-xs text-danger">
      <span>{{ "room-composer-send-failed"|t }}</span>
      <button type="submit" class="underline hover:no-underline">{{ "room-composer-retry"|t }}</button>
    </div>
    <div class="flex items-end gap-2">
      <textarea
        name="body"
        rows="1"
        autocomplete="off"
        autofocus
        placeholder="{{ "room-thread-reply-placeholder"|t }}"
        class="flex-1 resize-none overflow-y-auto rounded border px-3 py-1.5 text-sm max-h-32"
        oninput="
          this.style.height = 'auto';
          this.style.height = Math.min(this.scrollHeight, 128) + 'px';
          this.form.querySelector('.thread-send').disabled = !this.value.trim();
          var ws = window.__lcWS;
          if (!ws) return;
          var now = Date.now();
          if (now - (window.__lcLastThreadTyping || 0) < 2500) return;
          window.__lcLastThreadTyping = now;
          ws.send(JSON.stringify({ type: 'thread_typing', room_id: {{ room.id }}, parent_id: {{ parent.id }} }));
        "
        onkeydown="
          if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
            event.preventDefault();
            if (this.value.trim()) this.form.requestSubmit();
          }
        "
      ></textarea>
      <button
        type="submit"
        disabled
        class="thread-send rounded bg-accent px-2 py-1.5 text-accent-content hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-50"
        aria-label="{{ "room-thread-send-reply"|t }}"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4">
          <path d="M3.105 2.289a.75.75 0 00-.826.95l1.414 4.949a.75.75 0 00.604.534l7.443.972c.336.044.336.526 0 .57l-7.443.972a.75.75 0 00-.604.534l-1.414 4.949a.75.75 0 00.826.95 28.74 28.74 0 0015.585-7.122.75.75 0 000-1.054A28.74 28.74 0 003.105 2.289z" />
        </svg>
      </button>
    </div>
  </form>
</aside>
