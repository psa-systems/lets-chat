<form hx-patch="/room/{{ room_id }}/description"
      hx-target="#description-content"
      hx-swap="innerHTML"
      class="space-y-2">
  <label class="block">
    <span class="text-sm">{{ "room-description-label"|t }}</span>
    <textarea name="body" rows="6"
              class="input font-mono"
              autofocus>{{ body }}</textarea>
  </label>
  <div class="flex gap-2">
    <button type="submit" class="btn btn-primary btn-sm">{{ "room-save"|t }}</button>
    <button type="button"
            hx-get="/room/{{ room_id }}/description"
            hx-target="#description-content"
            hx-swap="innerHTML"
            class="btn btn-secondary btn-sm">{{ "room-cancel"|t }}</button>
  </div>
</form>
