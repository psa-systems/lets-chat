<form hx-patch="/room/{{ room_id }}/description"
      hx-target="#description-content"
      hx-swap="innerHTML"
      class="space-y-2">
  <label class="block">
    <span class="text-sm">{{ "room-description-label"|t }}</span>
    <textarea name="body" rows="6"
              class="w-full border rounded px-2 py-1 text-sm font-mono"
              autofocus>{{ body }}</textarea>
  </label>
  <div class="flex gap-2">
    <button type="submit" class="bg-accent text-accent-content rounded px-3 py-1 text-sm">{{ "room-save"|t }}</button>
    <button type="button"
            hx-get="/room/{{ room_id }}/description"
            hx-target="#description-content"
            hx-swap="innerHTML"
            class="bg-surface-sunken hover:bg-surface-sunken rounded px-3 py-1 text-sm">{{ "room-cancel"|t }}</button>
  </div>
</form>
