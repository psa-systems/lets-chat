<div id="history-panel" class="lc-panel flex flex-col">
  <header class="flex items-center justify-between border-b border-border px-3 py-2">
    <div class="font-semibold">{{ "room-history-heading"|t }}</div>
    <button
      hx-delete="/history-panel"
      hx-target="#history-panel"
      hx-swap="outerHTML"
      class="text-content-subtle hover:text-content-muted"
      aria-label="{{ "room-history-close"|t }}"
    >&#10005;</button>
  </header>
  <div class="flex-1 overflow-y-auto px-3 py-2 space-y-3 text-sm" data-message-id="{{ message_id }}">
    {% for entry in entries %}
    <div class="rounded border border-border p-2">
      <div class="text-xs text-content-muted mb-1">{{ entry.label }}</div>
      <div class="lc-md leading-snug">{{ entry.body_html|safe }}</div>
    </div>
    {% endfor %}
  </div>
</div>
