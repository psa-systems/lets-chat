<div id="reply-count-{{ message_id }}"{% if oob %} hx-swap-oob="outerHTML"{% endif %}>
  {% if reply_count > 0 %}
  <button
    hx-get="/room/{{ room_id }}/thread/{{ message_id }}"
    hx-target="#thread-panel"
    hx-swap="outerHTML"
    class="mt-1 inline-flex items-center gap-1 rounded-full bg-accent-surface px-2 py-0.5 text-xs text-accent hover:bg-accent-surface"
  >
    <span>&#128172;</span>
    <span>{{ reply_count }} {% if reply_count == 1 %}{{ "room-reply-singular"|t }}{% else %}{{ "room-reply-plural"|t }}{% endif %}</span>
  </button>
  {% endif %}
</div>
