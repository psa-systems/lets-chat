<div class="relative shrink-0" data-lc-cleanup-root>
  <button type="button"
    id="lc-notify-toggle-{{ room.id }}"
    class="inline-flex items-center gap-1 rounded border border-border px-2 py-1 text-xs hover:bg-surface-sunken focus:outline-none focus:ring-2 focus:ring-ring"
    aria-haspopup="menu"
    aria-expanded="false"
    aria-controls="lc-notify-menu-{{ room.id }}">
    {% if mute_mode == "none" %}{{ "room-notify-unmuted"|t }}
    {% else if mute_mode == "except_mentions" %}{{ "room-notify-muted-mentions"|t }}
    {% else %}{{ "room-notify-muted"|t }}{% endif %}
  </button>
  <div id="lc-notify-menu-{{ room.id }}"
    role="menu"
    aria-labelledby="lc-notify-toggle-{{ room.id }}"
    hidden
    class="absolute right-0 z-30 mt-1 w-64 rounded border border-border bg-surface-elevated p-2 shadow-lg text-sm">
    <form hx-post="/room/{{ room.id }}/notify-prefs"
          hx-trigger="change from:input"
          hx-target="#lc-room-header"
          hx-swap="outerHTML"
          class="space-y-1">
      <label class="flex items-start gap-2 cursor-pointer p-1 hover:bg-surface rounded">
        <input type="radio" name="mute_mode" value="none" {% if mute_mode == "none" %}checked{% endif %} class="mt-1">
        <span><span class="font-medium">{{ "room-notify-unmuted"|t }}</span><br><span class="text-xs text-content-muted">{{ "room-notify-unmuted-desc"|t }}</span></span>
      </label>
      <label class="flex items-start gap-2 cursor-pointer p-1 hover:bg-surface rounded">
        <input type="radio" name="mute_mode" value="except_mentions" {% if mute_mode == "except_mentions" %}checked{% endif %} class="mt-1">
        <span><span class="font-medium">{{ "room-notify-muted-mentions"|t }}</span><br><span class="text-xs text-content-muted">{{ "room-notify-muted-mentions-desc"|t }}</span></span>
      </label>
      <label class="flex items-start gap-2 cursor-pointer p-1 hover:bg-surface rounded">
        <input type="radio" name="mute_mode" value="all" {% if mute_mode == "all" %}checked{% endif %} class="mt-1">
        <span><span class="font-medium">{{ "room-notify-muted"|t }}</span><br><span class="text-xs text-content-muted">{{ "room-notify-muted-desc"|t }}</span></span>
      </label>
    </form>
  </div>
</div>
<script>
(function(){
  // Disclosure pattern: toggle button + menu div with proper ARIA. Tab cycles
  // through radios via default browser behavior. Escape closes. Click outside
  // closes. After change, HTMX swaps #lc-room-header so the entire dropdown
  // is replaced; the wired-flag guards against double-binding within a single
  // render, and the teardown below catches the cross-render leak.
  var btn = document.getElementById('lc-notify-toggle-{{ room.id }}');
  var menu = document.getElementById('lc-notify-menu-{{ room.id }}');
  if (!btn || !menu || btn.dataset.lcWired === '1') return;
  btn.dataset.lcWired = '1';
  function close(){ btn.setAttribute('aria-expanded', 'false'); menu.hidden = true; }
  function open(){ btn.setAttribute('aria-expanded', 'true'); menu.hidden = false;
    var first = menu.querySelector('input[type=radio]:checked, input[type=radio]'); if (first) first.focus(); }
  btn.addEventListener('click', function(){ menu.hidden ? open() : close(); });
  menu.addEventListener('keydown', function(e){
    if (e.key === 'Escape') { e.preventDefault(); close(); btn.focus(); }
  });
  function onDocClick(e){
    if (menu.hidden) return;
    if (!menu.contains(e.target) && e.target !== btn) close();
  }
  document.addEventListener('click', onDocClick);
  // Teardown: the btn/menu listeners die with their elements when the room
  // header swap removes them; the document.click listener does not, so drop
  // it here. The cleanup-root is the dropdown wrapper div above.
  function teardown() {
    document.removeEventListener('click', onDocClick);
  }
  var root = document.currentScript.closest('[data-lc-cleanup-root]')
          || document.currentScript.parentElement;
  root.addEventListener('htmx:beforeCleanupElement', teardown, { once: true });
})();
</script>
