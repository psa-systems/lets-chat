<form
  id="composer"
  hx-post="/room/{{ room.id }}/messages"
  hx-swap="none"
  hx-on::after-request="
    var ta = this.querySelector('textarea[name=body]');
    var send = this.querySelector('#composer-send');
    var err = this.querySelector('.composer-error');
    if (event.detail.successful) {
      ta.value = '';
      ta.style.height = 'auto';
      send.disabled = true;
      err.classList.add('hidden');
      window.__lcLastTyping = 0;
      if (window.__lcClearAttach) window.__lcClearAttach();
    } else {
      err.classList.remove('hidden');
    }
    ta.focus();
  "
  class="border-t border-slate-200 p-2"
>
  <div id="lc-staged" class="mb-1 text-xs text-slate-500"></div>
  <div id="lc-upload-error" class="mb-1 text-xs text-red-600"></div>
  <div class="composer-error hidden mb-1 flex items-center gap-2 text-xs text-red-600">
    <span>Could not send.</span>
    <button type="submit" class="underline hover:no-underline">Retry</button>
  </div>
  <input type="hidden" name="file_id">
  <div class="flex items-end gap-2">
    <button type="button" title="Attach file"
      class="px-2 py-2 text-slate-500 hover:text-slate-800"
      onclick="document.getElementById('lc-file').click()">+</button>
    <input id="lc-file" type="file" class="hidden">
    <textarea
      name="body"
      rows="1"
      autocomplete="off"
      autofocus
      placeholder="Message #{{ room.name }}"
      class="flex-1 resize-none overflow-y-auto rounded border px-3 py-2 max-h-40"
      oninput="
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 160) + 'px';
        document.getElementById('composer-send').disabled = !this.value.trim();
        var ws = window.__lcWS;
        if (!ws) return;
        var now = Date.now();
        if (now - (window.__lcLastTyping || 0) < 2500) return;
        window.__lcLastTyping = now;
        ws.send(JSON.stringify({ type: 'typing', room_id: {{ room.id }} }));
      "
      onkeydown="
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          if (this.value.trim()) this.form.requestSubmit();
        }
      "
    ></textarea>
    <button
      id="composer-send"
      type="submit"
      disabled
      class="rounded bg-blue-600 px-3 py-2 text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50"
      aria-label="Send message"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5">
        <path d="M3.105 2.289a.75.75 0 00-.826.95l1.414 4.949a.75.75 0 00.604.534l7.443.972c.336.044.336.526 0 .57l-7.443.972a.75.75 0 00-.604.534l-1.414 4.949a.75.75 0 00.826.95 28.74 28.74 0 0015.585-7.122.75.75 0 000-1.054A28.74 28.74 0 003.105 2.289z" />
      </svg>
    </button>
  </div>
</form>
<div id="lc-drop-overlay" class="hidden pointer-events-none fixed inset-0 z-40 flex items-center justify-center bg-blue-900/40">
  <div class="rounded-lg bg-white px-6 py-4 text-lg font-semibold text-slate-800 shadow-lg">Drop file to attach</div>
</div>
<script>
(function(){
  var input = document.getElementById('lc-file');
  var staged = document.getElementById('lc-staged');
  var errSlot = document.getElementById('lc-upload-error');
  var hidden = document.querySelector('#composer input[name=file_id]');
  var ta = document.querySelector('#composer textarea[name=body]');
  var overlay = document.getElementById('lc-drop-overlay');
  var currentObjectUrl = null;

  function revokePreview(){
    if (currentObjectUrl) {
      URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = null;
    }
  }
  function clear(){
    revokePreview();
    hidden.value = '';
    staged.textContent = '';
    errSlot.textContent = '';
    input.value = '';
  }
  window.__lcClearAttach = clear;

  function fmt(n){ return n < 1024 ? n+'B' : (n/1024).toFixed(1)+'KB'; }

  function showPreview(f){
    revokePreview();
    if (!f.type || !f.type.startsWith('image/')) {
      staged.innerHTML = 'Uploading ' + f.name + '...';
      return;
    }
    currentObjectUrl = URL.createObjectURL(f);
    staged.innerHTML =
      '<span class="inline-flex items-center gap-2">' +
        '<img src="' + currentObjectUrl + '" alt="" class="h-12 w-12 rounded object-cover">' +
        '<span>Uploading ' + f.name + '...</span>' +
      '</span>';
  }

  async function uploadStaged(f){
    errSlot.textContent = '';
    showPreview(f);
    var fd = new FormData(); fd.append('file', f);
    try {
      var res = await fetch('/api/upload', { method: 'POST', body: fd, credentials: 'same-origin' });
      if (!res.ok) {
        var msg = await res.text();
        errSlot.textContent = msg || ('upload failed: '+res.status);
        revokePreview();
        staged.textContent = '';
        input.value = '';
        return;
      }
      var data = await res.json();
      hidden.value = data.file_id;
      var preview = currentObjectUrl
        ? '<img src="' + currentObjectUrl + '" alt="" class="h-12 w-12 rounded object-cover">'
        : '';
      staged.innerHTML =
        '<span class="inline-flex items-center gap-2">' + preview +
          '<span>Attached: ' + f.name + ' (' + fmt(f.size) + ')</span>' +
          '<button type="button" onclick="window.__lcClearAttach()" class="ml-1 text-red-500">x</button>' +
        '</span>';
      document.getElementById('composer-send').disabled = false;
    } catch (e) {
      errSlot.textContent = 'upload failed';
      revokePreview();
      input.value = '';
    }
  }

  input.addEventListener('change', function(){
    var f = input.files && input.files[0];
    if (f) uploadStaged(f);
  });

  // Pasting an image straight into the composer should attach it. We do not
  // intercept pastes that contain text only, so normal copy/paste still works.
  ta.addEventListener('paste', function(e){
    if (!e.clipboardData || !e.clipboardData.files || !e.clipboardData.files.length) return;
    var f = e.clipboardData.files[0];
    if (!f) return;
    e.preventDefault();
    uploadStaged(f);
  });

  // Drag/drop anywhere on the page while a composer is mounted. We use a
  // counter rather than relying on `dragleave` for cleanup because dragleave
  // fires for child elements as the cursor moves over them.
  if (!window.__lcDropAttached) {
    window.__lcDropAttached = true;
    var dragCounter = 0;
    document.addEventListener('dragenter', function(e){
      if (!e.dataTransfer) return;
      var has = false;
      for (var i = 0; i < e.dataTransfer.types.length; i++) {
        if (e.dataTransfer.types[i] === 'Files') { has = true; break; }
      }
      if (!has) return;
      dragCounter++;
      overlay.classList.remove('hidden');
    });
    document.addEventListener('dragleave', function(){
      dragCounter = Math.max(0, dragCounter - 1);
      if (dragCounter === 0) overlay.classList.add('hidden');
    });
    document.addEventListener('dragover', function(e){
      if (e.dataTransfer && e.dataTransfer.types && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') !== -1) {
        e.preventDefault();
      }
    });
    document.addEventListener('drop', function(e){
      dragCounter = 0;
      overlay.classList.add('hidden');
      if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
      e.preventDefault();
      var f = e.dataTransfer.files[0];
      if (f) uploadStaged(f);
    });
  }
})();
</script>
