<!-- File input lives OUTSIDE the form: HTMX auto-switches to multipart
     encoding the moment a file input is inside a form, which would break
     the server's axum::Form parser. The JS uploads to /api/upload directly
     and stashes the returned file_id in the hidden input below. -->
<input id="lc-file" type="file" class="hidden">
<form
  id="composer"
  data-lc-cleanup-root
  data-room-id="{{ room.id }}"
  hx-post="/room/{{ room.id }}/messages"
  hx-swap="none"
  hx-on::config-request="
    /* LC-230: optimistic local echo. Tag this send with a client-generated id
       and render a pending placeholder into #messages immediately, so the
       message appears before the network round-trip. The id rides the form
       params; the server echoes it on the author's WS broadcast
       (data-lc-client-id) and live.js removes the placeholder when the
       canonical render arrives. Skipped for: requests bubbling up from child
       elements (the textarea's draft-autosave PUT), slash commands (no
       message will post), and attachment-only sends (no body to echo). */
    if (event.detail.elt !== this) return;
    var echoBody = this.body.value.trim();
    if (!echoBody || echoBody.charAt(0) === '/') return;
    var cid = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'cid-' + Date.now().toString(36) + Math.random().toString(36).slice(2);
    event.detail.parameters.client_id = cid;
    if (window.__lcOptimisticEcho) window.__lcOptimisticEcho(cid, echoBody);
  "
  hx-on::after-request="
    var ta = this.querySelector('textarea[name=body]');
    var err = this.querySelector('.composer-error');
    var bcast = document.getElementById('lc-broadcast-count');
    var qbar = document.getElementById('composer-quote-bar');
    /* LC-216: debounce the failure banner. Rapid successive submits can
       cause an in-flight htmx request to be cancelled by the next submit
       (or to land slowly), firing afterRequest with successful=false even
       though the message ultimately posts. Stash a setTimeout handle on
       window and clear it on the next success/failure so a follow-up
       success within 2s suppresses the flash. A real failure leaves the
       timer to fire and the banner reveals on schedule. */
    if (window.__lcComposerErrTimer) { clearTimeout(window.__lcComposerErrTimer); window.__lcComposerErrTimer = null; }
    if (event.detail.successful) {
      ta.value = '';
      ta.style.height = 'auto';
      /* LC-229: a sub-frame 204 response (LC-228) can land before the last
         keystroke's resize rAF fires; cancel it so the stale frame does not
         re-measure the just-cleared textarea and undercut the 'auto' height. */
      if (window.__lcResizeRaf) { cancelAnimationFrame(window.__lcResizeRaf); window.__lcResizeRaf = 0; }
      err.classList.add('hidden');
      window.__lcLastTyping = 0;
      if (window.__lcClearAttach) window.__lcClearAttach();
      if (window.__lcRefreshSend) window.__lcRefreshSend();
      if (bcast) bcast.innerHTML = '';
      if (qbar) qbar.innerHTML = '';
      /* LC-229: re-focus only on success (rapid-fire send case). On the
         failure-debounced path the user may have collapsed the mobile
         keyboard; a focus call here would snap it back open 2s after the
         submit. Tapping the textarea is the way back to typing. */
      ta.focus();
    } else {
      /* LC-230: flip this request's optimistic placeholder (if any) to the
         failed state with retry / discard controls. The client_id is read
         from the request's own config so rapid-fire concurrent sends each
         flip their own placeholder. */
      var failedCid = event.detail.requestConfig && event.detail.requestConfig.parameters
        ? event.detail.requestConfig.parameters.client_id : null;
      if (failedCid && window.__lcEchoFailed) window.__lcEchoFailed(failedCid);
      window.__lcComposerErrTimer = setTimeout(function(){
        err.classList.remove('hidden');
        window.__lcComposerErrTimer = null;
      }, 2000);
    }
  "
  {# LC-199: lc-pb-safe pushes the form's bottom padding down by the iOS
     home-indicator inset on mobile (no-op on desktop / non-cutout devices). #}
  {# LC-218: data-lc-density-tight="composer" halves only the TOP padding
     under compact density. The lc-pb-safe BOTTOM floor stays as-is so the
     iOS home-indicator inset is never eroded. #}
  data-lc-density-tight="composer"
  class="border-t border-border px-2 pt-2 lc-pb-safe"
>
  <div id="lc-staged" aria-live="polite" aria-atomic="false" class="mb-1 text-xs text-content-muted"></div>
  <!-- LC-98: offline-outbox status, toggled by /assets/outbox.js. -->
  <div id="lc-composer-net" class="hidden mb-1 text-xs text-warning"></div>
  <div id="lc-broadcast-count" class="mb-1 text-xs text-content-muted px-1 min-h-[1rem]"></div>
  <div id="composer-quote-bar"></div>
  <div id="lc-upload-error" role="alert" class="mb-1 text-xs text-danger"></div>
  <!-- data-lc-skip-focus opts this slot out of the global afterSwap focus
       handler in layout.html. The combobox pattern keeps focus in the
       textarea while the listbox refreshes; aria-activedescendant points
       at the highlighted option. -->
  <div id="lc-mention-popover" data-lc-skip-focus class="relative"></div>
  <!-- LC-76: slash-command autocomplete + ephemeral command result. -->
  <div id="lc-slash-popover" data-lc-skip-focus class="relative"></div>
  <div id="lc-command-result" aria-live="polite"></div>
  <div class="composer-error hidden mb-1 flex items-center gap-2 text-xs text-danger" role="alert">
    <span>{{ "room-composer-send-failed"|t }}</span>
    <button type="submit" class="underline hover:no-underline">{{ "room-composer-retry"|t }}</button>
  </div>
  <input type="hidden" name="file_id">
  <!-- LC-171: the textarea's onkeydown submits on Enter, but when a composer
       combobox (mention or slash) has a highlighted option open, Enter belongs
       to that combobox (insert the option), not the form. The combobox keydown
       handlers run on this same textarea and preventDefault, but they use
       stopPropagation (which does NOT stop this same-target inline listener)
       and the inline handler is registered at parse time so it runs first.
       The guard below makes the inline handler defer when an aria-selected
       option exists in either popover, so Enter never both submits the partial
       text AND inserts. One guard, both comboboxes (no slash/mention divergence). -->
  <div class="flex items-end gap-2">
    <button type="button" title="{{ "room-composer-attach-file"|t }}" aria-label="{{ "room-composer-attach-file"|t }}"
      class="px-2 py-2 text-content-muted hover:text-content"
      onclick="document.getElementById('lc-file').click()">+</button>
    <button type="button" id="lc-record" title="{{ "room-composer-record-voice"|t }}"
      class="px-2 py-2 text-content-muted hover:text-content"
      aria-label="{{ "room-composer-record-voice"|t }}">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5">
        <path d="M10 2a3 3 0 00-3 3v5a3 3 0 006 0V5a3 3 0 00-3-3z"/>
        <path d="M5.5 9.5a.75.75 0 00-1.5 0 6 6 0 005.25 5.954V17.5H7.75a.75.75 0 000 1.5h4.5a.75.75 0 000-1.5H10.75v-2.046A6 6 0 0016 9.5a.75.75 0 00-1.5 0 4.5 4.5 0 01-9 0z"/>
      </svg>
    </button>
    <textarea
      name="body"
      rows="1"
      autocomplete="off"
      autofocus
      placeholder="{{ "room-composer-message-placeholder"|t }} #{{ room.name }}"
      aria-label="{{ "a11y-composer-message-input"|t }}"
      role="combobox"
      aria-autocomplete="list"
      aria-expanded="false"
      aria-controls="lc-mention-list"
      aria-haspopup="listbox"
      class="flex-1 resize-none overflow-y-auto rounded border px-3 py-2 max-h-40"
      hx-put="/room/{{ room.id }}/draft"
      hx-include="this"
      hx-swap="none"
      hx-trigger="keyup[event.key !== 'Enter' || event.shiftKey] changed delay:1000ms"
      oninput="
        /* LC-229: coalesce the auto-resize to at most one per painted frame.
           The write -> read (scrollHeight) -> write still forces one layout
           when it runs (the 'auto' reset is required so the box can shrink),
           but cancel-and-reschedule collapses bursts of input events (paste,
           IME, autocomplete inserts) into a single resize. The send-disabled
           toggle lives in the setup IIFE below (cached node, no per-keystroke
           DOM query). */
        var ta = this;
        if (window.__lcResizeRaf) cancelAnimationFrame(window.__lcResizeRaf);
        window.__lcResizeRaf = requestAnimationFrame(function () {
          window.__lcResizeRaf = 0;
          ta.style.height = 'auto';
          ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
        });
        var ws = window.__lcWS;
        if (!ws) return;
        var now = Date.now();
        if (now - (window.__lcLastTyping || 0) < 2500) return;
        window.__lcLastTyping = now;
        ws.send(JSON.stringify({ type: 'typing', room_id: {{ room.id }} }));
      "
      onkeydown="
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
          if (document.querySelector('#lc-mention-popover li[role=option][aria-selected=true], #lc-slash-popover li[role=option][aria-selected=true]')) return;
          event.preventDefault();
          if (this.value.trim() || this.form.file_id.value) this.form.requestSubmit();
        }
      "
    >{{ initial_draft }}</textarea>
    <button
      type="button"
      title="{{ "room-composer-create-poll"|t }}"
      aria-label="{{ "room-composer-create-poll"|t }}"
      aria-haspopup="dialog"
      class="px-2 py-2 text-content-muted hover:text-content"
      onclick="window.__lcOpenPollModal && window.__lcOpenPollModal()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5">
        <path d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h8a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h4a1 1 0 110 2H4a1 1 0 01-1-1z"/>
      </svg>
    </button>
    <button
      type="button"
      title="{{ "room-composer-schedule-title"|t }}"
      aria-label="{{ "room-composer-schedule-aria"|t }}"
      aria-haspopup="dialog"
      class="px-2 py-2 text-content-muted hover:text-content"
      onclick="window.__lcOpenScheduledModal && window.__lcOpenScheduledModal()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM10.75 6a.75.75 0 00-1.5 0v4c0 .2.08.39.22.53l2.5 2.5a.75.75 0 101.06-1.06L10.75 9.69V6z" clip-rule="evenodd"/>
      </svg>
    </button>
    <button
      id="composer-send"
      type="submit"
      disabled
      class="rounded bg-accent px-3 py-2 text-accent-content hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-50"
      aria-label="{{ "room-composer-send-message"|t }}"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5">
        <path d="M3.105 2.289a.75.75 0 00-.826.95l1.414 4.949a.75.75 0 00.604.534l7.443.972c.336.044.336.526 0 .57l-7.443.972a.75.75 0 00-.604.534l-1.414 4.949a.75.75 0 00.826.95 28.74 28.74 0 0015.585-7.122.75.75 0 000-1.054A28.74 28.74 0 003.105 2.289z" />
      </svg>
    </button>
  </div>
</form>
<div id="lc-drop-overlay" class="hidden pointer-events-none fixed inset-0 z-40 flex items-center justify-center bg-accent/40">
  <div class="rounded-lg bg-surface-elevated px-6 py-4 text-lg font-semibold text-content shadow-lg">{{ "room-composer-drop-file"|t }}</div>
</div>
<script>
(function(){
  var ta = document.querySelector('#composer textarea[name=body]');
  var slot = document.getElementById('lc-mention-popover');
  var bcastSlot = document.getElementById('lc-broadcast-count');
  // LC-229: capture the send button once. Pre-LC-229 the inline oninput did a
  // document.getElementById('composer-send') on every keystroke; the result is
  // the same node every time, so close over it here instead.
  var sendBtn = document.getElementById('composer-send');
  // LC-229: single shared writer for the send button's disabled state,
  // exposed on window (same pattern as __lcClearAttach) so the after-request
  // handler, the upload/voice IIFEs, and __lcInsertSlash all compute the one
  // canonical predicate: enabled when there is text OR an attachment.
  // Registered before the mention-popover guard below so the toggle never
  // depends on the popover slot existing.
  if (ta && sendBtn) {
    window.__lcRefreshSend = function () {
      sendBtn.disabled = !ta.value.trim() && !ta.form.file_id.value;
    };
    ta.addEventListener('input', window.__lcRefreshSend);
  }
  if (!ta || !slot) return;
  var roomId = {{ room.id }};
  var TOKEN = /(^|\s)@([A-Za-z0-9_-]{0,32})$/;
  var current = null;
  // Debounce handle for the broadcast-count probe. The probe fires only
  // when the active token at the cursor is exactly `here` or `channel`
  // (case-insensitive). Any character typed after the token - including
  // a space - moves the cursor past the token-end anchor in the TOKEN
  // regex, activeToken() returns null, and we clear the slot. That is
  // the "friction at the moment of typing the broadcast token" rule:
  // once the user has moved on, the friction has done its job.
  var bcastTimer = null;
  function clearBroadcastSlot() {
    if (bcastTimer) { clearTimeout(bcastTimer); bcastTimer = null; }
    if (bcastSlot) bcastSlot.innerHTML = '';
  }
  function refreshBroadcastCount() {
    if (!bcastSlot) return;
    var tok = activeToken();
    if (!tok) return clearBroadcastSlot();
    var prefixLower = tok.prefix.toLowerCase();
    if (prefixLower !== 'here' && prefixLower !== 'channel') {
      return clearBroadcastSlot();
    }
    if (bcastTimer) clearTimeout(bcastTimer);
    bcastTimer = setTimeout(function(){
      bcastTimer = null;
      if (window.htmx) {
        htmx.ajax(
          'GET',
          '/api/rooms/' + roomId + '/broadcast-count?token=' + prefixLower,
          { target: '#lc-broadcast-count', swap: 'innerHTML' }
        );
      }
    }, 300);
  }
  function activeToken() {
    var pos = ta.selectionStart;
    var before = ta.value.slice(0, pos);
    var m = before.match(TOKEN);
    if (!m) return null;
    var prefix = m[2];
    var start = pos - prefix.length - 1;
    return { start: start, end: pos, prefix: prefix };
  }
  // Combobox semantics: the textarea is role="combobox" + aria-controls
  // pointing at the listbox. While the popover is open we set
  // aria-expanded="true" and aria-activedescendant to the currently
  // highlighted <li>'s id (each option has a stable id from the server
  // template, `lc-mention-option-N`). On close we clear both so SR engines
  // do not chase a stale descendant.
  function close() {
    current = null;
    slot.replaceChildren();
    ta.setAttribute('aria-expanded', 'false');
    ta.removeAttribute('aria-activedescendant');
  }
  // LC-227: 200ms debounce. Pre-LC-227 fired one htmx.ajax per keystroke; on
  // a 100ms-latency network, typing `@alice` stacked 6 in-flight requests
  // and the popover flickered as each landed. Stash the timer handle so the
  // teardown() at form swap can cancel a stray fire on a detached slot.
  var mentionTimer = null;
  function refresh() {
    if (mentionTimer) clearTimeout(mentionTimer);
    mentionTimer = setTimeout(function () {
      mentionTimer = null;
      current = activeToken();
      if (!current) return close();
      var url = '/users/mentions?room_id=' + roomId + '&q=' + encodeURIComponent(current.prefix);
      if (window.htmx) {
        htmx.ajax('GET', url, { target: '#lc-mention-popover', swap: 'innerHTML' });
      }
    }, 200);
  }
  // items() returns the role="option" <li>s; aria-selected lives on the LI
  // per WAI-ARIA pattern. The inner <button data-username> remains as the
  // click target (mouse and the keyboard Enter handler simulate via it).
  function items() { return slot.querySelectorAll('li[role="option"]'); }
  function selected() { return slot.querySelector('li[role="option"][aria-selected="true"]'); }
  function select(li) {
    items().forEach(function(l){ l.setAttribute('aria-selected', l === li ? 'true' : 'false'); });
    if (!li) return;
    if (li.id) ta.setAttribute('aria-activedescendant', li.id);
    if (li.scrollIntoView) li.scrollIntoView({ block: 'nearest' });
  }
  function insert(li) {
    if (!current || !li) return close();
    var btn = li.querySelector('button[data-username]');
    if (!btn) return close();
    var u = btn.getAttribute('data-username');
    var v = ta.value;
    ta.value = v.slice(0, current.start) + '@' + u + ' ' + v.slice(current.end);
    var pos = current.start + u.length + 2;
    ta.selectionStart = ta.selectionEnd = pos;
    close();
    ta.dispatchEvent(new Event('input'));
  }
  ta.addEventListener('input', refresh);
  ta.addEventListener('input', refreshBroadcastCount);
  ta.addEventListener('blur', function(){ setTimeout(close, 100); });
  // Broadcast count clears on blur too, on the same delay as the
  // autocomplete close so a click on a mention suggestion still has time
  // to land before the slot wipes.
  ta.addEventListener('blur', function(){ setTimeout(clearBroadcastSlot, 100); });
  ta.addEventListener('keydown', function(e){
    var list = items();
    if (!current || list.length === 0) return;
    var sel = selected() || list[0];
    var idx = Array.prototype.indexOf.call(list, sel);
    if (e.key === 'ArrowDown')      { e.preventDefault(); e.stopPropagation(); select(list[Math.min(idx + 1, list.length - 1)]); }
    else if (e.key === 'ArrowUp')   { e.preventDefault(); e.stopPropagation(); select(list[Math.max(idx - 1, 0)]); }
    else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); e.stopPropagation(); insert(sel); }
    else if (e.key === 'Escape')    { e.preventDefault(); e.stopPropagation(); close(); }
  }, true);
  function onAfterSwap(e){
    if (e.target && e.target.id === 'lc-mention-popover') {
      var firstLi = slot.querySelector('li[role="option"]');
      if (firstLi) {
        firstLi.setAttribute('aria-selected', 'true');
        ta.setAttribute('aria-expanded', 'true');
        if (firstLi.id) ta.setAttribute('aria-activedescendant', firstLi.id);
      } else {
        // Swap rendered the empty `<ul class="hidden">` (no results). Treat
        // as closed for combobox state so SR does not announce an expanded
        // listbox with nothing in it.
        ta.setAttribute('aria-expanded', 'false');
        ta.removeAttribute('aria-activedescendant');
      }
      slot.addEventListener('mousedown', function(ev){
        var li = ev.target.closest('li[role="option"]');
        if (li) { ev.preventDefault(); insert(li); }
      }, { once: true });
    }
  }
  document.body.addEventListener('htmx:afterSwap', onAfterSwap);
  // Teardown: the ta-bound listeners die with the textarea on swap; the body
  // listener does not, so drop it here. Also cancel any pending broadcast
  // debounce so a stray fire after #composer is gone doesn't try to swap
  // into a missing slot. Cleanup-root is #composer (form).
  function teardown() {
    document.body.removeEventListener('htmx:afterSwap', onAfterSwap);
    if (bcastTimer) { clearTimeout(bcastTimer); bcastTimer = null; }
    // LC-227: cancel a pending mention-popover refresh so it cannot fire
    // an htmx.ajax targeting a detached #lc-mention-popover slot.
    if (mentionTimer) { clearTimeout(mentionTimer); mentionTimer = null; }
    // LC-216: cancel a pending failure-banner reveal so it cannot fire on a
    // detached .composer-error after the form is swapped out.
    if (window.__lcComposerErrTimer) { clearTimeout(window.__lcComposerErrTimer); window.__lcComposerErrTimer = null; }
    // LC-229: cancel a pending auto-resize rAF so it cannot run against a
    // detached textarea after the form is swapped out.
    if (window.__lcResizeRaf) { cancelAnimationFrame(window.__lcResizeRaf); window.__lcResizeRaf = 0; }
  }
  var root = document.currentScript.closest('[data-lc-cleanup-root]')
          || document.currentScript.parentElement;
  root.addEventListener('htmx:beforeCleanupElement', teardown, { once: true });
})();
</script>
<script>
// Press Enter anywhere on the page to send the pending message. The textarea
// has its own onkeydown for the focused case (and mention-popover handling);
// this covers Enter while focus is elsewhere - message list, body, etc. We
// skip interactive elements so Enter keeps its native meaning there (buttons,
// links, other inputs). Cleanup-root is #composer (form).
(function(){
  var form = document.getElementById('composer');
  var ta = form && form.querySelector('textarea[name=body]');
  if (!form || !ta) return;
  var SKIP = { INPUT: 1, TEXTAREA: 1, SELECT: 1, BUTTON: 1, A: 1, OPTION: 1 };
  function onDocKeydown(e){
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
    var t = e.target;
    if (t && (SKIP[t.tagName] || t.isContentEditable)) return;
    if (!ta.value.trim() && !form.file_id.value) return;
    e.preventDefault();
    form.requestSubmit();
  }
  document.addEventListener('keydown', onDocKeydown);
  function teardown(){ document.removeEventListener('keydown', onDocKeydown); }
  var root = document.currentScript.closest('[data-lc-cleanup-root]')
          || document.currentScript.parentElement;
  root.addEventListener('htmx:beforeCleanupElement', teardown, { once: true });
})();
</script>
<script>
(function(){
  var input = document.getElementById('lc-file');
  var staged = document.getElementById('lc-staged');
  var errSlot = document.getElementById('lc-upload-error');
  var hidden = document.querySelector('#composer input[name=file_id]');
  var ta = document.querySelector('#composer textarea[name=body]');
  var overlay = document.getElementById('lc-drop-overlay');
  var currentObjectUrl = null;

  function revokePreview(){
    if (currentObjectUrl) {
      URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = null;
    }
  }
  function clear(){
    revokePreview();
    hidden.value = '';
    staged.textContent = '';
    errSlot.textContent = '';
    input.value = '';
    // LC-229: removing the attachment can flip the send button back to
    // disabled (when the textarea is also empty); go through the shared
    // predicate instead of leaving the button stale.
    if (window.__lcRefreshSend) window.__lcRefreshSend();
  }
  window.__lcClearAttach = clear;

  function fmt(n){ return n < 1024 ? n+'B' : (n/1024).toFixed(1)+'KB'; }

  function showPreview(f){
    revokePreview();
    if (!f.type || !f.type.startsWith('image/')) {
      staged.innerHTML = 'Uploading ' + f.name + '...';
      return;
    }
    currentObjectUrl = URL.createObjectURL(f);
    staged.innerHTML =
      '<span class="inline-flex items-center gap-2">' +
        '<img src="' + currentObjectUrl + '" alt="" class="h-12 w-12 rounded object-cover">' +
        '<span>Uploading ' + f.name + '...</span>' +
      '</span>';
  }

  async function uploadStaged(f){
    errSlot.textContent = '';
    showPreview(f);
    var fd = new FormData(); fd.append('file', f);
    try {
      var res = await fetch('/api/upload', { method: 'POST', body: fd, credentials: 'same-origin' });
      if (!res.ok) {
        var msg = await res.text();
        errSlot.textContent = msg || ('upload failed: '+res.status);
        revokePreview();
        staged.textContent = '';
        input.value = '';
        return;
      }
      var data = await res.json();
      hidden.value = data.file_id;
      var preview = currentObjectUrl
        ? '<img src="' + currentObjectUrl + '" alt="" class="h-12 w-12 rounded object-cover">'
        : '';
      staged.innerHTML =
        '<span class="inline-flex items-center gap-2">' + preview +
          '<span>Attached: ' + f.name + ' (' + fmt(f.size) + ')</span>' +
          '<button type="button" aria-label="Remove attachment" onclick="window.__lcClearAttach()" class="ml-1 text-danger">x</button>' +
        '</span>';
      if (window.__lcRefreshSend) window.__lcRefreshSend();
    } catch (e) {
      errSlot.textContent = 'upload failed';
      revokePreview();
      input.value = '';
    }
  }

  input.addEventListener('change', function(){
    var f = input.files && input.files[0];
    if (f) uploadStaged(f);
  });

  // Pasting an image straight into the composer should attach it. We do not
  // intercept pastes that contain text only, so normal copy/paste still works.
  ta.addEventListener('paste', function(e){
    if (!e.clipboardData || !e.clipboardData.files || !e.clipboardData.files.length) return;
    var f = e.clipboardData.files[0];
    if (!f) return;
    e.preventDefault();
    uploadStaged(f);
  });

  // Drag/drop anywhere on the page while a composer is mounted. We use a
  // counter rather than relying on `dragleave` for cleanup because dragleave
  // fires for child elements as the cursor moves over them.
  if (!window.__lcDropAttached) {
    window.__lcDropAttached = true;
    var dragCounter = 0;
    document.addEventListener('dragenter', function(e){
      if (!e.dataTransfer) return;
      var has = false;
      for (var i = 0; i < e.dataTransfer.types.length; i++) {
        if (e.dataTransfer.types[i] === 'Files') { has = true; break; }
      }
      if (!has) return;
      dragCounter++;
      overlay.classList.remove('hidden');
    });
    document.addEventListener('dragleave', function(){
      dragCounter = Math.max(0, dragCounter - 1);
      if (dragCounter === 0) overlay.classList.add('hidden');
    });
    document.addEventListener('dragover', function(e){
      if (e.dataTransfer && e.dataTransfer.types && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') !== -1) {
        e.preventDefault();
      }
    });
    document.addEventListener('drop', function(e){
      dragCounter = 0;
      overlay.classList.add('hidden');
      if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
      e.preventDefault();
      var f = e.dataTransfer.files[0];
      if (f) uploadStaged(f);
    });
  }
})();
</script>
<script>
// Voice-message recorder. Records mic audio with MediaRecorder, decodes the
// blob client-side to compute a waveform, then uploads it through the same
// /api/upload endpoint the file picker uses (with kind=voice + waveform).
// The returned file_id is stashed in the hidden #composer input[name=file_id]
// so the normal form submit carries it - identical to the file-attach flow.
(function(){
  var MAX_SECONDS = 300;     // 5-minute hard cap (matches the feature spec)
  var WAVEFORM_BUCKETS = 60; // peaks stored per recording

  var recordBtn = document.getElementById('lc-record');
  var staged = document.getElementById('lc-staged');
  var errSlot = document.getElementById('lc-upload-error');
  var hidden = document.querySelector('#composer input[name=file_id]');
  if (!recordBtn || !staged || !errSlot || !hidden) return;

  var mediaRecorder = null;
  var mediaStream = null;
  var chunks = [];
  var startedAt = 0;
  var tickTimer = null;
  var capTimer = null;
  var recording = false;

  function fmtTime(s){
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function pickMimeType(){
    var prefs = ['audio/webm', 'audio/ogg', 'audio/mp4'];
    if (window.MediaRecorder && MediaRecorder.isTypeSupported) {
      for (var i = 0; i < prefs.length; i++) {
        if (MediaRecorder.isTypeSupported(prefs[i])) return prefs[i];
      }
    }
    return '';
  }

  function releaseStream(){
    if (mediaStream) {
      mediaStream.getTracks().forEach(function(t){ t.stop(); });
      mediaStream = null;
    }
  }

  function resetUi(){
    recording = false;
    recordBtn.classList.remove('text-danger');
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    if (capTimer) { clearTimeout(capTimer); capTimer = null; }
  }

  // Decode the recorded blob to WAVEFORM_BUCKETS peak values (0..1) plus the
  // exact duration in seconds. Capturing the duration here is what lets the
  // player draw a progress bar: MediaRecorder webm/ogg blobs carry no duration
  // in the container header, so the player cannot derive it from the <audio>
  // element. Best-effort: a decode failure yields empty peaks + 0 duration and
  // the message renders without a waveform.
  async function computeWaveform(blob){
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return { peaks: [], duration: 0 };
      var buf = await blob.arrayBuffer();
      var ctx = new AC();
      var audioBuf = await ctx.decodeAudioData(buf);
      var data = audioBuf.getChannelData(0);
      var bucketSize = Math.floor(data.length / WAVEFORM_BUCKETS) || 1;
      var peaks = [];
      var max = 0.0001;
      for (var b = 0; b < WAVEFORM_BUCKETS; b++) {
        var start = b * bucketSize;
        var peak = 0;
        for (var i = 0; i < bucketSize && start + i < data.length; i++) {
          var v = Math.abs(data[start + i]);
          if (v > peak) peak = v;
        }
        peaks.push(peak);
        if (peak > max) max = peak;
      }
      var duration = audioBuf.duration;
      ctx.close();
      return {
        peaks: peaks.map(function(p){ return Math.round((p / max) * 1000) / 1000; }),
        duration: isFinite(duration) ? duration : 0,
      };
    } catch (e) {
      return { peaks: [], duration: 0 };
    }
  }

  function showRecording(){
    staged.innerHTML =
      '<span class="inline-flex items-center gap-2">' +
        '<span class="text-danger">● Recording</span>' +
        '<span id="lc-record-time">0:00</span>' +
        '<button type="button" id="lc-record-stop" class="underline">Stop</button>' +
        '<button type="button" id="lc-record-cancel" class="text-danger">Cancel</button>' +
      '</span>';
    document.getElementById('lc-record-stop').addEventListener('click', function(){ stop(false); });
    document.getElementById('lc-record-cancel').addEventListener('click', function(){ stop(true); });
  }

  function tick(){
    var el = document.getElementById('lc-record-time');
    if (el) el.textContent = fmtTime((Date.now() - startedAt) / 1000);
  }

  async function start(){
    errSlot.textContent = '';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      errSlot.textContent = 'Voice recording is not supported in this browser';
      return;
    }
    try {
      // Use the browser's default audio processing (noise suppression, auto
      // gain control, echo cancellation all on). Noise suppression in
      // particular removes periodic electrical spikes some mics inject into
      // the raw capture; disabling it lets that noise straight into the file.
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      errSlot.textContent = 'Microphone access denied';
      return;
    }
    var mimeType = pickMimeType();
    try {
      mediaRecorder = mimeType
        ? new MediaRecorder(mediaStream, { mimeType: mimeType })
        : new MediaRecorder(mediaStream);
    } catch (e) {
      releaseStream();
      errSlot.textContent = 'Could not start recording';
      return;
    }
    chunks = [];
    mediaRecorder.addEventListener('dataavailable', function(e){
      if (e.data && e.data.size > 0) chunks.push(e.data);
    });
    mediaRecorder.addEventListener('stop', onStop);
    mediaRecorder.start();
    recording = true;
    startedAt = Date.now();
    recordBtn.classList.add('text-danger');
    showRecording();
    tickTimer = setInterval(tick, 250);
    capTimer = setTimeout(function(){ stop(false); }, MAX_SECONDS * 1000);
  }

  // `cancelled` distinguishes the Cancel button (discard) from Stop (upload).
  var cancelled = false;
  function stop(isCancel){
    if (!recording || !mediaRecorder) return;
    cancelled = isCancel;
    resetUi();
    try { mediaRecorder.stop(); } catch (e) {}
  }

  async function onStop(){
    releaseStream();
    var type = (mediaRecorder && mediaRecorder.mimeType) || 'audio/webm';
    var blob = new Blob(chunks, { type: type });
    chunks = [];
    if (cancelled) {
      staged.textContent = '';
      return;
    }
    if (blob.size === 0) {
      errSlot.textContent = 'Recording was empty';
      staged.textContent = '';
      return;
    }
    staged.innerHTML = 'Uploading voice message...';
    var wf = await computeWaveform(blob);
    var fd = new FormData();
    // Order matters: the server reads kind + waveform before the file field.
    // The waveform field is a JSON object: { d: duration_seconds, p: [peaks] }.
    fd.append('kind', 'voice');
    fd.append('waveform', JSON.stringify({ d: wf.duration, p: wf.peaks }));
    var ext = type.indexOf('ogg') !== -1 ? 'ogg' : (type.indexOf('mp4') !== -1 ? 'm4a' : 'webm');
    fd.append('file', blob, 'voice-message.' + ext);
    try {
      var res = await fetch('/api/upload', { method: 'POST', body: fd, credentials: 'same-origin' });
      if (!res.ok) {
        errSlot.textContent = (await res.text()) || ('upload failed: ' + res.status);
        staged.textContent = '';
        return;
      }
      var data = await res.json();
      hidden.value = data.file_id;
      staged.innerHTML =
        '<span class="inline-flex items-center gap-2">' +
          '<span>Voice message attached</span>' +
          '<button type="button" aria-label="Remove attachment" onclick="window.__lcClearAttach && window.__lcClearAttach()" class="ml-1 text-danger">x</button>' +
        '</span>';
      if (window.__lcRefreshSend) window.__lcRefreshSend();
    } catch (e) {
      errSlot.textContent = 'upload failed';
      staged.textContent = '';
    }
  }

  recordBtn.addEventListener('click', function(){
    if (recording) stop(false);
    else start();
  });

  // Teardown: if #composer is swapped out mid-recording, stop the recorder
  // and release the mic so the tab's recording indicator clears. Setting
  // `cancelled` makes the async `onStop` bail instead of uploading into the
  // now-detached DOM. Cleanup-root is #composer (form).
  function teardown(){
    cancelled = true;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      try { mediaRecorder.stop(); } catch (e) {}
    }
    resetUi();
    releaseStream();
  }
  var root = document.currentScript.closest('[data-lc-cleanup-root]')
          || document.currentScript.parentElement;
  root.addEventListener('htmx:beforeCleanupElement', teardown, { once: true });
})();
</script>
<script>
// LC-76: slash-command autocomplete. Fires while the composer holds only a
// command name (a leading `/word` with no space yet); clears once the user
// types args or anything non-command. Click-to-insert via __lcInsertSlash.
(function(){
  var ta = document.querySelector('#composer textarea[name=body]');
  var slot = document.getElementById('lc-slash-popover');
  if (!ta || !slot) return;
  var SLASH = /^\/([a-z0-9_-]*)$/i;
  var timer = null;
  // Whether the popover currently holds options. Gates the keyboard handler so
  // it no-ops (and lets the textarea's normal keys through) when slash is not
  // the active token. The mention combobox shares this textarea but is
  // mutually exclusive: its `@token` cannot match while the whole value is a
  // single `/command`, so the two keydown handlers never both act.
  var open = false;

  // LC-168: keyboard navigation to match the mention combobox. Options carry
  // role="option" + a stable id; aria-selected lives on the <li>, and the
  // textarea's aria-activedescendant tracks the highlighted option.
  function items() { return slot.querySelectorAll('li[role="option"]'); }
  function selected() { return slot.querySelector('li[role="option"][aria-selected="true"]'); }
  function select(li) {
    items().forEach(function(l){ l.setAttribute('aria-selected', l === li ? 'true' : 'false'); });
    if (li) {
      if (li.id) ta.setAttribute('aria-activedescendant', li.id);
      if (li.scrollIntoView) li.scrollIntoView({ block: 'nearest' });
    }
  }
  function clearPopover(){
    if (timer) { clearTimeout(timer); timer = null; }
    slot.innerHTML = '';
    open = false;
    ta.setAttribute('aria-expanded', 'false');
    ta.removeAttribute('aria-activedescendant');
  }
  function refresh(){
    var m = ta.value.match(SLASH);
    if (!m) { clearPopover(); return; }
    if (timer) clearTimeout(timer);
    var q = m[1];
    timer = setTimeout(function(){
      timer = null;
      if (window.htmx) {
        window.htmx.ajax('GET', '/api/slash-commands?q=' + encodeURIComponent(q),
          { target: '#lc-slash-popover', swap: 'innerHTML' });
      }
    }, 120);
  }
  function insert(li){
    if (!li) return clearPopover();
    var name = li.getAttribute('data-slash-name');
    if (name == null) return clearPopover();
    window.__lcInsertSlash(name);
  }
  ta.addEventListener('input', refresh);
  ta.addEventListener('blur', function(){ setTimeout(clearPopover, 150); });
  ta.addEventListener('keydown', function(e){
    var list = items();
    if (!open || list.length === 0) return;
    var sel = selected() || list[0];
    var idx = Array.prototype.indexOf.call(list, sel);
    if (e.key === 'ArrowDown')      { e.preventDefault(); e.stopPropagation(); select(list[Math.min(idx + 1, list.length - 1)]); }
    else if (e.key === 'ArrowUp')   { e.preventDefault(); e.stopPropagation(); select(list[Math.max(idx - 1, 0)]); }
    else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); e.stopPropagation(); insert(sel); }
    else if (e.key === 'Escape')    { e.preventDefault(); e.stopPropagation(); clearPopover(); }
  }, true);
  // Highlight the first option after each swap (or mark closed when empty), so
  // Enter inserts a sensible default without an explicit ArrowDown first.
  function onAfterSwap(e){
    if (!e.target || e.target.id !== 'lc-slash-popover') return;
    var first = slot.querySelector('li[role="option"]');
    if (first) {
      open = true;
      first.setAttribute('aria-selected', 'true');
      ta.setAttribute('aria-expanded', 'true');
      if (first.id) ta.setAttribute('aria-activedescendant', first.id);
    } else {
      open = false;
      ta.setAttribute('aria-expanded', 'false');
      ta.removeAttribute('aria-activedescendant');
    }
  }
  document.body.addEventListener('htmx:afterSwap', onAfterSwap);
  function teardown(){ document.body.removeEventListener('htmx:afterSwap', onAfterSwap); }
  var root = document.currentScript.closest('[data-lc-cleanup-root]')
          || document.currentScript.parentElement;
  root.addEventListener('htmx:beforeCleanupElement', teardown, { once: true });

  window.__lcInsertSlash = function(name){
    ta.value = '/' + name + ' ';
    clearPopover();
    ta.focus();
    // LC-229: shared predicate (pre-LC-229 this site checked only
    // ta.value.trim() and ignored an attached file_id).
    if (window.__lcRefreshSend) window.__lcRefreshSend();
  };
})();
</script>
<script>
// LC-230: optimistic local echo. The form's hx-on::config-request calls
// __lcOptimisticEcho(cid, body) to append a pending placeholder to #messages
// before the POST round-trip completes. Dedupe: the server echoes the cid on
// the author's WS broadcast as data-lc-client-id on the OOB wrapper, and
// live.js removes the matching placeholder in htmx:oobBeforeSwap (so the
// placeholder removal and the canonical insert land in the same swap cycle -
// no double render, no gap). On request failure, hx-on::after-request calls
// __lcEchoFailed(cid) to flip the placeholder to a failed row with retry /
// discard controls.
//
// The placeholder is intentionally minimal: plain text body (no markdown
// render, no attachments preview), the viewer's own display name, and a
// dimmed "sending" style. Fidelity arrives with the canonical render.
(function(){
  function messagesEl(){ return document.getElementById('messages'); }
  function selfName(){
    // The sidebar self block's avatar (layout.html) carries the viewer's
    // display label as alt text; reuse it rather than threading a new
    // template variable into ComposerFragment.
    var img = document.querySelector('[data-lc-local-avatar]');
    return (img && img.getAttribute('alt')) || '';
  }

  window.__lcOptimisticEcho = function(cid, body){
    var list = messagesEl();
    if (!list) return;
    var row = document.createElement('div');
    row.id = 'msg-pending-' + cid;
    row.setAttribute('data-client-id', cid);
    row.setAttribute('data-lc-pending', 'true');
    row.className = 'lc-anim-swap relative px-4 py-2';
    row.style.opacity = '0.6';

    var header = document.createElement('div');
    header.className = 'flex items-baseline gap-2';
    var name = document.createElement('span');
    name.className = 'font-semibold';
    name.textContent = selfName();
    header.appendChild(name);
    var state = document.createElement('span');
    state.className = 'text-xs text-content-muted';
    state.style.fontStyle = 'italic';
    state.setAttribute('data-lc-echo-state', '');
    state.textContent = '{{ "room-composer-echo-sending"|t }}';
    header.appendChild(state);
    row.appendChild(header);

    var bodyEl = document.createElement('div');
    bodyEl.className = 'whitespace-pre-wrap break-words';
    // textContent (never innerHTML): the body is untrusted user input.
    bodyEl.textContent = body;
    row.appendChild(bodyEl);

    list.appendChild(row);
    // The user just sent this; always reveal it (auto_scroll.html only
    // follows htmx swaps, not direct appendChild).
    list.scrollTop = list.scrollHeight;
  };

  window.__lcEchoFailed = function(cid){
    var list = messagesEl();
    if (!list) return;
    var row = list.querySelector('[data-client-id="' + cid + '"][data-lc-pending]');
    if (!row) return;
    row.removeAttribute('data-lc-pending');
    row.setAttribute('data-lc-failed', 'true');
    row.style.opacity = '1';

    var state = row.querySelector('[data-lc-echo-state]');
    if (state) {
      state.textContent = '';
      state.style.fontStyle = 'normal';

      var failed = document.createElement('span');
      failed.className = 'text-danger';
      failed.textContent = '{{ "room-composer-send-failed"|t }}';
      state.appendChild(failed);

      var retry = document.createElement('button');
      retry.type = 'button';
      retry.className = 'underline hover:no-underline ml-2';
      retry.textContent = '{{ "room-composer-retry"|t }}';
      retry.addEventListener('click', function(){
        // Re-submit through the composer form so the retry gets a fresh
        // client_id, a fresh placeholder, and the normal failure handling.
        // If the user already cleared the textarea, restore this row's body
        // first so the retry sends what the row shows.
        var formEl = document.getElementById('composer');
        var taEl = formEl && formEl.querySelector('textarea[name=body]');
        if (!formEl || !taEl) return;
        if (!taEl.value.trim()) {
          var bodyEl = row.querySelector('.whitespace-pre-wrap');
          taEl.value = bodyEl ? bodyEl.textContent : '';
          taEl.dispatchEvent(new Event('input'));
        }
        row.remove();
        formEl.requestSubmit();
      });
      state.appendChild(retry);

      var discard = document.createElement('button');
      discard.type = 'button';
      discard.className = 'underline hover:no-underline ml-2 text-content-muted';
      discard.textContent = '{{ "room-composer-echo-discard"|t }}';
      discard.addEventListener('click', function(){ row.remove(); });
      state.appendChild(discard);
    }
  };
})();
</script>
