<!-- File input lives OUTSIDE the form: HTMX auto-switches to multipart
     encoding the moment a file input is inside a form, which would break
     the server's axum::Form parser. The JS uploads to /api/upload directly
     and stashes the returned file_id in the hidden input below. -->
<input id="lc-file" type="file" class="hidden">
<form
  id="composer"
  data-lc-cleanup-root
  hx-post="/room/{{ room.id }}/messages"
  hx-swap="none"
  hx-on::after-request="
    var ta = this.querySelector('textarea[name=body]');
    var send = this.querySelector('#composer-send');
    var err = this.querySelector('.composer-error');
    var bcast = document.getElementById('lc-broadcast-count');
    var qbar = document.getElementById('composer-quote-bar');
    if (event.detail.successful) {
      ta.value = '';
      ta.style.height = 'auto';
      send.disabled = true;
      err.classList.add('hidden');
      window.__lcLastTyping = 0;
      if (window.__lcClearAttach) window.__lcClearAttach();
      if (bcast) bcast.innerHTML = '';
      if (qbar) qbar.innerHTML = '';
    } else {
      err.classList.remove('hidden');
    }
    ta.focus();
  "
  class="border-t border-slate-200 p-2"
>
  <div id="lc-staged" class="mb-1 text-xs text-slate-500"></div>
  <div id="lc-broadcast-count" class="mb-1 text-xs text-slate-500 px-1 min-h-[1rem]"></div>
  <div id="composer-quote-bar"></div>
  <div id="lc-upload-error" class="mb-1 text-xs text-red-600"></div>
  <div id="lc-mention-popover" class="relative"></div>
  <div class="composer-error hidden mb-1 flex items-center gap-2 text-xs text-red-600">
    <span>Could not send.</span>
    <button type="submit" class="underline hover:no-underline">Retry</button>
  </div>
  <input type="hidden" name="file_id">
  <div class="flex items-end gap-2">
    <button type="button" title="Attach file"
      class="px-2 py-2 text-slate-500 hover:text-slate-800"
      onclick="document.getElementById('lc-file').click()">+</button>
    <button type="button" id="lc-record" title="Record voice message"
      class="px-2 py-2 text-slate-500 hover:text-slate-800"
      aria-label="Record voice message">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5">
        <path d="M10 2a3 3 0 00-3 3v5a3 3 0 006 0V5a3 3 0 00-3-3z"/>
        <path d="M5.5 9.5a.75.75 0 00-1.5 0 6 6 0 005.25 5.954V17.5H7.75a.75.75 0 000 1.5h4.5a.75.75 0 000-1.5H10.75v-2.046A6 6 0 0016 9.5a.75.75 0 00-1.5 0 4.5 4.5 0 01-9 0z"/>
      </svg>
    </button>
    <textarea
      name="body"
      rows="1"
      autocomplete="off"
      autofocus
      placeholder="Message #{{ room.name }}"
      class="flex-1 resize-none overflow-y-auto rounded border px-3 py-2 max-h-40"
      oninput="
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 160) + 'px';
        document.getElementById('composer-send').disabled = !this.value.trim() && !this.form.file_id.value;
        var ws = window.__lcWS;
        if (!ws) return;
        var now = Date.now();
        if (now - (window.__lcLastTyping || 0) < 2500) return;
        window.__lcLastTyping = now;
        ws.send(JSON.stringify({ type: 'typing', room_id: {{ room.id }} }));
      "
      onkeydown="
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          if (this.value.trim() || this.form.file_id.value) this.form.requestSubmit();
        }
      "
    ></textarea>
    <button
      id="composer-send"
      type="submit"
      disabled
      class="rounded bg-blue-600 px-3 py-2 text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50"
      aria-label="Send message"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5">
        <path d="M3.105 2.289a.75.75 0 00-.826.95l1.414 4.949a.75.75 0 00.604.534l7.443.972c.336.044.336.526 0 .57l-7.443.972a.75.75 0 00-.604.534l-1.414 4.949a.75.75 0 00.826.95 28.74 28.74 0 0015.585-7.122.75.75 0 000-1.054A28.74 28.74 0 003.105 2.289z" />
      </svg>
    </button>
  </div>
</form>
<div id="lc-drop-overlay" class="hidden pointer-events-none fixed inset-0 z-40 flex items-center justify-center bg-blue-900/40">
  <div class="rounded-lg bg-white px-6 py-4 text-lg font-semibold text-slate-800 shadow-lg">Drop file to attach</div>
</div>
<script>
(function(){
  var ta = document.querySelector('#composer textarea[name=body]');
  var slot = document.getElementById('lc-mention-popover');
  var bcastSlot = document.getElementById('lc-broadcast-count');
  if (!ta || !slot) return;
  var roomId = {{ room.id }};
  var TOKEN = /(^|\s)@([A-Za-z0-9_-]{0,32})$/;
  var current = null;
  // Debounce handle for the broadcast-count probe. The probe fires only
  // when the active token at the cursor is exactly `here` or `channel`
  // (case-insensitive). Any character typed after the token - including
  // a space - moves the cursor past the token-end anchor in the TOKEN
  // regex, activeToken() returns null, and we clear the slot. That is
  // the "friction at the moment of typing the broadcast token" rule:
  // once the user has moved on, the friction has done its job.
  var bcastTimer = null;
  function clearBroadcastSlot() {
    if (bcastTimer) { clearTimeout(bcastTimer); bcastTimer = null; }
    if (bcastSlot) bcastSlot.innerHTML = '';
  }
  function refreshBroadcastCount() {
    if (!bcastSlot) return;
    var tok = activeToken();
    if (!tok) return clearBroadcastSlot();
    var prefixLower = tok.prefix.toLowerCase();
    if (prefixLower !== 'here' && prefixLower !== 'channel') {
      return clearBroadcastSlot();
    }
    if (bcastTimer) clearTimeout(bcastTimer);
    bcastTimer = setTimeout(function(){
      bcastTimer = null;
      if (window.htmx) {
        htmx.ajax(
          'GET',
          '/api/rooms/' + roomId + '/broadcast-count?token=' + prefixLower,
          { target: '#lc-broadcast-count', swap: 'innerHTML' }
        );
      }
    }, 300);
  }
  function activeToken() {
    var pos = ta.selectionStart;
    var before = ta.value.slice(0, pos);
    var m = before.match(TOKEN);
    if (!m) return null;
    var prefix = m[2];
    var start = pos - prefix.length - 1;
    return { start: start, end: pos, prefix: prefix };
  }
  function close() { current = null; slot.replaceChildren(); }
  function refresh() {
    current = activeToken();
    if (!current) return close();
    var url = '/users/mentions?room_id=' + roomId + '&q=' + encodeURIComponent(current.prefix);
    if (window.htmx) {
      htmx.ajax('GET', url, { target: '#lc-mention-popover', swap: 'innerHTML' });
    }
  }
  function items() { return slot.querySelectorAll('button[data-username]'); }
  function selected() { return slot.querySelector('button[aria-selected="true"]'); }
  function select(btn) {
    items().forEach(function(b){ b.setAttribute('aria-selected', b === btn ? 'true' : 'false'); });
    if (btn && btn.scrollIntoView) btn.scrollIntoView({ block: 'nearest' });
  }
  function insert(btn) {
    if (!current || !btn) return close();
    var u = btn.getAttribute('data-username');
    var v = ta.value;
    ta.value = v.slice(0, current.start) + '@' + u + ' ' + v.slice(current.end);
    var pos = current.start + u.length + 2;
    ta.selectionStart = ta.selectionEnd = pos;
    close();
    ta.dispatchEvent(new Event('input'));
  }
  ta.addEventListener('input', refresh);
  ta.addEventListener('input', refreshBroadcastCount);
  ta.addEventListener('blur', function(){ setTimeout(close, 100); });
  // Broadcast count clears on blur too, on the same delay as the
  // autocomplete close so a click on a mention suggestion still has time
  // to land before the slot wipes.
  ta.addEventListener('blur', function(){ setTimeout(clearBroadcastSlot, 100); });
  ta.addEventListener('keydown', function(e){
    var list = items();
    if (!current || list.length === 0) return;
    var sel = selected() || list[0];
    var idx = Array.prototype.indexOf.call(list, sel);
    if (e.key === 'ArrowDown')      { e.preventDefault(); e.stopPropagation(); select(list[Math.min(idx + 1, list.length - 1)]); }
    else if (e.key === 'ArrowUp')   { e.preventDefault(); e.stopPropagation(); select(list[Math.max(idx - 1, 0)]); }
    else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); e.stopPropagation(); insert(sel); }
    else if (e.key === 'Escape')    { e.preventDefault(); e.stopPropagation(); close(); }
  }, true);
  function onAfterSwap(e){
    if (e.target && e.target.id === 'lc-mention-popover') {
      var first = slot.querySelector('button[data-username]');
      if (first) first.setAttribute('aria-selected', 'true');
      slot.addEventListener('mousedown', function(ev){
        var b = ev.target.closest('button[data-username]');
        if (b) { ev.preventDefault(); insert(b); }
      }, { once: true });
    }
  }
  document.body.addEventListener('htmx:afterSwap', onAfterSwap);
  // Teardown: the ta-bound listeners die with the textarea on swap; the body
  // listener does not, so drop it here. Also cancel any pending broadcast
  // debounce so a stray fire after #composer is gone doesn't try to swap
  // into a missing slot. Cleanup-root is #composer (form).
  function teardown() {
    document.body.removeEventListener('htmx:afterSwap', onAfterSwap);
    if (bcastTimer) { clearTimeout(bcastTimer); bcastTimer = null; }
  }
  var root = document.currentScript.closest('[data-lc-cleanup-root]')
          || document.currentScript.parentElement;
  root.addEventListener('htmx:beforeCleanupElement', teardown, { once: true });
})();
</script>
<script>
// Press Enter anywhere on the page to send the pending message. The textarea
// has its own onkeydown for the focused case (and mention-popover handling);
// this covers Enter while focus is elsewhere - message list, body, etc. We
// skip interactive elements so Enter keeps its native meaning there (buttons,
// links, other inputs). Cleanup-root is #composer (form).
(function(){
  var form = document.getElementById('composer');
  var ta = form && form.querySelector('textarea[name=body]');
  if (!form || !ta) return;
  var SKIP = { INPUT: 1, TEXTAREA: 1, SELECT: 1, BUTTON: 1, A: 1, OPTION: 1 };
  function onDocKeydown(e){
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
    var t = e.target;
    if (t && (SKIP[t.tagName] || t.isContentEditable)) return;
    if (!ta.value.trim() && !form.file_id.value) return;
    e.preventDefault();
    form.requestSubmit();
  }
  document.addEventListener('keydown', onDocKeydown);
  function teardown(){ document.removeEventListener('keydown', onDocKeydown); }
  var root = document.currentScript.closest('[data-lc-cleanup-root]')
          || document.currentScript.parentElement;
  root.addEventListener('htmx:beforeCleanupElement', teardown, { once: true });
})();
</script>
<script>
(function(){
  var input = document.getElementById('lc-file');
  var staged = document.getElementById('lc-staged');
  var errSlot = document.getElementById('lc-upload-error');
  var hidden = document.querySelector('#composer input[name=file_id]');
  var ta = document.querySelector('#composer textarea[name=body]');
  var overlay = document.getElementById('lc-drop-overlay');
  var currentObjectUrl = null;

  function revokePreview(){
    if (currentObjectUrl) {
      URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = null;
    }
  }
  function clear(){
    revokePreview();
    hidden.value = '';
    staged.textContent = '';
    errSlot.textContent = '';
    input.value = '';
  }
  window.__lcClearAttach = clear;

  function fmt(n){ return n < 1024 ? n+'B' : (n/1024).toFixed(1)+'KB'; }

  function showPreview(f){
    revokePreview();
    if (!f.type || !f.type.startsWith('image/')) {
      staged.innerHTML = 'Uploading ' + f.name + '...';
      return;
    }
    currentObjectUrl = URL.createObjectURL(f);
    staged.innerHTML =
      '<span class="inline-flex items-center gap-2">' +
        '<img src="' + currentObjectUrl + '" alt="" class="h-12 w-12 rounded object-cover">' +
        '<span>Uploading ' + f.name + '...</span>' +
      '</span>';
  }

  async function uploadStaged(f){
    errSlot.textContent = '';
    showPreview(f);
    var fd = new FormData(); fd.append('file', f);
    try {
      var res = await fetch('/api/upload', { method: 'POST', body: fd, credentials: 'same-origin' });
      if (!res.ok) {
        var msg = await res.text();
        errSlot.textContent = msg || ('upload failed: '+res.status);
        revokePreview();
        staged.textContent = '';
        input.value = '';
        return;
      }
      var data = await res.json();
      hidden.value = data.file_id;
      var preview = currentObjectUrl
        ? '<img src="' + currentObjectUrl + '" alt="" class="h-12 w-12 rounded object-cover">'
        : '';
      staged.innerHTML =
        '<span class="inline-flex items-center gap-2">' + preview +
          '<span>Attached: ' + f.name + ' (' + fmt(f.size) + ')</span>' +
          '<button type="button" onclick="window.__lcClearAttach()" class="ml-1 text-red-500">x</button>' +
        '</span>';
      document.getElementById('composer-send').disabled = false;
    } catch (e) {
      errSlot.textContent = 'upload failed';
      revokePreview();
      input.value = '';
    }
  }

  input.addEventListener('change', function(){
    var f = input.files && input.files[0];
    if (f) uploadStaged(f);
  });

  // Pasting an image straight into the composer should attach it. We do not
  // intercept pastes that contain text only, so normal copy/paste still works.
  ta.addEventListener('paste', function(e){
    if (!e.clipboardData || !e.clipboardData.files || !e.clipboardData.files.length) return;
    var f = e.clipboardData.files[0];
    if (!f) return;
    e.preventDefault();
    uploadStaged(f);
  });

  // Drag/drop anywhere on the page while a composer is mounted. We use a
  // counter rather than relying on `dragleave` for cleanup because dragleave
  // fires for child elements as the cursor moves over them.
  if (!window.__lcDropAttached) {
    window.__lcDropAttached = true;
    var dragCounter = 0;
    document.addEventListener('dragenter', function(e){
      if (!e.dataTransfer) return;
      var has = false;
      for (var i = 0; i < e.dataTransfer.types.length; i++) {
        if (e.dataTransfer.types[i] === 'Files') { has = true; break; }
      }
      if (!has) return;
      dragCounter++;
      overlay.classList.remove('hidden');
    });
    document.addEventListener('dragleave', function(){
      dragCounter = Math.max(0, dragCounter - 1);
      if (dragCounter === 0) overlay.classList.add('hidden');
    });
    document.addEventListener('dragover', function(e){
      if (e.dataTransfer && e.dataTransfer.types && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') !== -1) {
        e.preventDefault();
      }
    });
    document.addEventListener('drop', function(e){
      dragCounter = 0;
      overlay.classList.add('hidden');
      if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
      e.preventDefault();
      var f = e.dataTransfer.files[0];
      if (f) uploadStaged(f);
    });
  }
})();
</script>
<script>
// Voice-message recorder. Records mic audio with MediaRecorder, decodes the
// blob client-side to compute a waveform, then uploads it through the same
// /api/upload endpoint the file picker uses (with kind=voice + waveform).
// The returned file_id is stashed in the hidden #composer input[name=file_id]
// so the normal form submit carries it - identical to the file-attach flow.
(function(){
  var MAX_SECONDS = 300;     // 5-minute hard cap (matches the feature spec)
  var WAVEFORM_BUCKETS = 60; // peaks stored per recording

  var recordBtn = document.getElementById('lc-record');
  var staged = document.getElementById('lc-staged');
  var errSlot = document.getElementById('lc-upload-error');
  var hidden = document.querySelector('#composer input[name=file_id]');
  var sendBtn = document.getElementById('composer-send');
  if (!recordBtn || !staged || !errSlot || !hidden) return;

  var mediaRecorder = null;
  var mediaStream = null;
  var chunks = [];
  var startedAt = 0;
  var tickTimer = null;
  var capTimer = null;
  var recording = false;

  function fmtTime(s){
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function pickMimeType(){
    var prefs = ['audio/webm', 'audio/ogg', 'audio/mp4'];
    if (window.MediaRecorder && MediaRecorder.isTypeSupported) {
      for (var i = 0; i < prefs.length; i++) {
        if (MediaRecorder.isTypeSupported(prefs[i])) return prefs[i];
      }
    }
    return '';
  }

  function releaseStream(){
    if (mediaStream) {
      mediaStream.getTracks().forEach(function(t){ t.stop(); });
      mediaStream = null;
    }
  }

  function resetUi(){
    recording = false;
    recordBtn.classList.remove('text-red-600');
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    if (capTimer) { clearTimeout(capTimer); capTimer = null; }
  }

  // Decode the recorded blob to WAVEFORM_BUCKETS peak values (0..1) plus the
  // exact duration in seconds. Capturing the duration here is what lets the
  // player draw a progress bar: MediaRecorder webm/ogg blobs carry no duration
  // in the container header, so the player cannot derive it from the <audio>
  // element. Best-effort: a decode failure yields empty peaks + 0 duration and
  // the message renders without a waveform.
  async function computeWaveform(blob){
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return { peaks: [], duration: 0 };
      var buf = await blob.arrayBuffer();
      var ctx = new AC();
      var audioBuf = await ctx.decodeAudioData(buf);
      var data = audioBuf.getChannelData(0);
      var bucketSize = Math.floor(data.length / WAVEFORM_BUCKETS) || 1;
      var peaks = [];
      var max = 0.0001;
      for (var b = 0; b < WAVEFORM_BUCKETS; b++) {
        var start = b * bucketSize;
        var peak = 0;
        for (var i = 0; i < bucketSize && start + i < data.length; i++) {
          var v = Math.abs(data[start + i]);
          if (v > peak) peak = v;
        }
        peaks.push(peak);
        if (peak > max) max = peak;
      }
      var duration = audioBuf.duration;
      ctx.close();
      return {
        peaks: peaks.map(function(p){ return Math.round((p / max) * 1000) / 1000; }),
        duration: isFinite(duration) ? duration : 0,
      };
    } catch (e) {
      return { peaks: [], duration: 0 };
    }
  }

  function showRecording(){
    staged.innerHTML =
      '<span class="inline-flex items-center gap-2">' +
        '<span class="text-red-600">● Recording</span>' +
        '<span id="lc-record-time">0:00</span>' +
        '<button type="button" id="lc-record-stop" class="underline">Stop</button>' +
        '<button type="button" id="lc-record-cancel" class="text-red-500">Cancel</button>' +
      '</span>';
    document.getElementById('lc-record-stop').addEventListener('click', function(){ stop(false); });
    document.getElementById('lc-record-cancel').addEventListener('click', function(){ stop(true); });
  }

  function tick(){
    var el = document.getElementById('lc-record-time');
    if (el) el.textContent = fmtTime((Date.now() - startedAt) / 1000);
  }

  async function start(){
    errSlot.textContent = '';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      errSlot.textContent = 'Voice recording is not supported in this browser';
      return;
    }
    try {
      // Use the browser's default audio processing (noise suppression, auto
      // gain control, echo cancellation all on). Noise suppression in
      // particular removes periodic electrical spikes some mics inject into
      // the raw capture; disabling it lets that noise straight into the file.
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      errSlot.textContent = 'Microphone access denied';
      return;
    }
    var mimeType = pickMimeType();
    try {
      mediaRecorder = mimeType
        ? new MediaRecorder(mediaStream, { mimeType: mimeType })
        : new MediaRecorder(mediaStream);
    } catch (e) {
      releaseStream();
      errSlot.textContent = 'Could not start recording';
      return;
    }
    chunks = [];
    mediaRecorder.addEventListener('dataavailable', function(e){
      if (e.data && e.data.size > 0) chunks.push(e.data);
    });
    mediaRecorder.addEventListener('stop', onStop);
    mediaRecorder.start();
    recording = true;
    startedAt = Date.now();
    recordBtn.classList.add('text-red-600');
    showRecording();
    tickTimer = setInterval(tick, 250);
    capTimer = setTimeout(function(){ stop(false); }, MAX_SECONDS * 1000);
  }

  // `cancelled` distinguishes the Cancel button (discard) from Stop (upload).
  var cancelled = false;
  function stop(isCancel){
    if (!recording || !mediaRecorder) return;
    cancelled = isCancel;
    resetUi();
    try { mediaRecorder.stop(); } catch (e) {}
  }

  async function onStop(){
    releaseStream();
    var type = (mediaRecorder && mediaRecorder.mimeType) || 'audio/webm';
    var blob = new Blob(chunks, { type: type });
    chunks = [];
    if (cancelled) {
      staged.textContent = '';
      return;
    }
    if (blob.size === 0) {
      errSlot.textContent = 'Recording was empty';
      staged.textContent = '';
      return;
    }
    staged.innerHTML = 'Uploading voice message...';
    var wf = await computeWaveform(blob);
    var fd = new FormData();
    // Order matters: the server reads kind + waveform before the file field.
    // The waveform field is a JSON object: { d: duration_seconds, p: [peaks] }.
    fd.append('kind', 'voice');
    fd.append('waveform', JSON.stringify({ d: wf.duration, p: wf.peaks }));
    var ext = type.indexOf('ogg') !== -1 ? 'ogg' : (type.indexOf('mp4') !== -1 ? 'm4a' : 'webm');
    fd.append('file', blob, 'voice-message.' + ext);
    try {
      var res = await fetch('/api/upload', { method: 'POST', body: fd, credentials: 'same-origin' });
      if (!res.ok) {
        errSlot.textContent = (await res.text()) || ('upload failed: ' + res.status);
        staged.textContent = '';
        return;
      }
      var data = await res.json();
      hidden.value = data.file_id;
      staged.innerHTML =
        '<span class="inline-flex items-center gap-2">' +
          '<span>Voice message attached</span>' +
          '<button type="button" onclick="window.__lcClearAttach && window.__lcClearAttach()" class="ml-1 text-red-500">x</button>' +
        '</span>';
      if (sendBtn) sendBtn.disabled = false;
    } catch (e) {
      errSlot.textContent = 'upload failed';
      staged.textContent = '';
    }
  }

  recordBtn.addEventListener('click', function(){
    if (recording) stop(false);
    else start();
  });

  // Teardown: if #composer is swapped out mid-recording, stop the recorder
  // and release the mic so the tab's recording indicator clears. Setting
  // `cancelled` makes the async `onStop` bail instead of uploading into the
  // now-detached DOM. Cleanup-root is #composer (form).
  function teardown(){
    cancelled = true;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      try { mediaRecorder.stop(); } catch (e) {}
    }
    resetUi();
    releaseStream();
  }
  var root = document.currentScript.closest('[data-lc-cleanup-root]')
          || document.currentScript.parentElement;
  root.addEventListener('htmx:beforeCleanupElement', teardown, { once: true });
})();
</script>
