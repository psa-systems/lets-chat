{% extends "layout.html" %}

{% block title %}#{{ room.name }} - lets-chat{% endblock %}

{% block main %}
<header class="border-b border-slate-200 px-4 py-2">
  <h1 class="font-semibold">#{{ room.name }}</h1>
  {% if let Some(topic) = room.topic.as_ref() %}
  <p class="text-sm text-slate-500">{{ topic }}</p>
  {% endif %}
</header>
{% include "room/messages.html" %}
<div id="typing" class="px-4 text-xs text-slate-500"></div>
{% include "room/composer.html" %}
<script>
(function() {
  var roomId = {{ room.id }};
  function sendSubscribe() {
    var wsEl = document.querySelector('[ws-connect]');
    var sock = wsEl && wsEl._htmxWebSocket;
    if (sock && sock.readyState === 1) {
      sock.send(JSON.stringify({type: 'subscribe', room_id: roomId}));
    } else {
      setTimeout(sendSubscribe, 200);
    }
  }
  document.body.addEventListener('htmx:wsOpen', function(evt) {
    sendSubscribe();
  });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sendSubscribe);
  } else {
    sendSubscribe();
  }
})();
</script>
{% endblock %}
