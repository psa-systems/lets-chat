<div id="messages"
     role="log"
     aria-live="polite"
     aria-relevant="additions"
     aria-label="{{ "a11y-messages-region-label"|t }}"
     {# LC-244: localized "Today" label the client uses when inserting a day
        divider above a live-arriving message (live sends are always today UTC). #}
     data-lc-day-today="{{ "room-day-today"|t }}"
     {# LC-569: the timeline supplies the 20px side gutter so message rows can be
        inset rounded cards (they carry their own 12px padding + 10px radius). #}
     class="flex-1 overflow-y-auto px-5">
  {% let oob = false %}
  {% for message in messages %}
  {% include "room/message.html" %}
  {% endfor %}
</div>
<script>
// LC-376: message overflow-menu behavior. The per-message `...` menu (LC-376) is
// a native <details class="lc-msg-more">, so it needs no per-row JS; this single
// delegated handler (wired once) adds the niceties: opening one menu closes the
// others, clicking a menu item or outside closes it, and Escape closes any open
// one. Lives here (rendered once around the message loop) rather than per row.
(function(){
  if (window.__lcMsgMenuWired) return;
  window.__lcMsgMenuWired = true;
  function openMenus(){ return document.querySelectorAll('details.lc-msg-more[open]'); }
  // Opening one menu closes the others. `toggle` does not bubble, so capture.
  document.addEventListener('toggle', function(e){
    var d = e.target;
    if (!d.matches || !d.matches('details.lc-msg-more') || !d.open) return;
    openMenus().forEach(function(o){ if (o !== d) o.removeAttribute('open'); });
  }, true);
  document.addEventListener('click', function(e){
    var menus = openMenus();
    if (!menus.length) return;
    var inSummary = e.target.closest && e.target.closest('details.lc-msg-more > summary');
    // Copy actions flip their label to "Copied" in place; keep their menu open so
    // that feedback is visible (it closes on the next outside click).
    var inCopy = e.target.closest && e.target.closest('[data-lc-copy-link], [data-lc-copy-text]');
    menus.forEach(function(d){
      // Leave the menu whose own summary was just clicked (native toggle owns it).
      if (inSummary && inSummary.parentElement === d) return;
      if (inCopy && d.contains(inCopy)) return;
      // A click on one of this menu's items: let the action fire, then close it.
      // A click anywhere else outside: close it.
      d.removeAttribute('open');
    });
  });
  // LC-598: visible (not capability-hidden) items, in DOM order. offsetParent is
  // null for a display:none row, which is how the tools-group collapse and the
  // per-item .lc-llm-only / .lc-embeddings-only / .lc-read-aloud gates drop out
  // of the keyboard order for free.
  function items(d){
    return Array.prototype.filter.call(
      d.querySelectorAll('.lc-menu-item'),
      function(el){ return el.offsetParent !== null; }
    );
  }
  function focusItem(list, i){
    if (!list.length) return;
    var n = (i + list.length) % list.length;
    list[n].focus();
  }
  // LC-598: the menu is absolutely positioned inside #messages, which is
  // overflow-y:auto - so the scroll container clips it, and it can only ever use
  // the container's height (~557px at 1400x900) rather than the viewport's. A
  // grouped menu is ~480px tall, so anchoring inside the container would force an
  // internal scroll on almost every open, which is the opposite of "scroll as a
  // last resort". Promote it to position:fixed on open and place it against the
  // viewport instead - the same escape the reaction picker uses (reactions.js).
  // Purely progressive: the CSS fallback keeps the absolute/downward placement if
  // this never runs.
  function place(d){
    var menu = d.querySelector('.lc-msg-menu');
    if (!menu) return;
    var M = 8;
    menu.classList.remove('lc-menu-up');
    menu.style.removeProperty('--lc-menu-max');
    // Reset to the static box before measuring, so a re-open does not measure
    // against its own previous placement.
    menu.style.position = '';
    menu.style.top = menu.style.left = menu.style.right = menu.style.margin = '';
    menu.style.bottom = '';
    var tr = d.getBoundingClientRect();
    var needed = menu.scrollHeight;
    var width = menu.offsetWidth;
    var below = window.innerHeight - tr.bottom - M;
    var above = tr.top - M;
    var up = needed > below && above > below;
    var avail = Math.max(120, up ? above : below);
    menu.style.position = 'fixed';
    menu.style.margin = '0';
    menu.style.right = 'auto';
    // The .lc-menu-up CSS fallback anchors with bottom:100%; under the fixed
    // placement below the inline `top` is authoritative, so clear it.
    menu.style.bottom = 'auto';
    // Right-align to the trigger, then clamp into the viewport so a menu on a
    // row near the right edge cannot run off-screen.
    var left = Math.min(Math.max(M, tr.right - width), window.innerWidth - width - M);
    menu.style.left = left + 'px';
    menu.style.top = (up ? Math.max(M, tr.top - Math.min(needed, avail) - 4) : tr.bottom + 4) + 'px';
    if (up) menu.classList.add('lc-menu-up');
    menu.style.setProperty('--lc-menu-max', avail + 'px');
  }
  // A fixed menu no longer travels with the timeline, so close it if the page
  // scrolls or resizes under it rather than leaving it stranded mid-air.
  ['scroll', 'resize'].forEach(function(evt){
    document.addEventListener(evt, function(){
      openMenus().forEach(function(d){ d.removeAttribute('open'); });
    }, true);
  });
  document.addEventListener('toggle', function(e){
    var d = e.target;
    if (!d.matches || !d.matches('details.lc-msg-more')) return;
    if (!d.open) return;
    place(d);
    var list = items(d);
    // Do not steal focus from a pointer user; only the keyboard path (Enter or
    // Space on the summary, which leaves it focused) lands on the first item.
    if (document.activeElement === d.querySelector('summary')) focusItem(list, 0);
  }, true);
  document.addEventListener('keydown', function(e){
    var menus = openMenus();
    if (!menus.length) return;
    if (e.key === 'Escape') {
      menus.forEach(function(d){
        d.removeAttribute('open');
        // Return focus to the trigger so Escape does not drop the caret to the
        // top of the document (the account menu in sidebar_self.html does this).
        var s = d.querySelector('summary');
        if (s && d.contains(document.activeElement)) s.focus();
      });
      return;
    }
    var d = e.target.closest && e.target.closest('details.lc-msg-more[open]');
    if (!d) return;
    var list = items(d);
    var i = list.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); focusItem(list, i + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); focusItem(list, i < 0 ? -1 : i - 1); }
    else if (e.key === 'Home') { e.preventDefault(); focusItem(list, 0); }
    else if (e.key === 'End') { e.preventDefault(); focusItem(list, list.length - 1); }
    else if (e.key === 'Tab') {
      // Trap: a menu is a modal-ish surface, and its items carry tabindex="-1"
      // so an untrapped Tab would jump past the whole timeline.
      e.preventDefault();
      focusItem(list, e.shiftKey ? (i < 0 ? -1 : i - 1) : i + 1);
    }
  });
})();
</script>
