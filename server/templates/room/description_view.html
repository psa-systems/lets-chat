{% if html.is_empty() %}
<p class="text-sm text-content-muted italic">{{ "room-description-empty"|t }}</p>
{% else %}
<div class="prose prose-slate max-w-none text-sm">{{ html|safe }}</div>
{% endif %}
{% if can_edit_description %}
<button type="button"
        hx-get="/room/{{ room_id }}/description/edit"
        hx-target="#description-content"
        hx-swap="innerHTML"
        class="text-xs bg-surface-sunken hover:bg-surface-sunken rounded px-3 py-1 mt-2">{% if html.is_empty() %}{{ "room-description-set"|t }}{% else %}{{ "room-description-edit"|t }}{% endif %}</button>
{% endif %}
