{% if html.is_empty() %}
<p class="text-sm text-content-muted italic">{{ "room-description-empty"|t }}</p>
{% else %}
<div class="lc-md text-sm">{{ html|safe }}</div>
{% endif %}
{% if can_edit_description %}
<button type="button"
        hx-get="/room/{{ room_id }}/description/edit"
        hx-target="#description-content"
        hx-swap="innerHTML"
        class="btn btn-secondary btn-sm mt-2">{% if html.is_empty() %}{{ "room-description-set"|t }}{% else %}{{ "room-description-edit"|t }}{% endif %}</button>
{% endif %}
