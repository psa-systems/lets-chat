{% if html.is_empty() %}
<p class="text-sm text-slate-500 italic">No description set.</p>
{% else %}
<div class="prose prose-slate max-w-none text-sm">{{ html|safe }}</div>
{% endif %}
{% if can_edit_description %}
<button type="button"
        hx-get="/room/{{ room_id }}/description/edit"
        hx-target="#description-content"
        hx-swap="innerHTML"
        class="text-xs bg-slate-200 hover:bg-slate-300 rounded px-3 py-1 mt-2">{% if html.is_empty() %}Set description{% else %}Edit description{% endif %}</button>
{% endif %}
