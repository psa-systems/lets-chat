<form
  id="msg-{{ message_id }}"
  hx-patch="/messages/{{ message_id }}"
  hx-target="#msg-{{ message_id }}"
  hx-swap="outerHTML"
  class="px-4 py-2 bg-warning-surface"
>
  {# LC-248: autofocus so the global after-swap focus handler (layout.html)
     lands the caret in the editor for both the hover "Edit" and the
     Arrow-Up-edits-last shortcut. Escape triggers the Cancel control below
     (restores the message via its hx-get).
     LC-359: a <textarea>, not a single-line <input>, so a multiline message
     (code blocks, lists, paragraphs) is fully visible and editable instead of
     being clipped to its first line. Ctrl/Cmd+Enter saves, so a plain Enter can
     insert a newline. #}
  <textarea name="body" autofocus rows="3" aria-label="{{ "room-edit-message-label"|t }}"
    onkeydown="if (event.key === 'Escape') { event.preventDefault(); var c = this.form.querySelector('button[hx-get]'); if (c) c.click(); } else if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) { event.preventDefault(); this.form.requestSubmit(); }"
    class="input">{{ current_body }}</textarea>
  <div class="text-xs mt-1 flex gap-2">
    <button class="btn btn-sm btn-primary">{{ "room-save"|t }}</button>
    <button type="button" hx-get="/messages/{{ message_id }}" hx-target="#msg-{{ message_id }}" hx-swap="outerHTML" class="btn btn-sm btn-ghost">{{ "room-cancel"|t }}</button>
  </div>
</form>
