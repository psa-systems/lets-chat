{% for item in items %}
<li class="px-4 py-3 hover:bg-surface">
  <a href="{{ item.target_path }}" class="block">
    <div class="flex items-center justify-between gap-2 text-xs text-content-muted">
      <span class="font-semibold text-content-muted">{{ item.room_label }}</span>
      <span>{{ item.created_at }}</span>
    </div>
    <div class="text-sm mt-1">
      <span class="text-content-muted font-medium">{{ item.author_label }}:</span>
      <span class="text-content-muted">{{ item.snippet }}</span>
    </div>
  </a>
</li>
{% endfor %}
{% if let Some(cursor) = next_cursor %}
<li class="px-4 py-3 text-center text-xs text-content-subtle"
    hx-get="/inbox?before={{ cursor }}&fragment=1"
    hx-trigger="revealed"
    hx-swap="outerHTML">
  {{ "inbox-loading-more"|t }}
</li>
{% endif %}
