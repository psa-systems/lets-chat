<div id="messages" hx-swap-oob="beforeend">
  
  



<div id="msg-1" data-lc-day="2026-01-01" data-lc-quick-react="1" data-lc-density-tight="row" class="lc-anim-swap relative px-4 py-2 hover:bg-surface-sunken group">
  
  <div class="flex items-center gap-2">
    
    
    
    <img src="https://example.com/avatar.png" alt="" loading="lazy" class="h-6 w-6 rounded-full object-cover" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'h-6 w-6 text-xs rounded-full bg-surface-sunken text-content-muted flex items-center justify-center font-semibold',textContent:(this.dataset.fallback||'?')}))" data-fallback="T">
    
    <span class="font-medium">Test Inbox</span>
    <span class="text-[10px] font-bold uppercase tracking-wide bg-email-surface text-email-content rounded px-1 py-0.5" title="Posted via email ingress">email</span>
    
    <time data-lc-ts datetime="2026-01-01T00:00:00Z" title="2026-01-01T00:00:00Z" class="text-xs text-content-muted">2026-01-01T00:00:00Z</time>
    
  </div>
  
  <span class="absolute right-2 top-1 opacity-0 group-hover:opacity-100 flex items-center gap-2 text-xs bg-surface-sunken px-1 rounded">
    
    <span data-lc-quick-bar role="group" aria-label="Quick reactions" class="hidden items-center gap-1 border-r border-border pr-2"></span>
    
    <button hx-get="/room/1/composer-quote/1" hx-target="#composer-quote-bar" hx-swap="innerHTML" class="text-content-muted hover:underline">Reply</button>
    
    <button hx-get="/room/1/thread/1" hx-target="#thread-panel" hx-swap="outerHTML" class="text-content-muted hover:underline">Thread</button>
    
    <button type="button"
      data-lc-copy-link="1"
      data-lc-copied-label="Copied"
      class="text-content-muted hover:underline"
      onclick="
        var b = this;
        var url = location.origin + '/m/' + b.getAttribute('data-lc-copy-link');
        var done = function(){
          var orig = b.textContent;
          b.textContent = b.getAttribute('data-lc-copied-label');
          setTimeout(function(){ b.textContent = orig; }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done, function(){
            window.__lcCopyFallback && window.__lcCopyFallback(url); done();
          });
        } else if (window.__lcCopyFallback) {
          window.__lcCopyFallback(url); done();
        }
      ">Copy link</button>
    
    
    <button type="button"
      data-lc-copy-text="1"
      data-lc-copied-label="Copied"
      class="text-content-muted hover:underline"
      onclick="
        var b = this;
        fetch('/messages/' + b.getAttribute('data-lc-copy-text') + '/raw', { credentials: 'same-origin' })
          .then(function(r){ return r.ok ? r.text() : null; })
          .then(function(t){
            if (t === null) return;
            var done = function(){
              var orig = b.textContent;
              b.textContent = b.getAttribute('data-lc-copied-label');
              setTimeout(function(){ b.textContent = orig; }, 1500);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(t).then(done, function(){
                window.__lcCopyFallback && window.__lcCopyFallback(t); done();
              });
            } else if (window.__lcCopyFallback) {
              window.__lcCopyFallback(t); done();
            }
          });
      ">Copy text</button>
    
    
    <button hx-post="/messages/1/pin" hx-target="#msg-1" hx-swap="outerHTML" class="text-warning hover:underline">Pin</button>
    
    
    <button hx-post="/messages/1/bookmark" hx-target="#msg-1" hx-swap="outerHTML" class="text-success-surface-content hover:underline">Save</button>
    
    <button hx-get="/reminders/picker?message_id=1" hx-target="#lc-reminder-modal" hx-swap="innerHTML" class="text-indigo-600 hover:underline">Remind</button>
    
    <button hx-post="/messages/1/unread" hx-target="#sidebar" hx-swap="outerHTML" class="text-content-muted hover:underline">Mark unread</button>
    
    <button hx-get="/messages/1/forward" hx-target="#lc-forward-modal" hx-swap="innerHTML" class="text-content-muted hover:underline">Forward</button>
    
    
    
    
    
    
  </span>
  
  
    
    
    
    <div data-lc-collapse class="lc-md leading-snug"><p>hello from an email inbox</p>
</div>
    <button type="button" data-lc-collapse-toggle hidden
      data-lc-more="Show more" data-lc-less="Show less"
      class="mt-1 text-xs text-accent hover:underline">Show more</button>
    
    
    
    
  
  
  <div id="reactions-1" class="mt-1">
    
    
    <div id="reactions-1" class="flex flex-wrap gap-1 items-center">
  
  <button
    hx-get="/messages/1/reactions/picker"
    hx-target="this"
    hx-swap="outerHTML"
    aria-label="Add reaction"
    aria-haspopup="dialog"
    class="text-xs text-content-muted hover:text-content"
  >+</button>
</div>
  </div>
  
  
  
  
  <div id="reply-count-1">
  
</div>
  
</div>

</div>
