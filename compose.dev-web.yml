---
# `just dev-web` - build the production multi-stage image and attach it to
# the shared Traefik network so it serves at https://${USER}-chat.a8n.run.
#
# `restart: unless-stopped` keeps the container alive across panics so
# `docker compose logs app` always has output; the prior `dev/server-up`
# pattern of `docker run --rm --detach` swept the container away on
# startup failure and left "container started" printed to the terminal
# with no way to see the real error.
name: dev-web-${USER}

services:

  app:
    build:
      context: .
      dockerfile: ci-build/Dockerfile.web
      args:
        BUILD_MODE: standalone
        # The Dockerfile defaults this to 2 (a CI runner-sharing cap). Local
        # dev builds one image at a time, so lift it well above that to use
        # the host's cores on the slow release compile. Override per-invocation
        # with `CARGO_BUILD_JOBS=N just dev-web`.
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-16}
        GIT_HASH: ${GIT_HASH:-unknown}
        GIT_VERSION: ${GIT_VERSION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: dev-lets-chat-web-${USER}
    restart: unless-stopped
    environment:
      RUST_LOG: lets_chat=debug
      LETS_CHAT_DATA_DIR: /data
      LETS_CHAT_SECRET_KEY: sghsgG8vVnvr9gddWwrL03
      BIND_ADDR: 0.0.0.0:8080
      # Bunyip SSO is the sole sign-in path post-LC-22; the server refuses
      # to start unless all four vars are set (server/src/oidc/config.rs).
      # The dev OP client (id ...000c, confidential, client_secret_basic) is
      # provisioned in dev-bunyip-postgres-long with the redirect below; the
      # plaintext secret here is the match for that row's argon2id hash.
      LETS_CHAT_BUNYIP_SSO_ISSUER: "https://${USER}-bunyip-api.a8n.run"
      LETS_CHAT_BUNYIP_SSO_CLIENT_ID: b0000000-0000-4000-8000-00000000000c
      LETS_CHAT_BUNYIP_SSO_CLIENT_SECRET: 4f343ca29b71fce56e6bac26a19f850facb3aa344bf431f965c932abac07f3b4
      LETS_CHAT_BUNYIP_SSO_REDIRECT_URI: "https://${USER}-chat.a8n.run/auth/bunyip/callback"
      # DEV ONLY. The dev bunyip OP sits behind a Traefik serving a self-signed
      # default cert for *.a8n.run; reqwest's rustls bundled roots reject it and
      # there is no env/mount-only remedy, so server-to-server SSO discovery
      # fails TLS without this. NEVER set in production.
      LETS_CHAT_BUNYIP_SSO_INSECURE_TLS: "1"
      # LC-488/LC-505: optional GIF picker (Giphy). Pass the key through from your
      # shell so it stays OUT of git: `export LETS_CHAT_GIPHY_API_KEY=... ` then
      # `just dev-web`. Empty/unset keeps the composer GIF button hidden. Rating
      # is optional (g/pg/pg-13/r; the server defaults to pg-13 when unset).
      LETS_CHAT_GIPHY_API_KEY: "${LETS_CHAT_GIPHY_API_KEY:-}"
      LETS_CHAT_GIPHY_RATING: "${LETS_CHAT_GIPHY_RATING:-}"
      # Optional: enable password reset emails. Uncomment and fill in all
      # six LETS_CHAT_SMTP_* variables plus LETS_CHAT_BASE_URL with values
      # appropriate to your relay. Leaving any of them blank disables outbound
      # mail and the /forgot + /reset routes return 404. See .env.standalone
      # for variable documentation.
      # LETS_CHAT_BASE_URL: "https://${USER}-chat.a8n.run"
      # LETS_CHAT_SMTP_HOST: ""
      # LETS_CHAT_SMTP_PORT: ""
      # LETS_CHAT_SMTP_TLS: ""
      # LETS_CHAT_SMTP_USERNAME: ""
      # LETS_CHAT_SMTP_PASSWORD: ""
      # LETS_CHAT_SMTP_FROM: ""
    volumes:
      - lets-chat-data:/data
    # DEV ONLY. lets-chat does its SSO calls (discovery/JWKS/token) server-to-
    # server against the public issuer host. In this dev setup that hostname
    # resolves to the host's PUBLIC IP, where the dev routers are NOT served
    # (they live on Traefik's nebula-secure :443 entrypoint), so the fetch
    # 404s. Pin the issuer host to the dev Traefik container on
    # network-traefik-public so the request hits the right Traefik; the issuer
    # string stays the public URL, so ID-token `iss` validation is unaffected.
    # The browser flow is untouched (the user reaches Traefik over Nebula).
    # The target IP is NOT hardcoded: `just dev-web` runs ./dev/traefik-ip to
    # find Traefik's CURRENT address on network-traefik-public and passes it as
    # TRAEFIK_PUBLIC_IP, so this never goes stale when that network is recreated
    # (the old hardcoded pin silently broke SSO startup; chore/dev-web-traefik-
    # ip). The `:-` default keeps a bare `docker compose up` working outside the
    # recipe. Sequence form so Compose interpolates ${USER} + ${TRAEFIK_PUBLIC_IP}
    # in the value (it does not substitute variables inside YAML mapping keys).
    extra_hosts:
      - "${USER}-bunyip-api.a8n.run:${TRAEFIK_PUBLIC_IP:-10.200.0.3}"
    networks:
      - default
      - network-traefik-public
    # Sequence form (not mapping) so Compose interpolates ${USER} in the
    # router/service name segments. Compose v2 does NOT substitute variables
    # inside YAML mapping keys, only in values; sequence items are values
    # end-to-end, so the whole "key=value" string gets interpolated.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=network-traefik-public"
      - "traefik.http.routers.chat-${USER}.rule=Host(`${USER}-chat.a8n.run`)"
      - "traefik.http.routers.chat-${USER}.service=chat-${USER}@docker"
      # Both entrypoints, matching the other dev apps (bunyip et al). The dev
      # hosts are reached over the Nebula overlay, where Traefik's nebula-secure
      # entrypoint listens on :443 (the default); web-secure alone (:20443) left
      # `${USER}-chat.a8n.run` returning a 404 in the browser.
      - "traefik.http.routers.chat-${USER}.entrypoints=web-secure,nebula-secure"
      - "traefik.http.routers.chat-${USER}.tls.certresolver=cert-cloudflare"
      - "traefik.http.services.chat-${USER}.loadbalancer.server.port=8080"

volumes:
  lets-chat-data:

networks:
  network-traefik-public:
    external: true
