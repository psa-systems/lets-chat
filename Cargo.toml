[package]
name = "lets-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7.3", features = ["fullstack", "router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[features]
default = []
server = [
    "dioxus/server",
    "dep:sqlx",
    "dep:axum",
    "dep:axum-extra",
    "dep:http",
    "dep:argon2",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:dashmap",
    "dep:time",
]
client = ["dioxus/desktop"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }
web-sys = { version = "0.3", features = ["WebSocket", "BinaryType", "MessageEvent", "Location", "Window", "Document", "HtmlDocument", "Storage", "HtmlElement", "Element", "EventTarget"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
futures = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
rand = "0.8"
futures = "0.3"

[dependencies.sqlx]
version = "0.8"
features = ["runtime-tokio", "sqlite", "migrate"]
optional = true

[dependencies.axum]
version = "0.8"
features = ["ws"]
optional = true

[dependencies.axum-extra]
version = "0.10"
features = ["cookie"]
optional = true

[dependencies.http]
version = "1"
optional = true

[dependencies.argon2]
version = "0.5"
optional = true

[dependencies.tracing]
version = "0.1"
optional = true

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]
optional = true

[dependencies.dashmap]
version = "6"
optional = true

[dependencies.time]
version = "0.3"
optional = true
