[workspace]
members = [
    "server",
    "desktop",
    "ip-policy",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.11.0"

[workspace.dependencies]
serde_json = "1"
chrono-tz = "0.10"
futures = "0.3"
tracing = "0.1"

[workspace.dependencies.dioxus]
version = "0.7.7"
features = [
    "fullstack",
    "router",
]

[workspace.dependencies.serde]
version = "1"
features = ["derive"]

[workspace.dependencies.chrono]
version = "0.4"
features = ["serde"]

[workspace.dependencies.uuid]
version = "1"
features = [
    "v4",
    "serde",
]

[workspace.dependencies.tokio]
version = "1"
features = ["full"]

[profile.dev]
debug = "line-tables-only"

# LC-1126: password hashing is deliberately slow; unoptimized, as in every dev
# and test build, one argon2 hash costs about twenty times what it does
# optimized, and every test that creates a user or signs in pays it. Release
# builds are already optimized, so this changes nothing in production.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# LC-763: the symbol table is 24.8% of the desktop binary the self-updater pulls
# (19,771,520 -> 14,864,472 bytes). Cost: release backtraces lose function names.
[profile.release]
strip = true
