---

# LC-816: unit tests for the transcription agent (services/transcription-agent).
#
# The agent is a Node/TypeScript LiveKit Agents worker run on bun. The
# repo's ./dev/bun wrapper bind-mounts (which does not work on this runner - the
# docker daemon is on the host, the runner in a container). So, like the desktop
# build, the work happens inside docker: `docker buildx build --target test`
# runs `bun test` in the agent's Dockerfile test stage and fails the build (and
# thus this job) on any test failure. LC-841 adds the `typecheck` stage beside
# it: the tests never import the LiveKit SDK, so agent.ts could (and did) ship
# with type errors against it.
#
# LC-1128: the pull_request trigger carries no `paths` filter (STD-3.1
# forbids one: Forgejo drops the whole workflow when it does not match and a
# required check never reports). Instead, the `classify-diff` job gates
# `agent-test` on `common`'s shared classifier (STD-3.1/STD-3.2, PC-134), so a
# docs-only or comments-only PR still reports this check, as `skipped`,
# instead of leaving it pending. The `push` trigger keeps its `paths` filter;
# STD-3.1 only concerns the `pull_request` trigger.
name: Agent check

on:
  push:
    branches:
      - main
    paths:
      - "services/transcription-agent/**"
      - ".forgejo/workflows/agent-check.yml"
  pull_request:
    branches:
      - main

jobs:
  classify-diff:
    name: classify diff
    # MEDIUM: classify-diff runs `nu` against the diff, no compile.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    outputs:
      result: ${{ steps.classify-diff.outputs.result }}
    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5

      - name: Classify diff
        id: classify-diff
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/classify-diff@3112139d5fa154e2c1c9c7e63d1c355cc85b3613 # main

  agent-test:
    name: transcription agent (bun test)
    needs: classify-diff
    if: needs.classify-diff.outputs.result == 'code'
    # HEAVY: runs `docker buildx build` (bun test + typecheck stages).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_HEAVY }}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5

      - name: Start job metrics sampler
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-start@main

      - name: Build parallelism from the runner
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/build-parallelism@main

      - name: Bun unit tests (in the agent's Dockerfile test stage)
        run: docker buildx build --target test -f services/transcription-agent/Dockerfile services/transcription-agent

      - name: Typecheck against the pinned LiveKit SDK (Dockerfile typecheck stage)
        run: docker buildx build --target typecheck -f services/transcription-agent/Dockerfile services/transcription-agent

      - name: Report job metrics
        if: always()
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-report@main
