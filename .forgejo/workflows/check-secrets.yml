---
# GitHub Actions documentation: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

# This workflow uses several checks to check for secrets.
name: check-secrets
run-name: Check Secrets (dynamically)

on:
  # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#pull_request
  pull_request:
    branches:
      - "**"
    types: [ opened, ready_for_review, reopened, synchronize ]

  # Testing purpose
  push:
    branches:
      - '**'
      # Note: use !main to run on all branches except main.
      - 'main'


jobs:

  kingfisher:
    # https://github.com/mongodb/kingfisher
    name: Kingfisher
    # Note: Only ds-01 can run Kingfisher.
    # Base image: scanners read the tree, nothing compiles (LC-647).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    steps:

      - name: Rename .gitconfig
        # The .gitconfig prevents the checkout from working.
        #   Copying '/home/dev/.gitconfig' to '/tmp/3614ba4b-0688-4dc2-86cb-ff245bc29254/.gitconfig'
        #   Temporarily overriding HOME='/tmp/3614ba4b-0688-4dc2-86cb-ff245bc29254' before making global git config changes
        shell: nu {0}
        run: |
          let gitconfig = ([$env.HOME .gitconfig] | path join)
          if ($gitconfig | path expand | path exists) {
            mv $gitconfig ([$gitconfig 'disabled'] | str join '-')
          }

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v5

      - name: Run Kingfisher
        shell: nu {0}
        # https://github.com/mongodb/kingfisher/wiki/Usage
        run: |
          let args = [
            --no-update-check
            # Is full history needed when actions/checkout does a shallow clone?
            --git-history full
            --format pretty
            # LC-521: Docker-inherited excludes (.sops.yaml, *-secrets.yml,
            # archived/) removed; none of those paths exist in this repo.
            # Brand favicons wrap a base64-encoded PNG; a substring of that
            # blob trips KINGFISHER.CRATESIO.1 as a false positive (LC-471).
            --exclude "server/assets/favicon.svg"
            --exclude "server/assets/favicon-dot.svg"
            --jobs 1 .
          ]
          ^kingfisher scan ...$args .

  trufflehog:
    # https://github.com/trufflesecurity/trufflehog
    # https://docs.trufflesecurity.com/configuration-file-reference
    name: TruffleHog
    # Spread the load across several servers
    # Trufflehog takes a while to scan the repo.
    #   - ds-05: 2m43s
    #   - ds-06: 1m58s
    #   - ds-04: 1m40s
    # Base image: scanners read the tree, nothing compiles (LC-647).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    steps:

      - name: Rename .gitconfig
        # The .gitconfig prevents the checkout from working.
        #   Copying '/home/dev/.gitconfig' to '/tmp/3614ba4b-0688-4dc2-86cb-ff245bc29254/.gitconfig'
        #   Temporarily overriding HOME='/tmp/3614ba4b-0688-4dc2-86cb-ff245bc29254' before making global git config changes
        shell: nu {0}
        run: |
          let gitconfig = ([$env.HOME .gitconfig] | path join)
          if ($gitconfig | path expand | path exists) {
            mv $gitconfig ([$gitconfig 'disabled'] | str join '-')
          }

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v5

      - name: Run TruffleHog
        run: |
          trufflehog filesystem --no-update --fail --only-verified .

  noseyparker:
    # https://github.com/praetorian-inc/noseyparker
    name: Nosey parker
    # Spread the load across several servers
    # Base image: scanners read the tree, nothing compiles (LC-647).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    steps:

      - name: Rename .gitconfig
        # The .gitconfig prevents the checkout from working.
        #   Copying '/home/dev/.gitconfig' to '/tmp/3614ba4b-0688-4dc2-86cb-ff245bc29254/.gitconfig'
        #   Temporarily overriding HOME='/tmp/3614ba4b-0688-4dc2-86cb-ff245bc29254' before making global git config changes
        shell: nu {0}
        run: |
          let gitconfig = ([$env.HOME .gitconfig] | path join)
          if ($gitconfig | path expand | path exists) {
            mv $gitconfig ([$gitconfig 'disabled'] | str join '-')
          }

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v5

      - name: Run Nosey Parker
        shell: nu {0}
        run: |
          noseyparker scan -i .noseyparker-ignore.txt .
          noseyparker report
