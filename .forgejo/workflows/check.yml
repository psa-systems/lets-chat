---

# Validate code on every push and pull request: fmt, clippy, build, tests.
# Mirrors the local `just check` + `just test` recipes for the SERVER (which use
# ./dev/cargo). The server + saas targets compile natively on the runner, so this
# job runs on the opensuse-dev runner (RUNS_ON_OPENSUSE_DEV_LATEST), the image
# that carries a C toolchain; the opensuse-base image has no `cc` and every
# cargo build there dies with `linker cc not found` (LC-642).
#
# The desktop crate is intentionally NOT checked here. The ./dev/cargo-desktop
# wrapper cannot run on this runner: the runner executes inside a container while
# the docker daemon runs on the host, so the wrapper's `-v $PWD:/work` bind mount
# resolves against the host filesystem and lands on an empty directory. The
# desktop crate is validated by build-desktop-linux.yml (docker buildx, which
# ships a build context instead of bind-mounting) on push to main / release.
name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: clippy + fmt + tests
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_DEV_LATEST }}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          # Full history so the migration-immutability guard can compute the
          # merge-base with origin/main (LC-515).
          fetch-depth: 0

      - name: Migration immutability guard
        # Committed migrations are immutable: sqlx verifies each migration's
        # checksum on startup, so editing, renaming, or deleting one already on
        # main breaks every deployed database. Reject such changes at PR time.
        # See ci-build/check-migration-immutability.nu and LC-515 / DEV-395.
        run: nu ci-build/check-migration-immutability.nu

      - name: Runner label guard
        # Keep the base/dev split honest: a job that compiles must request the
        # dev label, and no job may install a toolchain at run time (LC-647).
        run: nu ci-build/check-runner-labels.nu

      - name: Asset color-token guard
        # The browser assets inject markup in states nobody eyeballs (offline
        # banner, failed send, active search row), so a raw palette shade there
        # goes unnoticed until it renders unreadable in dark mode. Same for the
        # [aria-selected="true"] highlight in main.css, only visible while a
        # keyboard user is arrowing through a listbox. See
        # ci-build/check-asset-color-tokens.nu, LC-735 and LC-736.
        run: nu ci-build/check-asset-color-tokens.nu

      - name: File-picker shape guard
        # A raw <input type="file"> opts out of the filename echo, the
        # client-side type/size rejection and the inline error slot that
        # partials/file_picker.html provides. See
        # ci-build/check-file-pickers.nu and LC-740.
        run: nu ci-build/check-file-pickers.nu

      - name: Table scroll-wrapper guard
        # A wrapper that clips instead of scrolling makes the trailing columns
        # unreachable on a 375px viewport: no scrollbar, no drag, and the
        # actions cell is the one that overflows. See
        # ci-build/check-table-scroll.nu and LC-737.
        run: nu ci-build/check-table-scroll.nu

      - name: Table shape guard
        # A hand-rolled table re-derives the row height, header color and row
        # rules that .lc-table already owns, so the same list rendered at two
        # different heights depending on the surface. See
        # ci-build/check-table-shape.nu and LC-745.
        run: nu ci-build/check-table-shape.nu

      - name: Locale ellipsis guard
        # One ellipsis spelling in the catalogs: three periods, never U+2026.
        # The mixed spelling put "Search..." beside "Search…" in the same
        # sidebar. See ci-build/check-locale-ellipsis.nu and LC-750.
        run: nu ci-build/check-locale-ellipsis.nu

      - name: Boolean-setting control guard
        # One control for "turn this on": the shared role="switch" partial, or a
        # .lc-toggle checkbox that carries role="switch" itself. A copy of the
        # switch markup drifts away from the shared feedback contract, and a
        # bare checkbox announces differently from the identical-looking switch
        # one page over. See ci-build/check-boolean-settings.nu and LC-747.
        run: nu ci-build/check-boolean-settings.nu

      - name: Single tab controller guard
        # Three copies of the tablist controller had already drifted: one reset
        # the visible panel on any hashchange, so an in-page anchor jumped the
        # user to a different tab. See
        # ci-build/check-single-tab-controller.nu and LC-747.
        run: nu ci-build/check-single-tab-controller.nu

      - name: Revoke confirmation guard
        # Revoking a credential cannot be undone and breaks every integration
        # using it on the next request. Five of the six revoke surfaces fired
        # on one click of a text link in a table row. See
        # ci-build/check-revoke-confirm.nu and LC-738.
        run: nu ci-build/check-revoke-confirm.nu

      - name: UI convention guard
        # The classes the 2026-08-11 UI audit closed, held closed by one grep
        # each: palette literals in templates, buttons styled as text links,
        # the open-coded .btn-danger-outline string, borders with no color
        # token, clipping admin table wrappers, raw h1 sizes, the offline
        # page's mode bootstrap and brand name, and the em-dash
        # ban. A rule whose class is not clear yet reports its hits without
        # failing, and names the issue that enables it. See
        # ci-build/check-ui-conventions.nu and LC-749.
        run: nu ci-build/check-ui-conventions.nu

      - name: Cache Rust build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cap build parallelism
        # nproc/2 cap: never claim more than half the host (see CI.md "Concurrency cap").
        run: echo "CARGO_BUILD_JOBS=$(($(nproc) / 2))" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (server, standalone)
        run: cargo clippy -p lets-chat-server --all-targets -- -D warnings

      - name: Clippy (server, saas)
        run: cargo clippy -p lets-chat-server --no-default-features --features saas --all-targets -- -D warnings

      - name: Build (server, saas)
        run: cargo build -p lets-chat-server --no-default-features --features saas

      # LC-605: run the full server suite, not just `--lib`. `cargo test -p
      # lets-chat-server` compiles AND runs every server target - the 266
      # in-crate unit tests plus the ~177 integration binaries under
      # server/tests/ - so an integration-level breakage fails the pipeline
      # (three reached main when CI ran only `--lib`; see LC-600 / LC-605). The
      # test compile builds those binaries itself, so no separate build step is
      # needed to cover them.
      #
      # This step was previously fed by a workspace `cargo build --all-targets`,
      # which also linked the desktop GUI binary and so required GTK/WebKit
      # system libs on the runner. That whole-workspace build is gone: the job
      # now mirrors `just check` (server only) and never links desktop. The
      # desktop crate is validated by build-desktop-linux.yml on push to main /
      # release (see the header comment for why it cannot run here).
      - name: Tests (server, standalone)
        run: cargo test -p lets-chat-server
