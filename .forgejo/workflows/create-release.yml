---

# Create a Forgejo release when a release/* branch is merged to main.
# Extracts the version from the branch name, generates a changelog from
# git log between the previous tag and HEAD, and creates the release
# (with tag) via the Forgejo API.
#
# Paired with the `just create-release <major|minor|hotfix>` recipe in the
# project's justfile. The recipe pushes `release/v<version>` and opens a
# PR via `fj`; this workflow tags and publishes once that PR merges.
#
# Secret: FORGEJO_PAT needs `write:repository` scope to call the
# /api/v1/repos/.../releases endpoint. Adjust the secret name if this
# repo's org uses a different convention (see governance/BUILD.md).
name: Create release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  create-release:
    name: Create release from merged PR
    if: >-
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
    # Base image: git log plus one API call, nothing compiles (LC-647).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    permissions:
      contents: write

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create release
        shell: nu {0}
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_PAT }}
        run: |
          # LC-594: org secrets do not follow a repo across orgs. FORGEJO_PAT is
          # the psa-systems convention (mokosh-server and mokosh-apps read the
          # same name), but this workflow has not run since the transfer, so
          # fail with the name rather than posting an unauthenticated request
          # and reporting whatever the API says about a malformed token header.
          if (($env.FORGEJO_TOKEN? | default "") | is-empty) {
              print --stderr "secrets.FORGEJO_PAT is unset; cannot create the release."
              print --stderr "Define it at the psa-systems org level with write:repository scope."
              exit 1
          }
          let branch = "${{ github.event.pull_request.head.ref }}"
          let tag = ($branch | str replace "release/" "")

          # Build changelog from commits since the previous tag
          let prev_tag = (do { ^git describe --tags --abbrev=0 HEAD^ } | complete)
          let changelog = if $prev_tag.exit_code == 0 {
            let prev = ($prev_tag.stdout | str trim)
            ^git log --oneline $"($prev)..HEAD" | str trim
          } else {
            # No previous tag - include all commits
            ^git log --oneline | str trim
          }

          let body = $"## Changelog\n\n($changelog)"

          let api_url = $"($env.GITHUB_SERVER_URL)/api/v1/repos/($env.GITHUB_REPOSITORY)/releases"
          let payload = {
            tag_name: $tag,
            target_commitish: "main",
            name: $tag,
            body: $body,
            draft: false,
            prerelease: false,
          }

          let response = (
            http post
              --content-type application/json
              --headers [Authorization $"token ($env.FORGEJO_TOKEN)"]
              $api_url
              $payload
          )

          print $"Release ($tag) created: ($response.html_url)"
