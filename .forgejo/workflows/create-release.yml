---

# Create a Forgejo release when a release/* branch is merged to main, by
# calling the reusable workflow in psa-systems/common (LC-761). The shared
# workflow tags the merge commit and publishes a release whose changelog is one
# line per pull request merged since the previous tag (PC-23), replacing this
# repo's former private copy whose `git log --oneline` body double-listed every
# PR as both its merge commit and the branch-side commits it already contained.
#
# Paired with `just create-release <major|minor|hotfix>` (from common.just),
# which pushes release/vX.Y.Z and opens the PR this workflow acts on once merged.
name: Create release

# pull_request_target, not pull_request (LC-1045): the job needs FORGEJO_PAT to
# tag and publish the release, and a plain `pull_request` run started from a
# fork gets a read-only token with secrets masked, so the release call would
# fail to authenticate. pull_request_target runs in the base-repo context with
# the secret available. It never checks out PR head code (it only tags the
# already-merged commit on main via the reusable workflow), so the usual
# pull_request_target code-execution risk does not apply. The `if` guard below
# reads only `merged` and `head.ref`, both present on this event too.
on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

jobs:
  create-release:
    if: >-
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
    # Pinned to the SHA the `common` submodule points at (`git ls-tree HEAD
    # common`); bump both together.
    uses: https://dev.a8n.run/psa-systems/common/.forgejo/workflows/create-release.yml@1f4d449a32d694f229b112a3f6a651534660cf55
    # MEDIUM: tags and publishes a release through the API; compiles nothing.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    # The called workflow reads only FORGEJO_PAT, so pass nothing else.
    secrets:
      FORGEJO_PAT: ${{ secrets.FORGEJO_PAT }}
