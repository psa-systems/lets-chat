---

# Publish lets-chat-desktop release artifacts.
#
# Fires on `v*` tag pushes. For each release this workflow:
#   1. Cross-builds the Linux x86_64 and Windows x86_64 desktop binaries from
#      the ci-build/Dockerfile.desktop-{linux-bundles,windows} images, with the
#      update coordinates resolved below compiled into them.
#   2. Generates `latest.json` and uploads it, the binaries and the Linux
#      bundles to the Forgejo Generic Packages API at
#      /api/packages/{owner}/generic/{package}/{version}/{filename}. Binaries
#      land under the tag version (eg. /v0.2.0/lets-chat-desktop-linux-x86_64);
#      the manifest lands under the fixed pseudo-version `latest`. This is the
#      hand-download path; the updater has not read `latest.json` since LC-733.
#   3. Pushes each binary to the container registry as an OCI artifact under
#      two tags: `latest-{os}-x86_64`, which is what the shipped self-updater
#      resolves, and `{version}-{os}-x86_64`, the rollback target. LC-831: the
#      updater has pulled its release over the OCI distribution API since
#      LC-733 and nothing published those tags, so every check answered 404.
#
# The manifest pseudo-version is overwritten every release; Generic Packages
# rejects duplicate files, so each upload is preceded by a best-effort DELETE
# that swallows the 404 a first-time release produces.
name: Publish release artifacts

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build + publish lets-chat-desktop binaries
    # Base image: both release builds run inside `docker buildx`; the runner
    # only extracts, hashes and uploads artifacts (LC-647).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    permissions:
      contents: read
      packages: write
    env:
      # Publish to the private psa-systems org via the shared org variables.
      # FORGEJO_TOKEN lives at step-env on the upload step (not job-env)
      # to match the yotun pattern - declaring it here returned an empty
      # value inside the nu step, which produced a malformed
      # `Authorization: token ` header and a 401 from the Packages
      # endpoint. PACKAGE_OWNER and PACKAGE_NAME survive at job-env fine.
      PACKAGE_OWNER: ${{ vars.PSA_SYSTEMS_PRIVATE_PACKAGE_OWNER }}
      PACKAGE_NAME: lets-chat

    steps:
      # LC-594: org variables and secrets do not follow a repo across orgs, so
      # the a8n-tools -> psa-systems move silently emptied every one of them.
      # The registry credentials failed loudly on the next push, but this
      # workflow only runs on a `v*` tag: a missing value here would surface
      # twenty-odd minutes into a release. Check every value up front so a
      # missing secret costs seconds and names itself.
      - name: Preflight required org variables and secrets
        shell: nu {0}
        env:
          # Secrets must be read at step-env: at job-env they arrive empty
          # inside a nu step (see the job-level note above).
          PACKAGE_PAT: ${{ secrets.PSA_SYSTEMS_PRIVATE_PACKAGE_PAT }}
        run: |
          # `$env.X?` rather than `$env.X`: an undefined variable is exactly the
          # state being checked for, and the bare form errors on it instead of
          # reporting it.
          let required = [
            { name: "vars.PSA_SYSTEMS_PRIVATE_PACKAGE_OWNER", value: ($env.PACKAGE_OWNER? | default "") }
            { name: "secrets.PSA_SYSTEMS_PRIVATE_PACKAGE_PAT", value: ($env.PACKAGE_PAT? | default "") }
          ]
          let missing = ($required | where {|r| $r.value | is-empty } | get name)
          if ($missing | is-not-empty) {
              print --stderr $"Missing org variables/secrets: ($missing | str join ', ')"
              print --stderr "Define them at the psa-systems org level; they do not survive a repo transfer."
              exit 1
          }
          print $"All ($required | length) required values are present."

      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Docker availability
        run: |
          docker version
          docker buildx version

      - name: Resolve release version
        id: version
        shell: nu {0}
        run: |
          # On a `v*` tag push, GITHUB_REF_NAME is exactly the tag name (eg.
          # "v0.2.0"). Use it verbatim so the package version, the manifest's
          # "version" field, and the download URLs all line up.
          let tag = $env.GITHUB_REF_NAME
          print $"Publishing version ($tag)"
          $"version=($tag)\n" | save --append $env.GITHUB_OUTPUT

      # LC-831: one definition, two consumers. The desktop builds below compile
      # these values in (desktop/src/update.rs reads both through option_env!)
      # and the OCI push step publishes to them, so the shipped client cannot
      # poll a coordinate the release never writes. Deriving both from
      # PACKAGE_OWNER / PACKAGE_NAME is LC-594's safeguard, which until now fed
      # LETS_CHAT_UPDATE_BASE_URL, a name no Rust source reads.
      - name: Resolve update registry coordinates
        shell: nu {0}
        run: |
          # The registry root is the Forgejo host itself: it serves the
          # container registry under /v2/. UPDATE_REGISTRY_HOST is the same
          # value without the scheme, which is the form an image reference
          # takes.
          let host = ($env.GITHUB_SERVER_URL | url parse | get host)
          let repository = $"($env.PACKAGE_OWNER)/($env.PACKAGE_NAME)"
          $"UPDATE_REGISTRY_URL=($env.GITHUB_SERVER_URL)\n" | save --append $env.GITHUB_ENV
          $"UPDATE_REGISTRY_HOST=($host)\n" | save --append $env.GITHUB_ENV
          $"UPDATE_REPOSITORY=($repository)\n" | save --append $env.GITHUB_ENV
          print $"LETS_CHAT_UPDATE_REGISTRY_URL=($env.GITHUB_SERVER_URL)"
          print $"LETS_CHAT_UPDATE_REPOSITORY=($repository)"

      - name: Build Linux x86_64 binary + bundles
        shell: nu {0}
        run: |
          let jobs = ((sys cpu | length) / 2 | into int)
          print $"CARGO_BUILD_JOBS=($jobs)"
          # LC-214: inject build provenance. `.dockerignore` excludes `.git/`,
          # so build.rs cannot fall back to `git` inside the container and the
          # release binary would otherwise report GIT_HASH=unknown, unlike the
          # one build-desktop-linux.yml produces from the same Dockerfile.
          let git_hash = (^git rev-parse --short=12 HEAD | str trim)
          let git_version = (^git describe --tags --always --dirty | str trim)
          let build_date = (date now | format date "%Y-%m-%dT%H:%M:%SZ")
          print $"GIT_HASH=($git_hash)"
          print $"GIT_VERSION=($git_version)"
          print $"BUILD_DATE=($build_date)"
          (
            ^docker buildx build
              --build-arg $"CARGO_BUILD_JOBS=($jobs)"
              --build-arg $"GIT_HASH=($git_hash)"
              --build-arg $"GIT_VERSION=($git_version)"
              --build-arg $"BUILD_DATE=($build_date)"
              # LC-594 / LC-831: compile in the coordinates the OCI push step
              # below publishes to, so the shipped default cannot drift from
              # where releases actually land.
              --build-arg $"LETS_CHAT_UPDATE_REGISTRY_URL=($env.UPDATE_REGISTRY_URL)"
              --build-arg $"LETS_CHAT_UPDATE_REPOSITORY=($env.UPDATE_REPOSITORY)"
              --tag lets-chat-desktop-linux:publish
              --load
              -f ci-build/Dockerfile.desktop-linux-bundles
              .
          )
          mkdir artifacts artifacts/bundle-linux
          let container = (^docker create lets-chat-desktop-linux:publish)
          (
            ^docker cp
              $"($container):/build/target/release/lets-chat-desktop"
              "artifacts/lets-chat-desktop-linux-x86_64"
          )
          # Bundles land under bundle/{deb,appimage}/ with Tauri's
          # version-stamped filenames; the upload step resolves the
          # actual filenames via `ls *.deb` / `ls *.AppImage` rather
          # than baking the version stem into this script.
          (
            ^docker cp
              $"($container):/build/target/release/bundle/deb/."
              "artifacts/bundle-linux/"
          )
          (
            ^docker cp
              $"($container):/build/target/release/bundle/appimage/."
              "artifacts/bundle-linux/"
          )
          ^docker rm $container
          print "Bundle contents:"
          ls artifacts/bundle-linux/ | print

      - name: Build Windows x86_64 binary
        shell: nu {0}
        run: |
          let jobs = ((sys cpu | length) / 2 | into int)
          print $"CARGO_BUILD_JOBS=($jobs)"
          # LC-214 provenance and LC-594 / LC-831 update coordinates: see the
          # Linux build step for both.
          let git_hash = (^git rev-parse --short=12 HEAD | str trim)
          let git_version = (^git describe --tags --always --dirty | str trim)
          let build_date = (date now | format date "%Y-%m-%dT%H:%M:%SZ")
          (
            ^docker buildx build
              --build-arg $"CARGO_BUILD_JOBS=($jobs)"
              --build-arg $"GIT_HASH=($git_hash)"
              --build-arg $"GIT_VERSION=($git_version)"
              --build-arg $"BUILD_DATE=($build_date)"
              --build-arg $"LETS_CHAT_UPDATE_REGISTRY_URL=($env.UPDATE_REGISTRY_URL)"
              --build-arg $"LETS_CHAT_UPDATE_REPOSITORY=($env.UPDATE_REPOSITORY)"
              --tag lets-chat-desktop-windows:publish
              --load
              -f ci-build/Dockerfile.desktop-windows
              .
          )
          let container = (^docker create lets-chat-desktop-windows:publish)
          (
            ^docker cp
              $"($container):/build/target/x86_64-pc-windows-gnu/release/lets-chat-desktop.exe"
              "artifacts/lets-chat-desktop-windows-x86_64.exe"
          )
          ^docker rm $container

      - name: Generate update manifest
        shell: nu {0}
        run: |
          let version = "${{ steps.version.outputs.version }}"
          let base = $"($env.GITHUB_SERVER_URL)/api/packages/($env.PACKAGE_OWNER)/generic/($env.PACKAGE_NAME)"
          # Each artifact carries its lowercase-hex SHA-256 (nushell
          # `hash sha256`). The desktop updater checks the downloaded binary
          # against this value before replacing itself, which catches a corrupt
          # or truncated download and a manifest that has drifted from the
          # binaries it names. LC-709 removed the manifest signature that used
          # to cover these hashes, so this is integrity, not authenticity.
          let deb_src = (ls artifacts/bundle-linux/*.deb | first | get name)
          let appimage_src = (ls artifacts/bundle-linux/*.AppImage | first | get name)
          let manifest = {
              version: $version,
              linux_x86_64:   { url: $"($base)/($version)/lets-chat-desktop-linux-x86_64",        sha256: (open --raw artifacts/lets-chat-desktop-linux-x86_64 | hash sha256) },
              linux_deb:      { url: $"($base)/($version)/lets-chat-desktop-linux-amd64.deb",      sha256: (open --raw $deb_src | hash sha256) },
              linux_appimage: { url: $"($base)/($version)/lets-chat-desktop-linux-amd64.AppImage", sha256: (open --raw $appimage_src | hash sha256) },
              windows_x86_64: { url: $"($base)/($version)/lets-chat-desktop-windows-x86_64.exe",   sha256: (open --raw artifacts/lets-chat-desktop-windows-x86_64.exe | hash sha256) },
          }
          $manifest | to json --indent 2 | save artifacts/latest.json
          print "Generated artifacts/latest.json:"
          open --raw artifacts/latest.json | print

      - name: Upload binaries and manifest to Generic Packages
        shell: nu {0}
        env:
          FORGEJO_TOKEN: ${{ secrets.PSA_SYSTEMS_PRIVATE_PACKAGE_PAT }}
        run: |
          let version = "${{ steps.version.outputs.version }}"
          let auth = [Authorization $"token ($env.FORGEJO_TOKEN)"]
          let server = ($env.GITHUB_SERVER_URL | url parse)
          # Tauri stamps the bundles with the crate version
          # (lets-chat_0.1.0_amd64.deb, etc.); resolve the first match
          # for each pattern so the workflow stays insulated from
          # version-string changes.
          let deb_src = (ls artifacts/bundle-linux/*.deb | first | get name)
          let appimage_src = (ls artifacts/bundle-linux/*.AppImage | first | get name)
          let uploads = [
              { src: "artifacts/lets-chat-desktop-linux-x86_64",       dest: [$version, "lets-chat-desktop-linux-x86_64"] }
              { src: $deb_src,                                         dest: [$version, "lets-chat-desktop-linux-amd64.deb"] }
              { src: $appimage_src,                                    dest: [$version, "lets-chat-desktop-linux-amd64.AppImage"] }
              { src: "artifacts/lets-chat-desktop-windows-x86_64.exe", dest: [$version, "lets-chat-desktop-windows-x86_64.exe"] }
              { src: "artifacts/latest.json",                          dest: ["latest", "latest.json"] }
          ]
          for entry in $uploads {
              let url = (
                  $server
                  | update path ([
                      "api" "packages" $env.PACKAGE_OWNER
                      "generic" $env.PACKAGE_NAME
                  ] | append $entry.dest | str join "/")
                  | url join
              )
              # Generic Packages files are immutable, so PUTting the same
              # path twice returns 409. Delete any existing copy first:
              # 204 means it was removed, 404 means nothing was there.
              # Any other status fails the step.
              print $"Deleting existing ($url) if present"
              let delete_status = (
                  http delete --full --allow-errors --headers $auth $url | get status
              )
              if $delete_status not-in [204 404] {
                  print --stderr $"Unexpected DELETE status: ($delete_status)"
                  exit 1
              }
              print $"DELETE returned ($delete_status)"

              print $"Uploading ($entry.src) to ($url)"
              (
                  http put
                      --content-type application/octet-stream
                      --headers $auth
                      $url
                      (open --raw $entry.src)
              )
          }

      # LC-831: the self-updater resolves
      # {registry}/v2/{repository}/manifests/{tag} and installs the single layer
      # that manifest names, so the release has to publish that exact shape.
      # oras packs an OCI artifact manifest with an empty config, one layer
      # holding the binary, and the release version on the manifest's
      # org.opencontainers.image.version annotation - the three things
      # desktop/src/oci.rs `parse_artifact` reads.
      #
      # Deliberately ordered after the Generic Packages upload: that path is the
      # proven one, and a registry that refuses an artifact manifest must not
      # take the hand-download artifacts down with it.
      - name: Push desktop binaries to the container registry
        shell: nu {0}
        env:
          FORGEJO_TOKEN: ${{ secrets.PSA_SYSTEMS_PRIVATE_PACKAGE_PAT }}
        run: |
          let version = "${{ steps.version.outputs.version }}"
          let repo = $"($env.UPDATE_REGISTRY_HOST)/($env.UPDATE_REPOSITORY)"
          # The `latest-*` tags are spelled out because they are a contract with
          # the shipped client: desktop/src/update.rs names the same strings, and
          # ci-build/check-update-injection.nu fails the build if the two lists
          # stop matching. The version-stamped tag is the rollback target and
          # points at the same manifest.
          let artifacts = [
              { file: "lets-chat-desktop-linux-x86_64",       tag: "latest-linux-x86_64",   version_tag: $"($version)-linux-x86_64" }
              { file: "lets-chat-desktop-windows-x86_64.exe", tag: "latest-windows-x86_64", version_tag: $"($version)-windows-x86_64" }
          ]
          for a in $artifacts {
              for tag in [$a.tag, $a.version_tag] {
                  print $"Pushing artifacts/($a.file) to ($repo):($tag)"
                  # oras runs from its own image: the runner installs no tooling
                  # (LC-647). The binary goes in with `docker cp` rather than a
                  # bind mount because this job runs inside a container whose
                  # docker daemon is the host's, so `--volume $PWD/...` would
                  # mount a host path that does not exist - the same constraint
                  # that keeps check.yml off ./dev/cargo-desktop.
                  let container = (
                    ^docker create ghcr.io/oras-project/oras:v1.2.0
                      push
                      --username $env.PACKAGE_OWNER
                      --password $env.FORGEJO_TOKEN
                      --artifact-type application/vnd.lets-chat.desktop.binary
                      --annotation $"org.opencontainers.image.version=($version)"
                      $"($repo):($tag)"
                      $"($a.file):application/octet-stream"
                  )
                  ^docker cp $"artifacts/($a.file)" $"($container):/workspace/($a.file)"
                  ^docker start --attach $container
                  ^docker rm $container
              }
          }

      - name: Print release summary
        shell: nu {0}
        run: |
          let version = "${{ steps.version.outputs.version }}"
          let base = $"($env.GITHUB_SERVER_URL)/api/packages/($env.PACKAGE_OWNER)/generic/($env.PACKAGE_NAME)"
          let repo = $"($env.UPDATE_REGISTRY_HOST)/($env.UPDATE_REPOSITORY)"
          print $"Update artifact: ($repo):latest-linux-x86_64 (rollback: ($repo):($version)-linux-x86_64)"
          print $"Update artifact: ($repo):latest-windows-x86_64 (rollback: ($repo):($version)-windows-x86_64)"
          print $"Manifest:        ($base)/latest/latest.json"
          print $"Linux binary:    ($base)/($version)/lets-chat-desktop-linux-x86_64"
          print $"Linux .deb:      ($base)/($version)/lets-chat-desktop-linux-amd64.deb"
          print $"Linux .AppImage: ($base)/($version)/lets-chat-desktop-linux-amd64.AppImage"
          print $"Windows binary:  ($base)/($version)/lets-chat-desktop-windows-x86_64.exe"
