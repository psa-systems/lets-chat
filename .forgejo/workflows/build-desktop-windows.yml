---

# Cross-build Windows desktop application and upload as artifact.
name: Build desktop (Windows)

on:
  # Releases are cut by create-release.yml, which tags the merge commit via the
  # Forgejo API. An API-created tag does NOT raise `push: tags: v*` (YOTUN-29),
  # so the versioned release bundle is built from the `release` event instead:
  # it fires for the API-created release with github.ref = refs/tags/<tag>. The
  # `release` event ignores the `paths` filter (paths only gates `push`), so a
  # release always builds.
  release:
    types:
      - published
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - "desktop/src/**"
      - "desktop/Cargo.toml"
      - "desktop/build.rs"
      - "desktop/tauri.conf.json"
      - "desktop/capabilities/**"
      - "desktop/icons/**"
      - "server/src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "ci-build/Dockerfile.desktop-windows"
      - "ci-build/Dockerfile.desktop-windows-installer"
      - "desktop/installer/**"
      - "ci-build/get-tags.nu"
      - ".forgejo/workflows/build-desktop-windows.yml"

jobs:
  build-desktop:
    name: Build desktop (Windows x86_64)
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    permissions:
      contents: read
      packages: write
    env:
      # Publish to the shared psa-systems private org Generic Packages
      # registry, matching every other repo in ~/projects/a8n-run/.
      # FORGEJO_TOKEN lives at step-env (not job-env) below to match the
      # yotun pattern - declaring it here returned an empty value inside
      # the nu step, which produced a malformed `Authorization: token `
      # header and a 401 from the Packages endpoint. PACKAGE_OWNER and
      # PACKAGE_NAME survive at job-env fine.
      PACKAGE_OWNER: ${{ vars.PSA_SYSTEMS_PRIVATE_PACKAGE_OWNER }}
      PACKAGE_NAME: lets-chat

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Docker availability
        run: |
          docker version
          docker buildx version

      - name: Get version tag
        id: get-version
        shell: nu {0}
        run: |
          # GOV-13: resolve the Generic Packages path label (`version`) from the
          # TRIGGER, never from `git describe`. A release commit is at once a
          # push to `main` and the tagged commit, so a describe-derived label
          # made the main-push run and the tag/release run resolve the SAME
          # `vX.Y.Z` path and race to DELETE-then-PUT the same immutable
          # generic-package file (409 package file already exists). A
          # release/tag build publishes under its semver tag; every other build
          # is a `push: branches: main` build and publishes under the moving
          # `latest` package. The two trains write disjoint paths, so they never
          # collide. (`version` keeps the leading `v` - the registry path and
          # artifact filenames both include it.)
          let event_name = "${{ github.event_name }}"
          let git_ref = "${{ github.ref }}"
          let version = if ($event_name == "release") or ($git_ref | str starts-with "refs/tags/") {
              $git_ref | str replace --regex '^refs/tags/' ''
          } else {
              "latest"
          }
          print $"Version: ($version)"
          $"version=($version)\n" | save --append $env.GITHUB_OUTPUT

      - name: Build desktop application
        shell: nu {0}
        run: |
          # CARGO_BUILD_JOBS caps cargo's parallel rustc + build-script
          # workers. The desktop and OCI builds share a runner, so each
          # takes nproc/2 to leave the host fully used without
          # oversubscription.
          let jobs = ((sys cpu | length) / 2 | into int)
          # LC-214: inject build provenance. .dockerignore excludes .git/
          # so build.rs cannot fall back to `git`; without these
          # --build-args the Windows binary bakes "unknown" into
          # version::banner.
          let git_hash = (^git rev-parse --short=12 HEAD | str trim)
          let git_version = (^git describe --tags --always --dirty | str trim)
          let build_date = (date now | format date "%Y-%m-%dT%H:%M:%SZ")
          print $"CARGO_BUILD_JOBS=($jobs)"
          print $"GIT_HASH=($git_hash)"
          print $"GIT_VERSION=($git_version)"
          print $"BUILD_DATE=($build_date)"
          (
            ^docker buildx build
              --build-arg $"CARGO_BUILD_JOBS=($jobs)"
              --build-arg $"GIT_HASH=($git_hash)"
              --build-arg $"GIT_VERSION=($git_version)"
              --build-arg $"BUILD_DATE=($build_date)"
              --tag lets-chat-desktop-windows:build
              --load
              -f ci-build/Dockerfile.desktop-windows
              .
          )

      - name: Extract build artifact
        shell: nu {0}
        run: |
          let version = "${{ steps.get-version.outputs.version }}"
          let container = (^docker create lets-chat-desktop-windows:build)
          mkdir artifacts
          (
            ^docker cp
              $"($container):/build/target/x86_64-pc-windows-gnu/release/lets-chat-desktop.exe"
              "artifacts/"
          )
          ^docker rm $container
          # Keep the plain `lets-chat-desktop.exe` in place (the installer
          # Dockerfile COPYs it from the build context) AND make the versioned
          # copy the upload step publishes.
          let dest = $"artifacts/lets-chat-desktop-($version)-windows-x86_64.exe"
          cp artifacts/lets-chat-desktop.exe $dest
          print $"Artifact: ($dest)"

      - name: Build Windows installer
        shell: nu {0}
        run: |
          let version = "${{ steps.get-version.outputs.version }}"
          # Wrap the cross-built exe (already staged at
          # artifacts/lets-chat-desktop.exe) in an NSIS installer, built from
          # Linux with makensis. LC-131 - no Windows host, no wine.
          (
            ^docker buildx build
              --build-arg $"APP_VERSION=($version)"
              --tag lets-chat-windows-installer:build
              --load
              -f ci-build/Dockerfile.desktop-windows-installer
              .
          )
          let container = (^docker create lets-chat-windows-installer:build)
          (
            ^docker cp
              $"($container):/out/lets-chat-desktop-setup-x86_64.exe"
              $"artifacts/lets-chat-desktop-setup-($version)-windows-x86_64.exe"
          )
          # LC-180: the same image also emits the portable .zip fallback
          # (raw exe + WebView2 bootstrapper + user README). Pull it from the
          # same container before removing it.
          (
            ^docker cp
              $"($container):/out/lets-chat-desktop-windows-x86_64.zip"
              $"artifacts/lets-chat-desktop-($version)-windows-x86_64.zip"
          )
          ^docker rm $container
          print $"Installer: artifacts/lets-chat-desktop-setup-($version)-windows-x86_64.exe"
          print $"Portable zip: artifacts/lets-chat-desktop-($version)-windows-x86_64.zip"

      - name: Upload binary to Generic Packages
        shell: nu {0}
        env:
          FORGEJO_TOKEN: ${{ secrets.PSA_SYSTEMS_PRIVATE_PACKAGE_PAT }}
        run: |
          let version = "${{ steps.get-version.outputs.version }}"
          # Stable filename so the desktop self-updater's manifest can hard-code
          # `${base}/${version}/lets-chat-desktop-windows-x86_64.exe`.
          let file = "lets-chat-desktop-windows-x86_64.exe"
          let src = $"artifacts/lets-chat-desktop-($version)-windows-x86_64.exe"
          # Build the URL by parsing GITHUB_SERVER_URL into a record,
          # rewriting the path, and joining it back. Cleaner than dense
          # string interpolation and lets `url join` handle encoding.
          let url = (
            $env.GITHUB_SERVER_URL
            | url parse
            | update path ([
                "api"
                "packages"
                $env.PACKAGE_OWNER
                "generic"
                $env.PACKAGE_NAME
                $version
                $file
              ] | str join "/")
            | url join
          )
          let auth = [Authorization $"token ($env.FORGEJO_TOKEN)"]

          # Generic Packages files are immutable, so PUTting the same path
          # twice returns 409. Delete any existing copy first: 204 means
          # it was removed, 404 means nothing was there to remove. Any
          # other status fails the step (yotun pattern).
          print $"Deleting existing ($url) if present"
          let delete_status = (
            http delete --full --allow-errors --headers $auth $url | get status
          )
          if $delete_status not-in [204 404] {
            print --stderr $"Unexpected DELETE status: ($delete_status)"
            exit 1
          }
          print $"DELETE returned ($delete_status)"

          print $"Uploading ($src) to ($url)"
          (
            http put
              --content-type application/octet-stream
              --headers $auth
              $url
              (open --raw $src)
          )
          print $"Uploaded ($file) to generic registry as ($env.PACKAGE_NAME)/($version)"

      - name: Upload installer to Generic Packages
        shell: nu {0}
        env:
          FORGEJO_TOKEN: ${{ secrets.PSA_SYSTEMS_PRIVATE_PACKAGE_PAT }}
        run: |
          let version = "${{ steps.get-version.outputs.version }}"
          # Stable filename, parallel to the raw binary above (LC-131).
          let file = "lets-chat-desktop-setup-windows-x86_64.exe"
          let src = $"artifacts/lets-chat-desktop-setup-($version)-windows-x86_64.exe"
          let url = (
            $env.GITHUB_SERVER_URL
            | url parse
            | update path ([
                "api"
                "packages"
                $env.PACKAGE_OWNER
                "generic"
                $env.PACKAGE_NAME
                $version
                $file
              ] | str join "/")
            | url join
          )
          let auth = [Authorization $"token ($env.FORGEJO_TOKEN)"]

          # Generic Packages files are immutable: delete-then-PUT (204/404 ok).
          print $"Deleting existing ($url) if present"
          let delete_status = (
            http delete --full --allow-errors --headers $auth $url | get status
          )
          if $delete_status not-in [204 404] {
            print --stderr $"Unexpected DELETE status: ($delete_status)"
            exit 1
          }
          print $"DELETE returned ($delete_status)"

          print $"Uploading ($src) to ($url)"
          (
            http put
              --content-type application/octet-stream
              --headers $auth
              $url
              (open --raw $src)
          )
          print $"Uploaded ($file) to generic registry as ($env.PACKAGE_NAME)/($version)"

      - name: Upload portable zip to Generic Packages
        shell: nu {0}
        env:
          FORGEJO_TOKEN: ${{ secrets.PSA_SYSTEMS_PRIVATE_PACKAGE_PAT }}
        run: |
          let version = "${{ steps.get-version.outputs.version }}"
          # LC-180: stable filename, parallel to the installer/raw binary.
          let file = "lets-chat-desktop-windows-x86_64.zip"
          let src = $"artifacts/lets-chat-desktop-($version)-windows-x86_64.zip"
          let url = (
            $env.GITHUB_SERVER_URL
            | url parse
            | update path ([
                "api"
                "packages"
                $env.PACKAGE_OWNER
                "generic"
                $env.PACKAGE_NAME
                $version
                $file
              ] | str join "/")
            | url join
          )
          let auth = [Authorization $"token ($env.FORGEJO_TOKEN)"]

          # Generic Packages files are immutable: delete-then-PUT (204/404 ok).
          print $"Deleting existing ($url) if present"
          let delete_status = (
            http delete --full --allow-errors --headers $auth $url | get status
          )
          if $delete_status not-in [204 404] {
            print --stderr $"Unexpected DELETE status: ($delete_status)"
            exit 1
          }
          print $"DELETE returned ($delete_status)"

          print $"Uploading ($src) to ($url)"
          (
            http put
              --content-type application/zip
              --headers $auth
              $url
              (open --raw $src)
          )
          print $"Uploaded ($file) to generic registry as ($env.PACKAGE_NAME)/($version)"
