---

# Cross-build Windows desktop application and upload as artifact.
name: Build desktop (Windows)

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - "desktop/src/**"
      - "desktop/Cargo.toml"
      - "server/src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "ci-build/Dockerfile.desktop-windows"
      - "ci-build/get-tags.nu"
      - ".forgejo/workflows/build-desktop-windows.yml"

jobs:
  build-desktop:
    name: Build desktop (Windows x86_64)
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    permissions:
      contents: read
      packages: write
    env:
      # Publish to the shared a8n-tools private org Generic Packages
      # registry, matching every other repo in ~/projects/a8n-run/
      # (see eg. da-os/.forgejo/workflows/build-windows.yml). Previously
      # this workflow only uploaded the binary as a workflow-run
      # artifact, which is invisible to anything outside the runs UI -
      # in particular to the desktop self-updater, which reads from
      # /api/packages/{owner}/generic/lets-chat/{version}/{filename}.
      FORGEJO_TOKEN: ${{ secrets.A8N_TOOLS_PRIVATE_PACKAGE_PAT }}
      PACKAGE_OWNER: ${{ vars.A8N_TOOLS_PRIVATE_PACKAGE_OWNER }}
      PACKAGE_NAME: lets-chat

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Docker availability
        run: |
          docker version
          docker buildx version

      - name: Get version tag
        id: get-version
        shell: nu {0}
        run: |
          let describe = (^git describe --tags --always | str trim)
          let parts = ($describe | parse --regex '^(?<tag>.+)-\d+-g[0-9a-f]+$')
          let version = if ($parts | is-not-empty) {
              $parts.tag.0
          } else if ($describe | str starts-with "v") {
              $describe
          } else {
              "latest"
          }
          print $"Version: ($version)"
          $"version=($version)\n" | save --append $env.GITHUB_OUTPUT

      - name: Build desktop application
        shell: nu {0}
        run: |
          # CARGO_BUILD_JOBS caps cargo's parallel rustc + build-script
          # workers. The desktop and OCI builds share a runner, so each
          # takes nproc/2 to leave the host fully used without
          # oversubscription.
          let jobs = ((sys cpu | length) / 2 | into int)
          print $"CARGO_BUILD_JOBS=($jobs)"
          (
            ^docker buildx build
              --build-arg $"CARGO_BUILD_JOBS=($jobs)"
              --tag lets-chat-desktop-windows:build
              --load
              -f ci-build/Dockerfile.desktop-windows
              .
          )

      - name: Extract build artifact
        shell: nu {0}
        run: |
          let version = "${{ steps.get-version.outputs.version }}"
          let container = (^docker create lets-chat-desktop-windows:build)
          mkdir artifacts
          (
            ^docker cp
              $"($container):/build/target/x86_64-pc-windows-gnu/release/lets-chat-desktop.exe"
              "artifacts/"
          )
          ^docker rm $container
          let dest = $"artifacts/lets-chat-desktop-($version)-windows-x86_64.exe"
          mv artifacts/lets-chat-desktop.exe $dest
          print $"Artifact: ($dest)"

      - name: Upload binary to Generic Packages
        shell: nu {0}
        run: |
          let version = "${{ steps.get-version.outputs.version }}"
          # Stable filename so the desktop self-updater's manifest can hard-code
          # `${base}/${version}/lets-chat-desktop-windows-x86_64.exe`.
          let file = "lets-chat-desktop-windows-x86_64.exe"
          let src = $"artifacts/lets-chat-desktop-($version)-windows-x86_64.exe"
          # Build the URL by parsing GITHUB_SERVER_URL into a record,
          # rewriting the path, and joining it back. Cleaner than dense
          # string interpolation and lets `url join` handle encoding.
          let url = (
            $env.GITHUB_SERVER_URL
            | url parse
            | update path ([
                "api"
                "packages"
                $env.PACKAGE_OWNER
                "generic"
                $env.PACKAGE_NAME
                $version
                $file
              ] | str join "/")
            | url join
          )
          let auth = [Authorization $"token ($env.FORGEJO_TOKEN)"]

          # Generic Packages files are immutable, so PUTting the same path
          # twice returns 409. Delete any existing copy first: 204 means
          # it was removed, 404 means nothing was there to remove. Any
          # other status fails the step (yotun pattern).
          print $"Deleting existing ($url) if present"
          let delete_status = (
            http delete --full --allow-errors --headers $auth $url | get status
          )
          if $delete_status not-in [204 404] {
            print --stderr $"Unexpected DELETE status: ($delete_status)"
            exit 1
          }
          print $"DELETE returned ($delete_status)"

          print $"Uploading ($src) to ($url)"
          (
            http put
              --content-type application/octet-stream
              --headers $auth
              $url
              (open --raw $src)
          )
          print $"Uploaded ($file) to generic registry as ($env.PACKAGE_NAME)/($version)"
