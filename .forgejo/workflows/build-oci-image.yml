---

# Build OCI image and push to Forgejo Container Registry.
name: Build OCI container

on:
  push:
    branches:
      - "main"
      - "feat/oauth"
    tags:
      - "v*"
    paths:
      - "server/src/**"
      - "server/migrations/**"
      - "server/templates/**"
      - "server/assets/**"
      - "server/package.json"
      - "server/bun.lock"
      - "server/tailwind.config.js"
      - "Cargo.toml"
      - "Cargo.lock"
      - "ci-build/Dockerfile.web"
      - "ci-build/get-tags.nu"
      - ".forgejo/workflows/build-oci-image.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, compute tags and print every registry action without pushing"
        type: boolean
        default: true
      simulate_tag:
        description: "Version like v9.9.9 to exercise the release publish path; empty exercises latest"
        type: string
        default: ""

jobs:
  build-and-push:
    name: Build and push lets-chat
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REGISTRY: ""
      REGISTRY_PROVIDER: dev.a8n.run
      # Push to the shared a8n-tools private org registry via the same org
      # variables every other repo under ~/projects/a8n-run/ uses (see eg.
      # backup, eform, saas, storefront). Previously this workflow used
      # `GITHUB_REPOSITORY_OWNER` + `secrets.FORGEJO_PAT`, which pinned the
      # image to whichever owner happened to host the repo and depended on a
      # PAT name not standard across the org.
      REGISTRY_OWNER: ${{ vars.A8N_TOOLS_PRIVATE_PACKAGE_OWNER }}
      REGISTRY_USER: ""
      REGISTRY_PASSWORD: ${{ secrets.A8N_TOOLS_PRIVATE_PACKAGE_PAT }}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Docker availability
        run: |
          docker version
          docker buildx version

      - name: Set up buildx builder
        run: |
          docker buildx create --name container-builder --driver docker-container --use

      - name: Export Actions runtime env for buildx gha cache
        # A raw `docker buildx build` (unlike docker/build-push-action)
        # does not auto-inject the gha cache backend's env, and
        # ACTIONS_RUNTIME_TOKEN is masked from run: steps. This action
        # re-exports ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN into
        # GITHUB_ENV so the build step's `type=gha` cache can reach
        # act_runner's cache server (needs runner cache.enabled: true).
        uses: https://github.com/crazy-max/ghaction-github-runtime@v3

      - name: Set environment variables
        shell: nu {0}
        run: |
          let owner = $env.REGISTRY_OWNER
          $"REGISTRY_USER=($owner)\n" | save --append $env.GITHUB_ENV
          $"IMAGE_REGISTRY=($env.REGISTRY_PROVIDER)/($owner)\n" | save --append $env.GITHUB_ENV

      - name: Resolve publish mode, train and tag
        id: resolve
        shell: nu {0}
        run: |
          # Derive the publish mode from the trigger, never from git describe:
          # a tag ref -> release (push :vX.Y.Z only), a main push -> latest
          # (push :latest only), a manual run -> dry-run. A release commit fires
          # BOTH the main-push and the tag-push events; resolving disjoint tags
          # per trigger is what stops the two runs from racing to overwrite the
          # same :latest tag (governance GOV-13).
          let event = "${{ github.event_name }}"
          let ref_type = "${{ github.ref_type }}"
          let ref_name = "${{ github.ref_name }}"
          let simulate_tag = "${{ inputs.simulate_tag }}"
          let mode = if $event == "workflow_dispatch" {
            "dry-run"
          } else if $ref_type == "tag" {
            "release"
          } else {
            "latest"
          }
          # A manual run only mutates the registry if dry_run is explicitly false;
          # the input defaults to true, and push events always publish for real.
          let dry_run = ($event == "workflow_dispatch" and "${{ inputs.dry_run }}" != "false")
          let r = (^nu ci-build/get-tags.nu --mode $mode --ref-name $ref_name --simulate-tag $simulate_tag --json | from json)
          $"mode=($r.mode)\n" | save --append $env.GITHUB_OUTPUT
          $"train=($r.train)\n" | save --append $env.GITHUB_OUTPUT
          $"tag=($r.tag)\n" | save --append $env.GITHUB_OUTPUT
          $"describe=($r.describe)\n" | save --append $env.GITHUB_OUTPUT
          $"dry_run=($dry_run)\n" | save --append $env.GITHUB_OUTPUT
          print $"mode=($r.mode) train=($r.train) tag=($r.tag) describe=($r.describe) dry_run=($dry_run)"

      - name: Log in to container registry
        shell: nu {0}
        run: |
          ^docker login --username $env.REGISTRY_USER --password $env.REGISTRY_PASSWORD $env.REGISTRY_PROVIDER

      - name: Build and push image
        shell: nu {0}
        run: |
          let tag = "${{ steps.resolve.outputs.tag }}"
          let dry_run = ("${{ steps.resolve.outputs.dry_run }}" == "true")
          let image = "lets-chat"
          let registry = $env.IMAGE_REGISTRY
          let tag_args = [-t $"($registry)/($image):($tag)"]
          # Cache to act_runner's built-in Actions cache server (type=gha) instead of the
          # registry. type=registry round-tripped ~1.7 GiB over the WAN every build and 499'd
          # the export on slow-upload runners, so reuse never worked there.
          let cache_from = "type=gha"
          # mode=max keeps the dependency-build layer; ignore-error keeps a cache hiccup (or a
          # disabled runner cache) from failing the build.
          let cache_to = "type=gha,mode=max,ignore-error=true"
          # A dry-run builds locally and pushes nothing (and writes no cache so a
          # manual run never mutates the registry or the gha cache); a real run
          # pushes and writes the gha buildcache.
          let push_args = if $dry_run { [--load] } else { [--push --cache-to $cache_to] }
          # nproc/2 cap on cargo workers. See the matching block in
          # build-desktop-linux.yml for rationale.
          let jobs = ((sys cpu | length) / 2 | into int)
          # LC-214: inject build provenance. The Dockerfile ARG defaults are
          # `unknown`; without these --build-args the compiled binary would
          # bake "unknown" into version::banner and the admin nav badge.
          # `.dockerignore` excludes `.git/`, so build.rs's fallback to
          # invoking `git` inside the container cannot recover the values.
          # BUILD_DATE captured once here so all images in this build share
          # the same wall-clock anchor.
          let git_hash = (^git rev-parse --short=12 HEAD | str trim)
          let git_version = (^git describe --tags --always --dirty | str trim)
          let build_date = (date now | format date "%Y-%m-%dT%H:%M:%SZ")
          print $"CARGO_BUILD_JOBS=($jobs)"
          print $"GIT_HASH=($git_hash)"
          print $"GIT_VERSION=($git_version)"
          print $"BUILD_DATE=($build_date)"
          let action = if $dry_run { "[dry-run] WOULD build and push" } else { "Building and pushing" }
          print $"($action) ($image) with tag: ($tag)"
          (
            ^docker buildx build
              ...$push_args
              --cache-from $cache_from
              --build-arg $"CARGO_BUILD_JOBS=($jobs)"
              --build-arg $"GIT_HASH=($git_hash)"
              --build-arg $"GIT_VERSION=($git_version)"
              --build-arg $"BUILD_DATE=($build_date)"
              ...$tag_args
              -f ci-build/Dockerfile.web
              .
          )

      - name: Print image URLs
        shell: nu {0}
        run: |
          let tag = "${{ steps.resolve.outputs.tag }}"
          let dry_run = ("${{ steps.resolve.outputs.dry_run }}" == "true")
          let prefix = if $dry_run { "[dry-run] WOULD push image to" } else { "Image pushed to" }
          let image = "lets-chat"
          let registry = $env.IMAGE_REGISTRY
          print $"($prefix) ($registry)/($image):($tag)"
