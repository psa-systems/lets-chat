---

# Build Linux desktop application and upload as artifact.
name: Build desktop (Linux)

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - "src/**"
      - "migrations/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/**"
      - "Dioxus.toml"
      - "ci-build/Dockerfile.desktop-linux"
      - "ci-build/get-tags.nu"
      - ".forgejo/workflows/build-desktop-linux.yml"

jobs:
  build-desktop:
    name: Build desktop (Linux x86_64)
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    permissions:
      contents: read

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Verify Docker availability
        run: |
          docker version
          docker buildx version

      - name: Get version tag
        id: get-version
        shell: nu {0}
        run: |
          let describe = (^git describe --tags --always | str trim)
          let parts = ($describe | parse --regex '^(?<tag>.+)-\d+-g[0-9a-f]+$')
          let version = if ($parts | is-not-empty) {
              $parts.tag.0
          } else if ($describe | str starts-with "v") {
              $describe
          } else {
              "latest"
          }
          print $"Version: ($version)"
          $"version=($version)\n" | save --append $env.GITHUB_OUTPUT

      - name: Build desktop application
        run: |
          docker buildx build --tag lets-chat-desktop:build -f ci-build/Dockerfile.desktop-linux .

      - name: Extract build artifact
        shell: nu {0}
        run: |
          let version = "${{ steps.get-version.outputs.version }}"
          let container = (^docker create lets-chat-desktop:build)
          mkdir artifacts
          ^docker cp $"($container):/build/target/dx/lets-chat/release/linux/app/lets-chat" "artifacts/"
          ^docker rm $container
          let dest = $"artifacts/lets-chat-($version)-linux-x86_64"
          mv artifacts/lets-chat $dest
          print $"Artifact: ($dest)"

      - name: Upload artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: lets-chat-linux-x86_64
          path: artifacts/lets-chat-*
          retention-days: 90
