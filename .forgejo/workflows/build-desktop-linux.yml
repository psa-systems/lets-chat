---

# Build Linux desktop application and upload as artifact.
name: Build desktop (Linux)

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - "desktop/src/**"
      - "desktop/Cargo.toml"
      - "server/src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "ci-build/Dockerfile.desktop-linux"
      - "ci-build/get-tags.nu"
      - ".forgejo/workflows/build-desktop-linux.yml"

jobs:
  build-desktop:
    name: Build desktop (Linux x86_64)
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    permissions:
      contents: read
      packages: write
    env:
      # Publish to the shared a8n-tools private org Generic Packages
      # registry, matching every other repo in ~/projects/a8n-run/
      # (see eg. da-os/.forgejo/workflows/build-linux.yml). Previously
      # this workflow only uploaded the binary as a workflow-run
      # artifact, which is invisible to anything outside the runs UI -
      # in particular to the desktop self-updater, which reads from
      # /api/packages/{owner}/generic/lets-chat/{version}/{filename}.
      FORGEJO_TOKEN: ${{ secrets.A8N_TOOLS_PRIVATE_PACKAGE_PAT }}
      PACKAGE_OWNER: ${{ vars.A8N_TOOLS_PRIVATE_PACKAGE_OWNER }}
      PACKAGE_NAME: lets-chat

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Docker availability
        run: |
          docker version
          docker buildx version

      - name: Get version tag
        id: get-version
        shell: nu {0}
        run: |
          let describe = (^git describe --tags --always | str trim)
          let parts = ($describe | parse --regex '^(?<tag>.+)-\d+-g[0-9a-f]+$')
          let version = if ($parts | is-not-empty) {
              $parts.tag.0
          } else if ($describe | str starts-with "v") {
              $describe
          } else {
              "latest"
          }
          print $"Version: ($version)"
          $"version=($version)\n" | save --append $env.GITHUB_OUTPUT

      - name: Build desktop application
        shell: nu {0}
        run: |
          # CARGO_BUILD_JOBS caps cargo's parallel rustc + build-script
          # workers. The desktop and OCI builds share a runner, so each
          # takes nproc/2 to leave the host fully used without
          # oversubscription.
          let jobs = ((sys cpu | length) / 2 | into int)
          print $"CARGO_BUILD_JOBS=($jobs)"
          (
            ^docker buildx build
              --build-arg $"CARGO_BUILD_JOBS=($jobs)"
              --tag lets-chat-desktop:build
              --load
              -f ci-build/Dockerfile.desktop-linux
              .
          )

      - name: Extract build artifact
        shell: nu {0}
        run: |
          let version = "${{ steps.get-version.outputs.version }}"
          let container = (^docker create lets-chat-desktop:build)
          mkdir artifacts
          ^docker cp $"($container):/build/target/release/lets-chat-desktop" "artifacts/"
          ^docker rm $container
          let dest = $"artifacts/lets-chat-desktop-($version)-linux-x86_64"
          mv artifacts/lets-chat-desktop $dest
          print $"Artifact: ($dest)"

      - name: Upload binary to Generic Packages
        shell: nu {0}
        run: |
          let version = "${{ steps.get-version.outputs.version }}"
          # Stable filename so the desktop self-updater's manifest can hard-code
          # `${base}/${version}/lets-chat-desktop-linux-x86_64`.
          let file = "lets-chat-desktop-linux-x86_64"
          let src = $"artifacts/lets-chat-desktop-($version)-linux-x86_64"
          let base = $"($env.GITHUB_SERVER_URL)/api/packages/($env.PACKAGE_OWNER)/generic/($env.PACKAGE_NAME)"
          let url = $"($base)/($version)/($file)"
          let auth = $"Authorization: token ($env.FORGEJO_TOKEN)"
          # Best-effort DELETE so re-runs of the same version overwrite cleanly
          # (Forgejo Generic Packages rejects duplicate paths on PUT). A 404
          # is fine; anything else still lets the PUT below decide.
          print $"DELETE ($url)"
          (
              ^curl
                  --silent
                  --show-error
                  --output /dev/null
                  --write-out "%{http_code}\n"
                  --header $auth
                  --request DELETE
                  $url
          )
          print $"PUT ($url)"
          (
              ^curl
                  --silent
                  --show-error
                  --fail
                  --header $auth
                  --upload-file $src
                  $url
          )
          print $"Uploaded ($file) to generic registry as ($env.PACKAGE_NAME)/($version)"
