# Publishes this repo's docs to docs.a8n.systems under /docs/lets-chat.
source = "lets-chat"
base_path = "/docs/lets-chat"
include = ["README.md", "src/**/*.rs", "**/src/**/*.rs"]
exclude = ["CLAUDE.md", "docs/**", "common/**", "tests/**", "**/tests/**", "target/**", "**/target/**"]

[storefront]
url = "https://docs.a8n.systems"
site = "docs"
