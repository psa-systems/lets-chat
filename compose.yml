---
# Production-style Docker Compose for lets-chat.
# Builds the multi-stage runtime image and exposes it on port 8080.

services:

  app:
    build:
      context: .
      dockerfile: ci-build/Dockerfile.web
    container_name: dev-lets-chat-app-${USER}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    # Only the basics are set inline. The required Bunyip SSO vars and all
    # optional features (SMTP mail, server-side call transcription via
    # LETS_CHAT_STT_URL, AI transcript summaries via LETS_CHAT_LLM_URL, ...) are
    # supplied via an env file - copy .env.standalone (or .env.saas), fill it in,
    # and add `env_file: [.env.standalone]` here (or run with `--env-file`).
    environment:
      RUST_LOG: lets_chat=info
      LETS_CHAT_DATA_DIR: /data
      BIND_ADDR: 0.0.0.0:8080
    volumes:
      - lets-chat-data:/data

volumes:
  lets-chat-data:
